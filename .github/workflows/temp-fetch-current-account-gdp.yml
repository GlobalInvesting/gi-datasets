name: TEMP Fetch Current Account / GDP (private scripts)
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Push the result (leave off first to review the values in the log)
        required: true
        default: false
        type: boolean
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
concurrency:
  group: fetch-current-account-gdp
  cancel-in-progress: false
jobs:
  fetch-current-account-gdp:
    name: Fetch Current Account / GDP (private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests --break-system-packages
    - name: Create output directory
      run: mkdir -p current-account-data
    - name: Fetch current account / GDP
      env:
        SITE_DIR: .
      run: python3 private-scripts/fetch_current_account_gdp.py
    - name: Display summary
      if: always()
      run: |
        for ccy in USD EUR GBP JPY AUD CAD CHF NZD NOK SEK; do
          if [ -f "current-account-data/${ccy}.json" ]; then
            python3 -c "
        import json
        d = json.load(open('current-account-data/${ccy}.json'))
        print('${ccy}: ca_pct_gdp=%s (%s)  tb_pct_gdp=%s (%s)  gdp_asof=%s' % (d.get('ca_pct_gdp'), d.get('ca_period'), d.get('tb_pct_gdp'), d.get('tb_period'), d.get('nominal_gdp_asof')))"
          else
            echo "${ccy}: file not found"
          fi
        done
        git diff --shortstat
    - name: Commit and push
      if: ${{ inputs.commit }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p /tmp/ca_fresh
        cp -r current-account-data/. /tmp/ca_fresh/
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        for i in 1 2 3 4 5; do
          echo "--- Attempt $i ---"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p current-account-data
          cp -r /tmp/ca_fresh/. current-account-data/
          git add current-account-data/
          if git diff --staged --quiet; then
            echo "No changes vs remote HEAD - skipping commit."
            exit 0
          fi
          git commit -m "Current Account / GDP data ${TIMESTAMP} (GDP-normalized CA/TB, BEER vars 4-5)"
          if git push origin main; then
            echo "Push succeeded on attempt $i."
            exit 0
          fi
          sleep $((i * 2))
        done
        echo "All push attempts exhausted."
        exit 1
