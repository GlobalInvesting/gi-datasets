name: TEMP Backfill Fair Value (private scripts)
on:
  workflow_dispatch:
    inputs:
      refresh_inputs:
        description: Re-run the current account / GDP fetch first
        required: true
        default: true
        type: boolean
      columns:
        description: Columns the backfill rewrites (ca_tb keeps prod_diff untouched)
        required: true
        default: ca_tb
        type: choice
        options:
        - ca_tb
        - all
      recompute:
        description: Regenerate the regression summary and the history CSV afterwards
        required: true
        default: true
        type: boolean
      commit:
        description: Push the result (leave off first to review the before/after table in the log)
        required: true
        default: false
        type: boolean
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
concurrency:
  group: log-fair-value-inputs
  cancel-in-progress: false
jobs:
  backfill:
    name: Backfill Fair Value (private)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests --break-system-packages
    - name: Create output directories
      run: mkdir -p current-account-data fair-value-data
    - name: Fetch current account / GDP
      if: ${{ inputs.refresh_inputs }}
      env:
        SITE_DIR: .
      run: python3 private-scripts/fetch_current_account_gdp.py
    - name: Snapshot current regression summary
      run: |
        if [ -f fair-value-data/summary.json ]; then cp fair-value-data/summary.json /tmp/summary_before.json; fi
    - name: Backfill fair value history
      env:
        SITE_DIR: .
        BACKFILL_COLUMNS: ${{ inputs.columns }}
      run: python3 private-scripts/backfill_fair_value_history.py
    - name: Compute Fair Value regression
      if: ${{ inputs.recompute }}
      env:
        SITE_DIR: .
      run: python3 private-scripts/compute_fair_value.py
    - name: Export Fair Value history CSV
      if: ${{ inputs.recompute }}
      env:
        SITE_DIR: .
      run: python3 private-scripts/export_fair_value_history.py
    - name: Before and after per pair
      if: ${{ inputs.recompute }}
      run: |
        python3 - <<'PY'
        import json, os
        if not os.path.exists('/tmp/summary_before.json'):
            raise SystemExit('no previous summary to compare against')
        a = json.load(open('/tmp/summary_before.json'))['pairs']
        b = json.load(open('fair-value-data/summary.json'))['pairs']
        flagged = 0
        print('pair      z_before  z_after   identifiable  lambda')
        for k in sorted(b):
            za, zb = a.get(k, {}).get('z'), b[k].get('z')
            ia, ib = a.get(k, {}).get('identifiable'), b[k].get('identifiable')
            big = za is not None and zb is not None and abs(za - zb) > 1
            odd = zb is not None and abs(zb) > 4
            if big or odd or ia != ib:
                flagged += 1
                print('%-8s %8s %8s   %s -> %s   %s -> %s' % (k, za, zb, ia, ib, a.get(k, {}).get('lambda'), b[k].get('lambda')))
        print('pairs flagged: %d of %d' % (flagged, len(b)))
        print('identifiable before/after: %d / %d' % (sum(1 for v in a.values() if v.get('identifiable')), sum(1 for v in b.values() if v.get('identifiable'))))
        PY
    - name: Display summary
      if: always()
      run: |
        echo "Current account / GDP"
        for ccy in USD EUR GBP JPY AUD CAD CHF NZD NOK SEK; do
          if [ -f "current-account-data/${ccy}.json" ]; then
            python3 -c "
        import json
        d = json.load(open('current-account-data/${ccy}.json'))
        print('  ${ccy}: ca_pct_gdp=%s (%s)  tb_pct_gdp=%s (%s)' % (d.get('ca_pct_gdp'), d.get('ca_period'), d.get('tb_pct_gdp'), d.get('tb_period')))"
          fi
        done
        echo "Changed files"
        git status --short | head -n 80
        git diff --shortstat
    - name: Commit and push
      if: ${{ inputs.commit }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p /tmp/ca_fresh /tmp/fv_fresh
        cp -r current-account-data/. /tmp/ca_fresh/
        cp -r fair-value-data/. /tmp/fv_fresh/
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        for i in 1 2 3 4 5; do
          echo "--- Attempt $i ---"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p current-account-data fair-value-data
          cp -r /tmp/ca_fresh/. current-account-data/
          cp -r /tmp/fv_fresh/. fair-value-data/
          git add current-account-data/ fair-value-data/
          if git diff --staged --quiet; then
            echo "No changes vs remote HEAD - skipping commit."
            exit 0
          fi
          git commit -m "Fair value backfill ${TIMESTAMP} (quarterly-equivalent CA/TB % GDP)"
          if git push origin main; then
            echo "Push succeeded on attempt $i."
            exit 0
          fi
          sleep $((i * 2))
        done
        echo "All push attempts exhausted."
        exit 1
