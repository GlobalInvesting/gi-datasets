name: One-time cleanup — remove frontend files (site migrated)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove frontend files
        run: |
          set -euo pipefail
          git rm -rq --ignore-unmatch assets/
          git rm -q --ignore-unmatch \
            .github/workflows/deploy-pages.yml \
            .github/workflows/update-sitemap.yml \
            scripts/check-consistency.js \
            scripts/update_sitemap.py \
            index.html about.html access.html contact.html en.html \
            privacy.html terms.html download manifest.json sw.js \
            robots.txt sitemap.xml \
            apple-touch-icon.png favicon-16x16.png favicon-192x192.png \
            favicon-32x32.png favicon.ico favicon.png logo-56.png og-image.png \
            guide-cot.html guide-cross-asset-risk.html guide-csi-indicator.html \
            guide-dashboard.html guide-economic-surprises.html \
            guide-fundamental-analysis.html guide-fx-liquidity.html \
            guide-gbpjpy-cot.html guide-market-sentiment.html \
            guide-monte-carlo-simulator.html guide-mt5-ea.html \
            guide-rates-yield-curve.html

      - name: Write 404.html redirect stub
        run: |
          cat > 404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="robots" content="noindex, nofollow">
          <title>Redirecting…</title>
          <link id="canon" rel="canonical" href="https://global-investing.pages.dev/">
          <script>
            var target = 'https://global-investing.pages.dev' + location.pathname + location.search + location.hash;
            document.getElementById('canon').href = target;
            location.replace(target);
          </script>
          </head>
          <body>
          <p>This page has moved. If you are not redirected automatically, <a id="link" href="https://global-investing.pages.dev/">click here</a>.</p>
          <script>document.getElementById('link').href = target;</script>
          </body>
          </html>
          EOF
          git add 404.html

      - name: Commit and push (with retry)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "cleanup: remove frontend files — site migrated to gi-frontend-app/global-investing.pages.dev"

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected — rebasing onto latest main and retrying in $((i * 3))s..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::All push attempts exhausted."
          exit 1
