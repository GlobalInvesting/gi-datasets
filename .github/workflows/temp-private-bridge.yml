    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-saxo-rr')) || (github.event_name == 'schedule' && contains(fromJSON('["0 13 * * 1-5"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout engine repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-engine
        token: ${{ secrets.PAT_TOKEN }}
    - name: Checkout datasets repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.PAT_TOKEN }}
        path: site
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: "Idempotency guard \u2014 skip if a sibling trigger already ran this cycle"
      id: guard
      run: "SKIP=false\nif [ \"${{ github.event_name }}\" != \"workflow_dispatch\" ] && [ -f \"site/iv-data/atm-iv.json\" ]; then\n  FETCHED=$(python3 -c \"import json; d=json.load(open('site/iv-data/atm-iv.json')); print(d.get('fetched',''))\" 2>/dev/null || echo \"\")\n  if [ -n \"$FETCHED\" ]; then\n    AGE_MIN=$(python3 -c \"\nfrom datetime import datetime, timezone\nts = '$FETCHED'.replace('Z', '+00:00')\nage = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 60\nprint(int(age))\n\" 2>/dev/null || echo 9999)\n    # 30 min: native and dispatch both target the exact same 13:00 UTC slot.\n    if [ \"$AGE_MIN\" -lt 30 ] 2>/dev/null; then\n      echo \"site/iv-data/atm-iv.json was fetched ${AGE_MIN} min ago (< 30 min) \u2014 a sibling trigger already completed this cycle. Skipping the rest of this run.\"\n      SKIP=true\n    fi\n  fi\nfi\necho \"skip=$SKIP\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: |
        pip install playwright beautifulsoup4 requests
        playwright install chromium --with-deps
    - name: Fetch Saxo RR + ATM IV data (rr.json + rr2.json + atm-iv.json)
      if: steps.guard.outputs.skip != 'true'
      env:
        SITE_DIR: site
      run: python scripts/fetch_saxo_rr.py
    - name: Commit and push if changed
      if: steps.guard.outputs.skip != 'true'
      run: "cd site\n\n# If none of the three output files exist (first run + scrape\n# failed entirely), skip commit.\nif [ ! -f rr-data/rr.json ] && [ ! -f rr-data/rr2.json ] && [ ! -f iv-data/atm-iv.json ]; then\n  echo \"No output files \u2014 nothing to commit.\"\n  exit 0\nfi\n\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\n# Stash fresh files before the fetch/reset loop\n[ -f rr-data/rr.json      ] && cp rr-data/rr.json      /tmp/rr_fresh.json\n[ -f rr-data/rr2.json     ] && cp rr-data/rr2.json     /tmp/rr2_fresh.json\n[ -f iv-data/atm-iv.json  ] && cp iv-data/atm-iv.json  /tmp/iv_fresh.json\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')\n\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n\n  # Restore fresh files after hard reset\n  mkdir -p rr-data iv-data\n  [ -f /tmp/rr_fresh.json  ] && cp /tmp/rr_fresh.json  rr-data/rr.json\n  [ -f /tmp/rr2_fresh.json\
        \ ] && cp /tmp/rr2_fresh.json rr-data/rr2.json\n  [ -f /tmp/iv_fresh.json  ] && cp /tmp/iv_fresh.json  iv-data/atm-iv.json\n\n  python3 ../scripts/append_rr_history.py . || true\n\n  git add rr-data/rr.json rr-data/rr2.json iv-data/atm-iv.json\n  [ -d rr-data/history ] && git add rr-data/history\n  if git diff --staged --quiet; then\n    echo \"No changes vs remote HEAD \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"chore: update Saxo 25d RR + ATM IV data [${TIMESTAMP}]\"\n  if git push origin main; then\n    echo \"Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  echo \"Push rejected (attempt $i) \u2014 retrying in $((i * 2))s...\"\n  sleep $((i * 2))\ndone\necho \"All push attempts exhausted \u2014 data will refresh on next scheduled run.\"\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-saxo-rr
      cancel-in-progress: false
  workflow-meetings:
    name: Update Central Bank Meetings (static calendar + OIS bias)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'workflow-meetings')) || (github.event_name == 'schedule' && contains(fromJSON('["0 10 * * *"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout PUBLIC site repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.PAT_TOKEN }}
        path: site
    - name: Checkout THIS private repo (scripts)
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-engine
        token: ${{ secrets.PAT_TOKEN }}
        path: engine
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests openpyxl cloudscraper --break-system-packages
    - name: Create directory
      run: mkdir -p site/meetings-data
    - name: Update meeting dates and OIS-implied bias
      working-directory: site
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: "python3 << 'EOFPYTHON'\nimport json, os, re\nimport requests\nimport cloudscraper as _cloudscraper\nfrom datetime import date\n\n# \u2500\u2500 Static verified calendar \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Decision dates only (final day of multi-day meetings).\n# Sources verified April 2026 against official CB publications.\n# UPDATE PROCEDURE: each January, update CALENDAR_YYYY with official CB schedules.\n\nCALENDAR_2026 = {\n    # Federal Reserve FOMC - 8 meetings/year (includes past 2026 dates for chart markers)\n    'USD': ['2026-01-29','2026-03-19','2026-04-29','2026-06-17','2026-07-29','2026-09-16','2026-10-28','2026-12-09'],\n    # ECB Governing Council - 8 meetings/year\n    'EUR': ['2026-01-30','2026-03-06','2026-04-30','2026-06-11','2026-07-23','2026-09-10','2026-10-29','2026-12-17'],\n\
        \    # Bank of England MPC - 8 meetings/year\n    'GBP': ['2026-02-06','2026-03-20','2026-04-30','2026-06-18','2026-07-30','2026-09-17','2026-11-05','2026-12-17'],\n    # Bank of Japan MPM - 8 meetings/year\n    'JPY': ['2026-01-24','2026-03-19','2026-04-28','2026-06-16','2026-07-31','2026-09-18','2026-10-30','2026-12-18'],\n    # RBA Monetary Policy Board - 8 meetings/year\n    'AUD': ['2026-02-18','2026-04-01','2026-05-05','2026-06-16','2026-08-11','2026-09-29','2026-11-03','2026-12-08'],\n    # Bank of Canada - 8 decisions/year\n    'CAD': ['2026-01-29','2026-03-12','2026-04-16','2026-04-29','2026-06-10','2026-07-15','2026-09-09','2026-10-28','2026-12-09'],\n    # Swiss National Bank - quarterly (4/year)\n    'CHF': ['2026-03-26','2026-06-18','2026-09-24','2026-12-10'],\n    # RBNZ MPC - 7 decisions in 2026\n    'NZD': ['2026-02-19','2026-04-09','2026-05-27','2026-07-08','2026-09-02','2026-10-28','2026-12-09'],\n    # Norges Bank Monetary Policy and Financial Stability Committee\
        \ - 8 meetings/year\n    # Verified against norges-bank.no meeting pages (Jan/Mar/May confirmed past dates;\n    # Jun-Dec per official 2026 schedule, decision date = day rate is announced).\n    'NOK': ['2026-01-21','2026-03-26','2026-05-06','2026-06-18','2026-08-13','2026-09-24','2026-11-05','2026-12-17'],\n    # Sveriges Riksbank Executive Board - 8 meetings/year\n    # Decision-publication dates (not the \"applies from\" effective date).\n    # Verified against riksbank.se monetary policy decision pages.\n    'SEK': ['2026-01-29','2026-03-19','2026-05-07','2026-06-17','2026-08-25','2026-09-24','2026-11-10','2026-12-22'],\n}\n\nSOURCE_MAP = {\n    'USD': 'federalreserve.gov',\n    'EUR': 'ecb.europa.eu',\n    'GBP': 'bankofengland.co.uk',\n    'JPY': 'boj.or.jp',\n    'AUD': 'rba.gov.au',\n    'CAD': 'bankofcanada.ca',\n    'CHF': 'snb.ch',\n    'NZD': 'rbnz.govt.nz',\n    'NOK': 'norges-bank.no',\n    'SEK': 'riksbank.se',\n}\n\n# v8.312.0: values below feed meetings.json's public\
        \ `biasSource`\n# field, which dashboard.js's buildBiasTooltip() renders verbatim\n# into the CB Rate Expectations panel's user-facing tooltip -- must\n# name only the instrument/benchmark, never the exchange or data\n# vendor behind it (v8.166.0 policy). Previously named CME/ICE/ASX/\n# Barchart/cbonds directly; instrument names (Fed Funds futures,\n# ESTR/SONIA/CORRA futures, OIS TONA/SARON/NZIONA/NOWA/SWESTR\n# curves) are legitimate market terminology, not vendor names, and\n# are kept.\nBIAS_SOURCE_LABELS = {\n    'USD': 'Fed Funds futures, meeting-bracketed',\n    'EUR': 'ESTR futures, meeting-bracketed',\n    'GBP': 'SONIA futures, meeting-bracketed',\n    'JPY': 'OIS TONA curve + BoJ daily spot rate',\n    'AUD': '30-day Interbank Cash Rate futures',\n    'CAD': 'CORRA 1-Month futures, meeting-bracketed',\n    'CHF': 'OIS SARON curve, meeting-bracketed forward',\n    'NZD': 'OIS NZIONA curve, meeting-bracketed forward',\n    'NOK': 'OIS NOWA curve, meeting-bracketed forward',\n\
        \    'SEK': 'OIS SWESTR curve, meeting-bracketed forward',\n}\n\n# Per-run source-tier override: fetchers that use a true daily OIS source\n# (not a spread proxy) register here so the dispatcher can assign\n# biasMethod='ois' instead of 'spread' even for CCYs in SPREAD_PROXY_CCYS.\n_source_override = {}\n\n# v8.117.24: side-channel for the TRUE policy-rate anchor a fetcher used\n# to classify() its bias/probabilities. The fwdRate (\"Impl.\") block below\n# previously called current_rate(ccy) directly, which reads rates/{CCY}.json\n# verbatim \u2014 for EUR that file is MRO-basis (site display rate, v8.59.0),\n# not DFR-basis, while fetch_bias_eur()'s classify() call is calibrated\n# against DFR (corridor spread 15bp lower). That mismatch let fwdRate be\n# computed as MRO + prob*step while hikeProb/cutProb were computed against\n# DFR \u2014 internally inconsistent even though DFR was already correctly\n# resolved a few lines earlier inside fetch_bias_eur(). Fetchers that\n# resolve\
        \ a distinct policy-rate anchor from current_rate(ccy) register it\n# here so the fwdRate block can reuse the exact same anchor instead of\n# re-deriving (and silently diverging from) it.\n_policy_anchor = {}\n\n# v8.498.0: side-channel for a fetcher that internally falls from a true\n# daily-OIS tier down to a directionless same-day spread tier (TIER 0 ->\n# TIER 1) WITHOUT raising \u2014 i.e. it still returns a valid bias/cutProb/\n# hikeProb, so the dispatcher's own is_trajectory_fallback/None checks\n# never see the degradation and treat the spread reading as if it were\n# this CCY's normal primary signal. Distinct from SPREAD_PROXY_CCYS\n# (AUD/NZD/NOK), where 'spread' genuinely IS the primary methodology,\n# not a fallback from something better. A fetcher registers here only\n# when its OWN top tier (the one that actually replicates a real\n# market-implied-probability source) failed this run.\n_degraded_to_spread = {}\n\nMONTHS_SHORT = {1:'Jan',2:'Feb',3:'Mar',4:'Apr',5:'May',6:'Jun',\n\
        \                7:'Jul',8:'Aug',9:'Sep',10:'Oct',11:'Nov',12:'Dec'}\n\ndef fmt(iso):\n    d = date.fromisoformat(iso)\n    return f\"{d.day} {MONTHS_SHORT[d.month]}\"\n\n# \u2500\u2500 Auto-advance past already-resolved meetings (v8.46.0) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Bug: a meeting dated *today* (or any date <= today whose decision has\n# already been released) was still treated as the \"next meeting\" by every\n# per-CCY future-meetings filter (`d >= today`) and by the main output\n# loop. Two symptoms: (1) OIS forward-rate calcs bracket [T1, T2] using\n# days_to_T1, and every fetcher's own guard (`if T1_days > 0`) silently\n# skipped the real curve calc when T1_days == 0, falling through to a\n# weaker fallback tier with no error logged; (2) `nextMeeting` in the\n# output kept showing a date that had already happened and already been\n# decided, instead of the actual next upcoming meeting.\n# Fix: cross-reference each static-calendar\
        \ meeting date against\n# calendar-data/ff_calendar.json (checked out from the site repo at\n# `site/calendar-data/ff_calendar.json`, cwd is already `site` here).\n# A meeting counts as \"resolved\" only if a same-day, same-currency\n# \"Rate Decision\" event in that calendar is marked released with a\n# non-empty actual value \u2014 i.e. the decision has genuinely been\n# published, not merely that the calendar date has passed.\ntry:\n    with open('calendar-data/economic-events.json', encoding='utf-8') as _f:\n        _FF_CALENDAR_EVENTS = json.load(_f).get('events', [])\nexcept (OSError, json.JSONDecodeError) as _e:\n    print(f\"  [calendar] WARNING: could not load economic-events.json ({_e}) \"\n          f\"\u2014 resolved-meeting detection disabled, falling back to date-only filtering\")\n    _FF_CALENDAR_EVENTS = []\n\ndef _meeting_resolved(ccy, meeting_date):\n    \"\"\"meeting_date: a `date` object (all _mtg_list_<ccy> builders use\n    date objects, not iso strings). True\
        \ if the CB rate decision for\n    `ccy` on that date has already been released per ff_calendar.json.\n    Returns False (treat as still upcoming) if no matching event is\n    found or the calendar is unavailable \u2014 fails safe toward the old\n    date-only behavior rather than skipping a meeting that hasn't\n    actually happened yet.\"\"\"\n    _iso = meeting_date.isoformat()\n    for _ev in _FF_CALENDAR_EVENTS:\n        if (_ev.get('currency') == ccy\n                and _ev.get('dateISO') == _iso\n                and 'rate decision' in (_ev.get('title') or '').lower()):\n            return bool(_ev.get('released')) and _ev.get('actual') not in (None, '')\n    return False\n\ndef _next_unresolved_meetings(ccy, all_meeting_dates, today):\n    \"\"\"all_meeting_dates: iterable of `date` objects. today: `date`\n    object. Returns the sorted list of meetings that are genuinely\n    still ahead of us \u2014 on/after today AND not yet resolved. Replaces\n    the old `[d for d in\
        \ meetings if d >= today]` pattern everywhere,\n    which treated a same-day-but-already-decided meeting as the next\n    one and silently skipped forward-rate calcs bracketed on it.\"\"\"\n    return sorted(d for d in all_meeting_dates\n                  if d >= today and not _meeting_resolved(ccy, d))\n\nHEADERS = {'User-Agent': 'Mozilla/5.0 (compatible; GlobalInvestingBot/2.0)'}\nSCRAPER = _cloudscraper.create_scraper(\n    browser={'browser': 'chrome', 'platform': 'linux', 'mobile': False}\n)\nFRED_API_KEY = os.environ.get('FRED_API_KEY', '')\nFRED_BASE = 'https://api.stlouisfed.org/fred/series/observations'\n\n# \u2500\u2500 FRED helper \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef fred_latest(series_id):\n\
        \    \"\"\"Fetch most recent observation from FRED. Returns float or None.\"\"\"\n    if not FRED_API_KEY:\n        print(f'    [FRED] No API key \u2014 skipping {series_id}')\n        return None\n    try:\n        r = requests.get(FRED_BASE, params={\n            'series_id': series_id,\n            'api_key': FRED_API_KEY,\n            'file_type': 'json',\n            'sort_order': 'desc',\n            'limit': '5',\n        }, headers=HEADERS, timeout=15)\n        r.raise_for_status()\n        for o in r.json().get('observations', []):\n            if o.get('value') not in ('.', '', None):\n                return float(o['value'])\n    except Exception as e:\n        print(f'    [FRED {series_id}] {e}')\n    return None\n\n# \u2500\u2500 BoC Valet helper \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef boc_latest(series_id):\n    \"\"\"Fetch most recent observation from Bank of Canada Valet API.\"\"\"\n    try:\n        r = requests.get(\n            f'https://www.bankofcanada.ca/valet/observations/{series_id}/json',\n            params={'recent': '3'}, headers=HEADERS, timeout=10\n        )\n        r.raise_for_status()\n        obs = r.json().get('observations', [])\n        if obs:\n            val = obs[-1].get(series_id, {}).get('v')\n            if val is not None:\n                return float(val)\n    except Exception as e:\n        print(f'    [BoC {series_id}] {e}')\n    return None\n\n# \u2500\u2500 Classification \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\n# If overnight rate > policy rate + THRESHOLD \u2192 market pricing next hike.\n# If overnight rate < policy rate - THRESHOLD \u2192 market pricing next cut.\n# Within \xB1THRESHOLD \u2192 hold.\n\nTHRESHOLD      = 0.10  # percentage points (10 bp) \u2014 for daily OIS instruments\nTHRESHOLD_OECD = 0.25  # percentage points (25 bp) \u2014 for OECD monthly overnight\n# Rationale for THRESHOLD_OECD: OECD monthly overnight rates are monthly averages\n# of actual overnight transactions, not forward-looking OIS fixings. They carry a\n# structural spread vs the policy target of up to 20bp in stable periods \u2014 entirely\n# as a product of intra-month averaging. Using 10bp (daily OIS threshold) generates\n# false positives (see AUD v7.45.0 run: OECD=3.96% vs target=4.10% \u2192 cut 56%).\n# 25bp matches one standard increment of central bank action \u2014 only a full 25bp\n# structural deviation signals that the market is genuinely pricing a move.\n# This is\
        \ consistent with how Bloomberg WIRP uses instrument-specific thresholds.\n\ndef classify(overnight, policy, threshold=THRESHOLD):\n    \"\"\"\n    Classify OIS/overnight spread into bias + probability estimates.\n    Returns (bias, cutProb, hikeProb) \u2014 integers 0-100 or None if no data.\n\n    threshold: use THRESHOLD (10bp) for daily OIS (SOFR, ESTER, CORRA, SARON,\n               SONIA, TONA). Use THRESHOLD_OECD (25bp) for OECD monthly overnight\n               series (IRSTCI01AUM156N, IRSTCI01NZM156N, IRSTCI01JPM156N,\n               IRSTCI01CHM156N) to suppress structural averaging noise.\n\n    Probability derivation: the overnight rate encodes a probability-weighted\n    expectation. For a single near-term meeting, one 25bp step is the standard:\n      diff = overnight - policy\n      cutProb  = min(100, round(|diff| / 0.25 * 100))  when diff < -threshold\n      hikeProb = min(100, round( diff  / 0.25 * 100))  when diff > +threshold\n      hold: cutProb=0, hikeProb=0\
        \ (market not pricing a move)\n    A full 25bp spread = 100% probability. This matches Bloomberg WIRP logic.\n    \"\"\"\n    if overnight is None or policy is None:\n        return None, None, None\n    diff = overnight - policy\n    if diff < -threshold:\n        cut_prob  = min(100, round(abs(diff) / 0.25 * 100))\n        return 'cut', cut_prob, 0\n    if diff > threshold:\n        hike_prob = min(100, round(diff / 0.25 * 100))\n        return 'hike', 0, hike_prob\n    return 'hold', 0, 0\n\n# \u2500\u2500 CB rate history \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef load_rate_obs(ccy):\n    path = f'rates/{ccy}.json'\n    if not os.path.exists(path):\n        return []\n    try:\n        with open(path) as f:\n \
        \           return json.load(f).get('observations', [])\n    except Exception:\n        return []\n\ndef current_rate(ccy):\n    obs = load_rate_obs(ccy)\n    try:\n        return float(obs[0]['value']) if obs else None\n    except Exception:\n        return None\n\n# \u2500\u2500 Barchart bc-dynamic-config \u2014 shared meeting-bracketed futures tier (v8.119.0) \u2500\u2500\n# Barchart quote pages render an Angular template whose visible price row\n# ([[ item.lastPrice ]]) is client-side only and NEVER populated in the raw\n# HTML \u2014 but every quote page also embeds a separate, genuinely server-\n# rendered JSON payload in <script type=\"application/json\"\n# id=\"bc-dynamic-config\">, which includes a \"currentSymbol\" block with the\n# real last price (currentSymbol.raw.lastPrice), confirmed by fetching and\n# parsing four live quote pages this session (2026-08-10): ZQQ26 (USD,\n# 30-Day Fed Funds), EGU26 (EUR, 1-Month ESTR), JUU26 (GBP, 1-Month SONIA),\n# IQU26 (AUD, SFE\
        \ 30-Day Bank Rate). All four parsed clean with plain\n# json.loads() \u2014 no regex needed for the price itself. This is a genuine\n# dated, meeting-bracketed futures instrument for each (same market\n# standard as CME FedWatch/Bloomberg WIRP), not a proxy.\n# NOTE: only 1-Month-tenor contracts (ZQ/EG/JU/IQ) use this helper. 3-Month\n# contracts (T0/TONA for JPY, J2/SARON for CHF) were also confirmed to\n# exist and use the same bc-dynamic-config JSON, but their 3-month\n# (IMM-style quarterly) settlement window doesn't line up with a single CB\n# meeting the way a 1-month contract does \u2014 wiring them into this same\n# day-weighted formula would require a different bracket calc. Left\n# unimplemented; see GUIDELINES.md for the flagged follow-up.\n# NOT verified against a live GitHub Actions run this session \u2014 this\n# sandbox cannot reach barchart.com. The four HTML snapshots parsed above\n# were fetched by Santiago's browser and uploaded, not fetched live from\n# here.\
        \ Barchart may also front the page with Cloudflare (unconfirmed\n# either way from this sandbox), which is why this uses SCRAPER\n# (cloudscraper) rather than plain requests, matching the AUD investing.com\n# tier's approach to the same class of risk. Worth checking the first live\n# run's log for each currency before treating this as fully proven.\n_BARCHART_MONTH_CODE = {1:'F',2:'G',3:'H',4:'J',5:'K',6:'M',\n                         7:'N',8:'Q',9:'U',10:'V',11:'X',12:'Z'}\n\ndef _barchart_meeting_bracketed_bias(ccy, symbol_root, next_meeting, cur_rate):\n    \"\"\"Fetch the Barchart quote page for the front-month `symbol_root`\n    contract covering `next_meeting`'s calendar month, extract the\n    server-rendered bc-dynamic-config JSON, and apply the same meeting-\n    bracketed day-weighted formula already used for AUD (investing.com\n    Tier 1) and CAD (m-x.ca Tier 0): X = r_t*(n_b/N) + r_new*(n_a/N),\n    solved for r_new at the policy rate \xB125bp to derive cut/hike\n  \
        \  probability. Raises on any failure \u2014 callers wrap this in their own\n    try/except and print the reason before falling through to the next\n    tier, same convention as every other tier in this file.\n    Returns (bias, cutProb, hikeProb) with cutProb/hikeProb as 0-100 ints.\n    \"\"\"\n    import calendar as _bc_calendar\n    from datetime import date as _bc_date, datetime as _bc_dt\n\n    _bc_symbol = (f'{symbol_root}'\n                  f'{_BARCHART_MONTH_CODE[next_meeting.month]}'\n                  f'{str(next_meeting.year)[2:]}')\n    _bc_url = f'https://www.barchart.com/futures/quotes/{_bc_symbol}/overview'\n    _bc_r = SCRAPER.get(_bc_url, headers=HEADERS, timeout=15)\n    _bc_r.raise_for_status()\n    _bc_text = _bc_r.text\n\n    _bc_m = re.search(\n        r'<script type=\"application/json\" id=\"bc-dynamic-config\">', _bc_text)\n    if not _bc_m:\n        raise ValueError(\n            f'bc-dynamic-config block not found in {_bc_symbol} page '\n            f'(markup\
        \ may have changed)')\n    _bc_start = _bc_m.end()\n    _bc_end = _bc_text.find('</script>', _bc_start)\n    _bc_cfg = json.loads(_bc_text[_bc_start:_bc_end])\n    _bc_cs = _bc_cfg.get('currentSymbol') or {}\n    _bc_raw = _bc_cs.get('raw') or {}\n    _bc_price = _bc_raw.get('lastPrice')\n    if _bc_price is None:\n        raise ValueError(f'{_bc_symbol}: raw.lastPrice missing from currentSymbol JSON')\n    _bc_price = float(_bc_price)\n\n    # Staleness guard: tradeTime is 'MM/DD/YY' once a session has settled;\n    # during live trading hours it can instead be an intraday 'HH:MM CT'\n    # string with no date component (observed on IQU26's snapshot) \u2014 only\n    # the date-formatted case can be age-checked, so the intraday case is\n    # accepted without a guard rather than misparsed as stale.\n    _bc_trade_time = _bc_cs.get('tradeTime', '')\n    try:\n        _bc_trade_date = _bc_dt.strptime(_bc_trade_time.strip(), '%m/%d/%y').date()\n        _bc_age = (_bc_date.today() -\
        \ _bc_trade_date).days\n        if _bc_age > 5:\n            raise ValueError(\n                f'{_bc_symbol}: tradeTime {_bc_trade_time} is {_bc_age}d old (>5d stale)')\n    except ValueError as _bc_ve:\n        if 'stale' in str(_bc_ve):\n            raise\n        pass  # intraday HH:MM format, no date to check \u2014 proceed\n\n    if cur_rate is None:\n        raise ValueError(f'{ccy}: current policy rate unavailable for formula')\n\n    _bc_implied = round(100.0 - _bc_price, 6)  # % p.a.\n    _bc_days_in_month = _bc_calendar.monthrange(\n        next_meeting.year, next_meeting.month)[1]\n    _bc_month_start = _bc_date(next_meeting.year, next_meeting.month, 1)\n    _bc_n_b = (next_meeting - _bc_month_start).days\n    _bc_n_a = _bc_days_in_month - _bc_n_b\n\n    X   = _bc_implied / 100.0\n    r_t = cur_rate     / 100.0\n    _bc_p_cut  = 0.0\n    _bc_p_hike = 0.0\n    _bc_denom_cut  = (r_t - 0.0025 - r_t) * (_bc_n_a / _bc_days_in_month)\n    _bc_denom_hike = (r_t + 0.0025 - r_t)\
        \ * (_bc_n_a / _bc_days_in_month)\n    if _bc_denom_cut  != 0: _bc_p_cut  = max(0.0, min(1.0, (X - r_t) / _bc_denom_cut))\n    if _bc_denom_hike != 0: _bc_p_hike = max(0.0, min(1.0, (X - r_t) / _bc_denom_hike))\n\n    print(f'    [{ccy}] Barchart {_bc_symbol}: price={_bc_price}  '\n          f'implied={_bc_implied}%  policy={cur_rate}%  '\n          f'N={_bc_days_in_month} n_b={_bc_n_b} n_a={_bc_n_a}  '\n          f'meeting={next_meeting}  cut={_bc_p_cut*100:.1f}%  hike={_bc_p_hike*100:.1f}%')\n\n    # Bias = whichever scenario (cut/hike/hold) has the single highest\n    # probability \u2014 i.e. the mode of the distribution (v8.121.0).\n    # PREVIOUSLY: bias='cut'/'hike' fired on ANY >10% one-directional\n    # lean, without ever comparing against the implicit hold\n    # probability (1 \u2212 p_cut \u2212 p_hike). This let a 44% cutProb show\n    # as \"Cut\" even when hold (56%) was the actual majority outcome\n    # \u2014 confirmed diverging from CME FedWatch's own display\
        \ for the\n    # same USD meeting this session (48.8% cut vs. 51.2% hold \u2014 CME's\n    # own table shows hold as the larger bracket, our old rule showed\n    # \"Cut 44%\"). The dashboard already computes and displays\n    # holdProb = 100 \u2212 cutProb \u2212 hikeProb correctly whenever bias is\n    # 'hold' (dashboard.js, \"Hold probability is the residual\"\n    # comment) \u2014 this was purely a backend classification bug, no\n    # frontend change needed.\n    _bc_p_hold = max(0.0, 1.0 - _bc_p_cut - _bc_p_hike)\n    if _bc_p_cut >= _bc_p_hike and _bc_p_cut >= _bc_p_hold:\n        _bc_bias = 'cut'\n    elif _bc_p_hike > _bc_p_cut and _bc_p_hike >= _bc_p_hold:\n        _bc_bias = 'hike'\n    else:\n        _bc_bias = 'hold'\n\n    print(f'    [{ccy}] Barchart {_bc_symbol} \u2192 {_bc_bias}  '\n          f'cut={_bc_p_cut*100:.1f}%  hike={_bc_p_hike*100:.1f}%  [ois]')\n    _source_override[ccy] = 'ois'\n    if _bc_bias == 'cut':\n        return _bc_bias, min(100, round(_bc_p_cut\
        \ * 100)), 0\n    elif _bc_bias == 'hike':\n        return _bc_bias, 0, min(100, round(_bc_p_hike * 100))\n    else:\n        return _bc_bias, 0, 0\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# OIS fetchers \u2014 one per CB\n# Sources verified to work from GitHub Actions runners.\n# Returns (bias, cut_prob_pct_or_None) or (None, None) if unavailable.\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef fetch_bias_usd():\n    \"\"\"\n    USD CB rate expectations \u2014 two-tier chain (v8.134.0).\n\n    TIER 0 \u2014 Barchart 30-Day Fed Funds futures (ZQ), meeting-bracketed\n      (v8.119.0, anchor-basis fixed v8.134.0): This is the actual\n      instrument CME FedWatch is built on \u2014 confirmed genuinely free\n      and scrapable this session (2026-08-10) via the bc-dynamic-config\n      JSON embedded in Barchart's quote pages (see\n      _barchart_meeting_bracketed_bias() docstring above for the\n      discovery detail and its confirmed-live-from-sandbox caveat).\n      Same day-weighted formula as AUD/CAD/EUR/GBP's futures tiers:\n      X = r_t*(n_b/N) + r_new*(n_a/N), solved for r_new at the Fed\n      Funds target \xB125bp. biasMethod: 'ois' via _source_override.\n\n      FIX (v8.134.0,\
        \ same root-cause class as the EUR MRO/DFR anchor\n      bug, v8.117.24): r_t was previously current_rate('USD'), which\n      reads rates/USD.json \u2014 populated from DFEDTARU, the UPPER BOUND\n      of the Fed's target range (that fetcher's internal \"EFFR\" label\n      is stale/incorrect; see fetch_usd_nyfed()'s own docstring). But\n      ZQ futures settle against the actual daily Effective Federal\n      Funds Rate, which historically trades ~8-12bp BELOW the target\n      ceiling (e.g. EFFR ~3.63-3.65% within a 3.50-3.75% range \u2014 NY\n      Fed/FRED, confirmed 2026-08-12). Anchoring to the ceiling\n      misread this ordinary structural EFFR-to-ceiling spread as a\n      fictitious directional signal \u2014 audited 2026-08-12 against a\n      live run showing \"Cut 60% / Hike 0%\" for the Sep 16 2026 FOMC\n      meeting, while CME's own FedWatch tool (Hold 59.9% / Hike 40.1%\n      / Cut 0%) and investing.com's independently-built Fed Rate\n      Monitor (Hold 62.6% /\
        \ Hike 37.4% / Cut 0%) both agreed on the\n      opposite direction. Fix: resolve FRED DFF (genuine daily\n      Effective Federal Funds Rate \u2014 distinct from FEDFUNDS, a\n      monthly average, and from DFEDTARU, the target ceiling) up\n      front and pass it as r_t instead; register it in\n      _policy_anchor['USD'] so the downstream fwdRate (\"Impl.\") block\n      reuses the same EFFR basis instead of silently reverting to the\n      ceiling for USD specifically. rates/USD.json / current_rate\n      ('USD') (DFEDTARU) is unchanged and remains correct for the CB\n      Rates table's displayed rate/trend arrow \u2014 only this formula's\n      input changed.\n\n    TIER 0-B \u2014 cbonds.com OIS USD (Annual Money vs SOFR) curve,\n      meeting-bracketed (v8.499.0): Same mechanism already used for\n      EUR/GBP/JPY/CAD/CHF/NZD/NOK/SEK \u2014 a genuine forward-looking OIS\n      curve, not a same-day spread. Added as USD's own fallback when\n      Barchart ZQ (TIER 0) is unavailable,\
        \ closing the gap where USD\n      previously fell straight through to TIER 1's directionless\n      spread even though the same cbonds instrument family already\n      covers USD (confirmed live on cbonds.com, index id 218471).\n      biasMethod: 'ois' via _source_override.\n\n    TIER 1 \u2014 FRED SOFR vs Fed Funds Effective Rate (DFF), same-day\n      level-spread proxy (fallback if TIER 0 AND TIER 0-B unavailable):\n      FIX (v8.118.0): this fetcher's output was previously labeled 'CME\n      30-day Fed Funds futures (SOFR-implied)' in BIAS_SOURCE_LABELS, but\n      the code compared SOFR (overnight secured repo rate) against DFF\n      (Fed Funds Effective) \u2014 a same-day level spread, not a forward\n      instrument, and carries no market-implied probability information.\n      Kept as a last-resort tier now that TIER 0/TIER 0-B provide genuine\n      forward-looking reads; still labeled/classified as 'spread' (via\n      SPREAD_PROXY_CCYS) whenever it's the tier that\
        \ actually returns.\n    \"\"\"\n    # \u2500\u2500 Policy-rate anchor for TIER 0: genuine daily EFFR (FRED DFF), \u2500\u2500\n    # NOT current_rate('USD') (DFEDTARU, target-range ceiling) \u2014 see\n    # v8.134.0 fix note above. current_rate('USD') is still fetched as\n    # a last-resort fallback anchor if FRED DFF is unavailable, so\n    # TIER 0 degrades gracefully rather than failing outright.\n    _effr_anchor = fred_latest('DFF')\n    if _effr_anchor is not None:\n        _policy_anchor['USD'] = _effr_anchor\n    cur_usd = _effr_anchor  # v8.135.4: no ceiling fallback for the formula \u2014 see below\n\n    # \u2500\u2500 TIER 0: Barchart ZQ (30-Day Fed Funds futures), meeting-bracketed \u2500\u2500\n    # FIX (v8.135.4): previously, if FRED DFF (genuine daily EFFR) was\n    # unavailable, cur_usd silently fell back to current_rate('USD')\n    # (DFEDTARU, the target-range CEILING) and TIER 0 still ran the\n    # day-weighted formula against it. That is exactly the anchor-basis\n\
        \    # bug v8.134.0 fixed \u2014 it just reappeared as a silent fallback path\n    # instead of the original permanent bug. Confirmed live 2026-08-13:\n    # a run where the FRED DFF call failed produced \"Cut 68%\" (anchored\n    # to 3.75% ceiling), while the same run re-executed minutes later\n    # with FRED DFF resolving normally (3.63%) produced the correct\n    # \"Hold, hike=32%\" \u2014 matching CME FedWatch/Barchart's own same-day\n    # commentary (hike odds ~35%, trending down, no cut priced). Fix:\n    # if the genuine EFFR anchor is unavailable, skip TIER 0 entirely\n    # (raise immediately, caught below) and fall through to TIER 1\n    # instead of computing a formula whose amplification (up to ~5x\n    # anchor error, see v8.134.0 note) reliably fabricates a fictitious\n    # directional signal from an ordinary ~10bp structural spread. No\n    # anchor beats no result, for this formula specifically.\n    try:\n        if cur_usd is None:\n            raise ValueError(\n\
        \                'FRED DFF (genuine daily EFFR) unavailable \u2014 skipping TIER 0 '\n                'rather than anchoring the formula to the DFEDTARU ceiling')\n        _meetings_usd = sorted(\n            date.fromisoformat(_d) for _d in CALENDAR_2026.get('USD', []))\n        _future_usd = _next_unresolved_meetings('USD', _meetings_usd, date.today())\n        if not _future_usd:\n            raise ValueError('no upcoming FOMC meeting found in CALENDAR_2026')\n        _bias0, _cp0, _hp0 = _barchart_meeting_bracketed_bias(\n            'USD', 'ZQ', _future_usd[0], cur_usd)\n        return _bias0, _cp0, _hp0\n    except Exception as _eusd:\n        print(f'    [USD] Barchart ZQ futures unavailable: {_eusd}')\n\n    # \u2500\u2500 TIER 0-B: cbonds.com OIS USD (Annual Money vs SOFR) curve \u2500\u2500\u2500\u2500\u2500\u2500\n    # NEW (v8.499.0). Same mechanism already confirmed working live for\n    # EUR/GBP/JPY/CAD/CHF/NZD/NOK/SEK's cbonds curves (index id 218471,\n    # \"OIS\
        \ USD (Annual Money vs SOFR)\" subgroup, unauthenticated GET).\n    # Genuinely forward-looking and meeting-bracketed \u2014 unlike TIER 1\n    # below (a same-day spread with no directional content) \u2014 so it sits\n    # ahead of TIER 1 in the fallback order, giving USD a real fallback\n    # when Barchart ZQ fails instead of degrading straight to the spread.\n    # Curve is sparse beyond 3M (jumps 3M\u21923Y, confirmed on the live page)\n    # but dense enough (1W/2W/3W/1M/2M/3M) for both of USD's own near-term\n    # meeting brackets under normal conditions.\n    try:\n        from datetime import datetime as _usd_dt, timedelta as _usd_td\n        _usd_today = date.today()\n        _usd_cb_curve = {}\n        _usd_cb_r = requests.get(\n            'https://cbonds.com/indexes/218471/',\n            headers=HEADERS, timeout=15,\n        )\n        _usd_cb_r.raise_for_status()\n        _usd_cb_text = re.sub(r'<[^>]+>', ' ', _usd_cb_r.text)\n        _usd_cb_text = ' '.join(_usd_cb_text.split())\n\
        \        _usd_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _utnr, _urate in re.findall(\n            r'OIS USD \\(Annual Money vs SOFR\\) (\\d{1,2}[WMY])\\s+(-?[\\d.]+)\\s*%',\n            _usd_cb_text,\n        ):\n            try:\n                _udays = int(_utnr[:-1]) * _usd_cb_unit[_utnr[-1]]\n                _usd_cb_curve[_udays] = float(_urate)\n            except ValueError:\n                continue\n\n        if len(_usd_cb_curve) < 4:\n            print(f'    [USD] cbonds OIS curve: only {len(_usd_cb_curve)} tenor(s) parsed \u2014 skipping')\n        elif cur_usd is not None:\n            _usd_days_sorted = sorted(_usd_cb_curve)\n            print(\n                f'    [USD] cbonds OIS curve: {len(_usd_cb_curve)} tenors parsed '\n                f'({_usd_days_sorted[0]}d={_usd_cb_curve[_usd_days_sorted[0]]}% \u2026 '\n                f'{_usd_days_sorted[-1]}d={_usd_cb_curve[_usd_days_sorted[-1]]}%)'\n            )\n\n            def _usd_cb_interp(_target):\n\
        \                if _target <= _usd_days_sorted[0]:\n                    return _usd_cb_curve[_usd_days_sorted[0]], _usd_days_sorted[0], _usd_days_sorted[0]\n                if _target >= _usd_days_sorted[-1]:\n                    return _usd_cb_curve[_usd_days_sorted[-1]], _usd_days_sorted[-1], _usd_days_sorted[-1]\n                for _i in range(len(_usd_days_sorted) - 1):\n                    _d0, _d1 = _usd_days_sorted[_i], _usd_days_sorted[_i + 1]\n                    if _d0 <= _target <= _d1:\n                        _r0, _r1 = _usd_cb_curve[_d0], _usd_cb_curve[_d1]\n                        _w = (_target - _d0) / (_d1 - _d0)\n                        return _r0 + _w * (_r1 - _r0), _d0, _d1\n                return _usd_cb_curve[_usd_days_sorted[-1]], _usd_days_sorted[-1], _usd_days_sorted[-1]\n\n            _mtg_list_usd = sorted(\n                date.fromisoformat(_ds) for _ds in CALENDAR_2026.get('USD', []))\n            _future_mtgs_usd = _next_unresolved_meetings('USD',\
        \ _mtg_list_usd, _usd_today)\n\n            if len(_future_mtgs_usd) >= 1:\n                _ut1_date = _future_mtgs_usd[0]\n                _ut2_date = (\n                    _future_mtgs_usd[1] if len(_future_mtgs_usd) >= 2\n                    else (_ut1_date + _usd_td(days=42))\n                )\n                _ut1_days = (_ut1_date - _usd_today).days\n                _ut2_days = (_ut2_date - _usd_today).days\n\n                if _ut1_days >= 0 and _ut2_days > _ut1_days:\n                    _usd_ois_t1, _ut1_d0, _ut1_d1 = _usd_cb_interp(_ut1_days)\n                    _usd_ois_t2, _ut2_d0, _ut2_d1 = _usd_cb_interp(_ut2_days)\n                    _usd_fwd = (_ut2_days * _usd_ois_t2 - _ut1_days * _usd_ois_t1) / (_ut2_days - _ut1_days)\n                    print(\n                        f'    [USD] cbonds curve: OIS({_ut1_days}d\u2192{_ut1_date})={_usd_ois_t1:.4f}%  '\n                        f'[{_ut1_d0}d-{_ut1_d1}d]  '\n                        f'OIS({_ut2_days}d\u2192{_ut2_date})={_usd_ois_t2:.4f}%\
        \  '\n                        f'[{_ut2_d0}d-{_ut2_d1}d]'\n                    )\n                    print(\n                        f'    [USD] cbonds implied post-meeting forward={_usd_fwd:.4f}%  EFFR={cur_usd}%'\n                    )\n                    _ub0, _ucp0, _uhp0 = classify(_usd_fwd, cur_usd)\n                    if _ub0 is not None:\n                        print(f'    [USD] cbonds OIS curve \u2192 {_ub0}  cutProb={_ucp0}  hikeProb={_uhp0}  [ois]')\n                        _source_override['USD'] = 'ois'\n                        return _ub0, _ucp0, _uhp0\n    except Exception as _eusdcb:\n        print(f'    [USD] cbonds OIS curve fetch failed: {_eusdcb}')\n\n    # \u2500\u2500 TIER 1: FRED SOFR vs DFF (same-day spread proxy) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # v8.498.0: reaching here means TIER 0 (Barchart ZQ, the instrument\n    # that actually replicates CME FedWatch) failed this run \u2014 SOFR-DFF\n\
        \    # is a same-day repo-market spread with no forward-looking content\n    # (see TIER 1 docstring above), so this is a genuine degradation,\n    # not USD's normal primary methodology. Registered here so the\n    # dispatcher can preserve the last genuine OIS-tier signal instead\n    # of overwriting it with this directionless reading.\n    _degraded_to_spread['USD'] = True\n    sofr   = fred_latest('SOFR')\n    dff    = _effr_anchor if _effr_anchor is not None else fred_latest('DFF')\n    print(f'    [USD] SOFR={sofr}%  DFF={dff}%')\n    bias, cut_prob, hike_prob = classify(sofr, dff)\n    if bias is None:\n        return None, None, None\n    return bias, cut_prob, hike_prob\n\ndef fetch_bias_eur():\n    \"\"\"\n    ECB Deposit Rate expectations \u2014 six-tier source chain (v8.126.0).\n\n    TIER 0-A \u2014 cbonds.com OIS EUR (\u20ACSTR) curve, meeting-bracketed (v8.18.0):\n      PRIMARY. Full daily \u20ACSTR OIS curve (1W-60Y) via cbonds.com, same\n      mechanism as JPY's\
        \ cbonds TONA curve (v8.17.0). Forward rate\n      between the next two ECB meetings via fwd(T1,T2) formula,\n      classified at the standard 10bp daily-OIS threshold. See inline\n      comments at the top of this tier for full derivation. This is the\n      genuinely forward-looking, meeting-bracketed signal that was\n      previously missing for EUR (the old TIER 0-A below is a single\n      futures snapshot, not a full curve).\n\n    TIER 0-A-FALLBACK \u2014 ecb-watch.eu probabilities API (v8.125.0, demoted v8.126.0):\n      Third-party pre-computed hike/hold/cut probabilities, used ONLY\n      when TIER 0-A (cbonds) fails outright. Demoted from its brief\n      stint as TIER -2 (highest priority) after re-examination found\n      it is an unverified independent site, not an institutional or\n      exchange source \u2014 its claim to price genuine ECB \"Dated\" \u20ACSTR\n      futures was never itself confirmed against Eurex/ICE. Never\n      treat its output as more authoritative\
        \ than cbonds. See inline\n      comments at the top of this tier and the \"ecb-watch.eu is not\n      an authoritative source\" entry in GUIDELINES.md.\n\n    TIER 0-A2 \u2014 investing.com \u20ACSTR futures (v8.5.0, demoted in v8.18.0):\n      Same infrastructure as AUD (instrument 8980, confirmed working).\n      \u20ACSTR futures (ICE-listed) price as 100 \u2212 implied_rate. The front-month\n      contract closest to the next ECB meeting gives the market-implied rate\n      for the period covering that meeting. Instrument ID 1202033 confirmed\n      via browser DevTools on 2026-06-04.\n      URL: api.investing.com/api/financialdata/1202033/historical/chart/\n      Credit spread: 0bp (\u20ACSTR futures ARE the OIS rate, no credit premium).\n      biasMethod: 'ois'. This is the Bloomberg WIRP equivalent source.\n\n    TIER 0-B \u2014 euribor-rates.eu dual-tenor curve slope (v8.13.0):\n      v8.6.0 upgraded from Euribor 1M to Euribor 3M + ESTR slope.\n      v8.7.0: URL probe loop\
        \ (3 patterns) + listing-page parser.\n      v8.11.0: Fixed URL slug \u2014 /2/ = 3M tenor (was /3/ = 6M, wrong).\n      Structural credit spread deducted: 22bp. URL slug /2/ = 3M tenor.\n      NOTE (v8.12.0): previously TIER 0-NEW (Stooq CSV) sat between 0-A and\n      0-B, but Stooq now requires API key + captcha \u2014 removed entirely.\n\n    TIER 0-C \u2014 ECB official Euribor 3M stats HTML page (v8.7.0):\n      ecb.europa.eu/stats/.../euribor-rates-YYYY.en.html \u2014 plain HTML,\n      no SDMX auth required. Same 22bp credit-spread formula as TIER 0-B.\n\n    TIER 1 \u2014 Spot ESTER vs DFR (structural check \u2014 hike/cut only):\n      Primary: ECB Data Portal EST dataflow: B.EU000A2X2A25.WT.\n      Fallback (v8.8.0): FRED ECBESTRVOLWGTTRMDMNRT (same rate, 1-day lag).\n      hold from ESTER is non-informative (anchors ~8bp below DFR structurally).\n      Only CUT or HIKE from ESTER (genuine structural deviation) returned here.\n      ester_adj is also used by the TIER 2\
        \ stale guard \u2014 if ester_adj \u2248 DFR\n      but FRED Euribor 3M adj < DFR, the OECD monthly data is lagged \u2192 skip.\n\n    TIER 2 \u2014 FRED Euribor 3M OECD (monthly, last resort):\n      FRED IR3TIB01EZM156N. Monthly frequency \u2014 only reached if all daily\n      sources fail. 25bp credit spread deducted.\n      v8.7.0 stale guard: if adj < DFR AND ester_adj within 20bp of DFR \u2192 skip.\n\n    NOTE \u2014 ECB FM dataflow: ALL series in the FM dataflow return 404 from\n      GH Actions IPs (confirmed across 5 different series keys across v8.1-8.3).\n      The FM dataflow is blocked for GH Actions. Abandoned as a source.\n\n    Policy rate: FRED ECBDFR, fallback rates/EUR.json.\n    \"\"\"\n    # \u2500\u2500 Policy rate: FRED ECBDFR, fallback rates/EUR.json \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # NOTE (v8.59.0): rates/EUR.json switched from DFR-basis to MRO-basis\n    # (site now displays MRO as the primary EUR rate,\
        \ aligned with retail\n    # FX portals \u2014 see fetch_rates.py fetch_eur_ecb()). This module's\n    # classify() thresholds and CREDIT_SPREAD_EUR_3M_SLOPE are calibrated\n    # against DFR, so the fallback is converted back via the same\n    # ECB corridor spread (currently 15bp, in force since 2024-09-18).\n    ECB_MRO_DFR_SPREAD_PP = 0.15\n    dfr = fred_latest('ECBDFR')\n    if dfr is None:\n        _mro_fallback = current_rate('EUR')\n        if _mro_fallback is not None:\n            dfr = round(_mro_fallback - ECB_MRO_DFR_SPREAD_PP, 2)\n            print(f'    [EUR] DFR fallback via rates/EUR.json (MRO-basis) '\n                  f'{_mro_fallback}% - {ECB_MRO_DFR_SPREAD_PP}pp = {dfr}%')\n\n    # v8.117.24: register the resolved DFR as EUR's true policy anchor so\n    # the fwdRate block reuses it instead of re-reading current_rate('EUR')\n    # (which is MRO-basis, 15bp above DFR \u2014 see comment at _policy_anchor\n    # definition above).\n    if dfr is not None:\n  \
        \      _policy_anchor['EUR'] = dfr\n\n    # \u2500\u2500 TIER -1: REMOVED in v8.122.0 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Was: Barchart EG (1-Month ESTR futures), meeting-bracketed (v8.119.0).\n    # Removed because 'EG' (EGU26 etc.) is a calendar-month \u20ACSTR future \u2014\n    # the same family already correctly demoted as TIER 0-A2 below in\n    # v8.18.0 for exactly this reason. It is NOT a genuine ECB-dated\n    # instrument (that would be Eurex FEMP / ICE \"ECB Dated ESTR Future\",\n    # which settle on the ECB reserve maintenance period, not the\n    # calendar month \u2014 confirmed via Eurex/ICE product docs, neither\n    # listed on Barchart under any symbol root as of 2026-08-11).\n    # v8.119.0 mistook EG for that dated instrument and ranked it above\n    # the cbonds curve, silently shadowing\
        \ TIER 0-A on every run since:\n    # the calendar-month bracket formula assumes the O/N rate changes\n    # the day after the meeting, which is true for Fed Funds/SONIA/\n    # CORRA/RBA cash rate (all still on TIER -1/0 Barchart brackets\n    # elsewhere in this file \u2014 those are unaffected, their settlement\n    # mechanics really do match the calendar-month assumption) but false\n    # for \u20ACSTR, whose compounding window is the reserve maintenance\n    # period and can start several days after the meeting. Caught when\n    # this tier produced hikeProb=108.6% (silently clamped to 100%) for\n    # the Sep 2026 meeting against ECB Watch's independently-sourced\n    # 86.0% \u2014 see \"TIER ranking must match instrument settlement\n    # mechanics, not just instrument existence\" incident entry.\n\n    # \u2500\u2500 TIER 0-A: cbonds.com OIS EUR (\u20ACSTR) curve \u2014 meeting-bracketed (v8.18.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (1W-60Y)\
        \ server-side,\n    # unauthenticated, on every index subpage in the \"OIS EUR (Annual\n    # Money vs ESTR)\" family \u2014 same mechanism confirmed working for JPY\n    # TONA (v8.17.0). One GET to index id 217611 (the \"2Y\" page; any page\n    # in the subgroup returns the identical full ladder) returns all\n    # tenors in one response. Confirmed fresh (1 day old) and structured\n    # identically to JPY's curve on 2026-06-21.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) = (T2\xB7OIS(T2) \u2212 T1\xB7OIS(T1))\n    # / (T2\u2212T1) used for JPY. T1/T2 = days to the next two ECB Governing\n    # Council meetings (CALENDAR_2026['EUR']), curve-interpolated.\n    # Classified via classify() against DFR using the standard 10bp\n    # threshold (daily OIS instrument, same convention as SOFR/CORRA/\n    # SONIA/SARON/TONA \u2014 NOT the 25bp OECD-monthly threshold, since this\n    # is a genuine daily market curve, not a monthly average).\n    from datetime import datetime\
        \ as _eur_dt, timedelta as _eur_td\n\n    _eur_today = date.today()\n    _eur_cb_curve = {}\n    try:\n        _eur_cb_r = requests.get(\n            'https://cbonds.com/indexes/217611/',\n            headers=HEADERS, timeout=15,\n        )\n        _eur_cb_r.raise_for_status()\n        _eur_cb_text = re.sub(r'<[^>]+>', ' ', _eur_cb_r.text)\n        _eur_cb_text = ' '.join(_eur_cb_text.split())\n        _eur_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _etnr, _erate in re.findall(\n            r'OIS EUR \\(Annual Money vs ESTR\\) (\\d{1,2}[WMY])\\s+([\\d.]+)\\s*%',\n            _eur_cb_text,\n        ):\n            try:\n                _edays = int(_etnr[:-1]) * _eur_cb_unit[_etnr[-1]]\n                _eur_cb_curve[_edays] = float(_erate)\n            except ValueError:\n                continue\n    except Exception as _eeur:\n        print(f'    [EUR] cbonds OIS curve fetch failed: {_eeur}')\n\n    if len(_eur_cb_curve) < 4:\n        print(f'    [EUR] cbonds OIS curve:\
        \ only {len(_eur_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif dfr is not None:\n        _eur_days_sorted = sorted(_eur_cb_curve)\n        print(\n            f'    [EUR] cbonds OIS curve: {len(_eur_cb_curve)} tenors parsed '\n            f'({_eur_days_sorted[0]}d={_eur_cb_curve[_eur_days_sorted[0]]}% \u2026 '\n            f'{_eur_days_sorted[-1]}d={_eur_cb_curve[_eur_days_sorted[-1]]}%)'\n        )\n\n        def _eur_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _eur_days_sorted[0]:\n                return _eur_cb_curve[_eur_days_sorted[0]], _eur_days_sorted[0], _eur_days_sorted[0]\n            if _target >= _eur_days_sorted[-1]:\n                return _eur_cb_curve[_eur_days_sorted[-1]], _eur_days_sorted[-1], _eur_days_sorted[-1]\n            for _i in range(len(_eur_days_sorted)\
        \ - 1):\n                _d0, _d1 = _eur_days_sorted[_i], _eur_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _eur_cb_curve[_d0], _eur_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _eur_cb_curve[_eur_days_sorted[-1]], _eur_days_sorted[-1], _eur_days_sorted[-1]\n\n        _mtg_list_eur = sorted(\n            _eur_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('EUR', [])\n        )\n        _future_mtgs_eur = _next_unresolved_meetings('EUR', _mtg_list_eur, _eur_today)\n\n        if len(_future_mtgs_eur) >= 1:\n            _et1_date = _future_mtgs_eur[0]\n            _et2_date = (\n                _future_mtgs_eur[1] if len(_future_mtgs_eur) >= 2\n                else (_et1_date + _eur_td(days=49))\n            )\n\n            # v8.124.0: \u20ACSTR compounds over the ECB reserve maintenance\n        \
        \    # period, NOT the calendar window starting on the decision\n            # date itself. Per the ECB's official indicative maintenance\n            # -period calendar, the new rate takes effect on the\n            # settlement day of the next MRO \u2014 6 calendar days after the\n            # decision, confirmed identically across all 8 MPs of 2026\n            # (Feb 5\u219211, Mar 19\u219225, Apr 30\u2192May 6, Jun 11\u219217, Jul 23\u219229,\n            # Sep 10\u219216, Oct 29\u2192Nov 4, Dec 17\u219223 \u2014 every one exactly\n            # +6 days; source: ecb.europa.eu indicative reserve\n            # maintenance calendar). Anchoring fwd(T1,T2) on the raw\n            # decision dates included ~6 days still compounding at the\n            # OLD rate inside the \"post-meeting\" leg, diluting the\n            # implied jump \u2014 this is what produced hikeProb=108.6%\n            # (clamped to 100%) pre-v8.122.0 and 53% immediately after\n            # (TIER -1 removal\
        \ alone), against ECB Watch's independently\n            # -sourced 86.0% for the same Sep 9 2026 meeting. Bracketing\n            # on true MP-start dates instead isolates exactly the single\n            # maintenance period governed by the upcoming decision.\n            EUR_MP_START_OFFSET_DAYS = 6\n            _et1_mp_start = _et1_date + _eur_td(days=EUR_MP_START_OFFSET_DAYS)\n            _et2_mp_start = _et2_date + _eur_td(days=EUR_MP_START_OFFSET_DAYS)\n            _et1_days = (_et1_mp_start - _eur_today).days\n            _et2_days = (_et2_mp_start - _eur_today).days\n\n            if _et1_days >= 0 and _et2_days > _et1_days:\n                _eur_ois_t1, _eur_t1_d0, _eur_t1_d1 = _eur_cb_interp(_et1_days)\n                _eur_ois_t2, _eur_t2_d0, _eur_t2_d1 = _eur_cb_interp(_et2_days)\n                _eur_fwd = (_et2_days * _eur_ois_t2 - _et1_days * _eur_ois_t1) / (_et2_days - _et1_days)\n                print(\n                    f'    [EUR] MP anchors: meeting {_et1_date}\u2192\
        MP start {_et1_mp_start}  '\n                    f'meeting {_et2_date}\u2192MP start {_et2_mp_start}  (+{EUR_MP_START_OFFSET_DAYS}d offset)'\n                )\n                print(\n                    f'    [EUR] cbonds curve: OIS({_et1_days}d\u2192{_et1_mp_start})={_eur_ois_t1:.4f}%  '\n                    f'[{_eur_t1_d0}d-{_eur_t1_d1}d]  '\n                    f'OIS({_et2_days}d\u2192{_et2_mp_start})={_eur_ois_t2:.4f}%  '\n                    f'[{_eur_t2_d0}d-{_eur_t2_d1}d]'\n                )\n                print(\n                    f'    [EUR] cbonds implied post-meeting forward={_eur_fwd:.4f}%  DFR={dfr}%'\n                )\n                _eb0a, _ecp0a, _ehp0a = classify(_eur_fwd, dfr)\n                if _eb0a is not None:\n                    print(f'    [EUR] cbonds OIS curve \u2192 {_eb0a}  cutProb={_ecp0a}  hikeProb={_ehp0a}  [ois]')\n                    _source_override['EUR'] = 'ois'\n                    return _eb0a, _ecp0a, _ehp0a\n\n    # \u2500\u2500 TIER\
        \ 0-A-FALLBACK: ecb-watch.eu probabilities API (v8.126.0) \u2500\u2500\u2500\u2500\n    # DEMOTED from TIER -2 (was highest priority) in v8.126.0. Re-examined\n    # ecb-watch.eu itself and found it is NOT an institutional or exchange\n    # source \u2014 it is an independent third-party site of unconfirmed\n    # provenance. v8.125.0 treated its 86.0% figure as a trustworthy\n    # cross-check target (and, worse, briefly made it the primary EUR\n    # source) purely because its methodology page *claims* to price\n    # genuine ECB \"Dated\" \u20ACSTR futures (Eurex FEMP / ICE) \u2014 that claim was\n    # never independently verified against Eurex/ICE themselves, and the\n    # site offers no audit trail, no named publisher, and no SLA. Its own\n    # response carries a \"version\":\"3.0.0\" field implying the schema has\n    # already changed at least once. Treating an unverified third party's\n    # number as ground truth and chasing our own methodology to match it\n    # (see\
        \ the \"EUR hikeProb ceiling\" incident entry) was the wrong\n    # framing from the start \u2014 the 86.0% was never confirmed correct,\n    # only cited more confidently than the evidence supported.\n    #\n    # cbonds' OIS \u20ACSTR curve (TIER 0-A above) is not perfect either \u2014 it's\n    # vendor-indicative, linearly interpolated, not a live order book \u2014\n    # but it comes from a known, consistently-behaved data vendor already\n    # relied on for CHF/JPY/NOK/SEK/NZD, its methodology is fully\n    # documented in this file, and every number it produces is\n    # reproducible from the raw curve we can inspect ourselves. That\n    # combination makes it the more defensible PRIMARY source, even\n    # though ecb-watch.eu's underlying instrument (if its methodology\n    # claim is accurate) would in principle be structurally better.\n    #\n    # ecb-watch.eu is kept as a FALLBACK only \u2014 used solely when TIER 0-A\n    # (cbonds) fails outright (fetch error, <4 tenors\
        \ parsed, no upcoming\n    # meeting resolvable) \u2014 never as a preferred or cross-check-of-record\n    # source, and never surfaced to the user as more authoritative than\n    # cbonds. Response shape unchanged since v8.125.0:\n    #   {\"abs_data\": {\"YYYY-MM-DD\": {\"2.25%\": p, \"2.50%\": p, ...}, ...},\n    #    \"current_rate\": 2.25, \"metadata\": {...}}\n    try:\n        from datetime import date as _ew_date\n        _meetings_eur_ew = sorted(\n            _ew_date.fromisoformat(_d) for _d in CALENDAR_2026.get('EUR', []))\n        _future_eur_ew = _next_unresolved_meetings('EUR', _meetings_eur_ew, _ew_date.today())\n        if not _future_eur_ew:\n            raise ValueError('no upcoming ECB meeting found in CALENDAR_2026')\n        _ew_target_date = _future_eur_ew[0].isoformat()\n\n        _ew_r = requests.get('https://ecb-watch.eu/probabilities',\n                              headers=HEADERS, timeout=15)\n        _ew_r.raise_for_status()\n        _ew_data = _ew_r.json()\n\
        \n        _ew_dist = _ew_data['abs_data'][_ew_target_date]\n        _ew_current = float(_ew_data['current_rate'])\n\n        _ew_hold_p = 0.0\n        _ew_cut_p = 0.0\n        _ew_hike_p = 0.0\n        for _rate_label, _prob in _ew_dist.items():\n            _rate_val = float(_rate_label.rstrip('%'))\n            if abs(_rate_val - _ew_current) < 1e-6:\n                _ew_hold_p += _prob\n            elif _rate_val < _ew_current:\n                _ew_cut_p += _prob\n            else:\n                _ew_hike_p += _prob\n\n        _ew_bias = 'hold'\n        if _ew_hike_p >= 0.5:\n            _ew_bias = 'hike'\n        elif _ew_cut_p >= 0.5:\n            _ew_bias = 'cut'\n\n        _source_override['EUR'] = 'ois'\n        print(f'    [EUR] ecb-watch.eu FALLBACK (cbonds unavailable) {_ew_target_date}: '\n              f'hold={_ew_hold_p*100:.1f}% cut={_ew_cut_p*100:.1f}% '\n              f'hike={_ew_hike_p*100:.1f}% (current={_ew_current}%, '\n              f\"src={_ew_data.get('metadata',\
        \ {}).get('data_sources', '?')}, \"\n              f\"unverified third-party source \u2014 see GUIDELINES.md)\")\n        return _ew_bias, round(_ew_cut_p * 100, 1), round(_ew_hike_p * 100, 1)\n    except Exception as _e_ew:\n        print(f'    [EUR] ecb-watch.eu fallback unavailable: {_e_ew}')\n\n    # \u2500\u2500 TIER 0-A2: investing.com \u20ACSTR futures (v8.5.0) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Demoted from TIER 0-A in v8.18.0 \u2014 the cbonds curve above is a full\n    # daily market curve (more informative than a single futures print)\n    # and doesn't depend on a single instrument ID staying valid. This\n    # tier is retained as a fallback: it was confirmed working via\n    # DevTools on 2026-06-04, even though production runs as of\n    # 2026-06-21 show it failing the in-loop sanity checks (price range/\n    # staleness) \u2014 kept in case that's intermittent rather than dead.\n    # \u20AC\
        STR futures (ICE-listed, EUREX ticker FSTR) price as 100 \u2212 rate.\n    # Same cloudscraper infrastructure as AUD IB8980 (confirmed working).\n    # Instrument ID 1202033 confirmed via DevTools on 2026-06-04.\n    # URL: https://api.investing.com/api/financialdata/1202033/historical/chart/?interval=P1D&pointscount=160\n    # The front-month contract (closest expiry after the next ECB meeting)\n    # reflects the market-implied \u20ACSTR for that meeting period.\n    # Price ~97.60 \u2192 implied rate ~2.40% \u2192 vs DFR 2.0% \u2192 +40bp \u2192 hike.\n    # Note: \u20ACSTR futures have 0bp credit spread (OIS instrument, no bank risk).\n    _estr_ids = [1202033]\n    _estr_found = False\n    for _estr_id in _estr_ids:\n        try:\n            _estr_url = (f'https://api.investing.com/api/financialdata/{_estr_id}/'\n                         'historical/chart/?interval=P1D&pointscount=30')\n            _estr_hdrs = {\n                **HEADERS,\n                'X-Requested-With':\
        \ 'XMLHttpRequest',\n                'domain-id': 'www',\n                'Referer': 'https://www.investing.com/rates-bonds/euro-short-term-rate-futures',\n            }\n            _estr_r = SCRAPER.get(_estr_url, headers=_estr_hdrs, timeout=15)\n            if _estr_r.status_code != 200:\n                continue\n            _estr_data = _estr_r.json().get('data', [])\n            if not _estr_data:\n                continue\n            _estr_last  = _estr_data[-1]\n            _estr_ts    = date.fromtimestamp(_estr_last[0] / 1000)\n            _estr_price = float(_estr_last[4])   # close\n            _estr_age   = (date.today() - _estr_ts).days\n            # Sanity check: \u20ACSTR futures price is always 96\u2013100 range\n            if not (96.0 <= _estr_price <= 100.5):\n                continue\n            if _estr_age > 5:\n                continue\n            _estr_implied = round(100.0 - _estr_price, 4)\n            print(f'    [EUR] investing.com \u20ACSTR futures\
        \ id={_estr_id}: '\n                  f'price={_estr_price}  implied={_estr_implied}%  '\n                  f'date={_estr_ts}  age={_estr_age}d')\n            _estr_found = True\n            # \u20ACSTR futures: 0bp credit spread \u2014 pure OIS rate\n            if dfr is not None:\n                _estr_diff = round(_estr_implied - dfr, 4)\n                print(f'    [EUR] \u20ACSTR implied={_estr_implied}%  DFR={dfr}%  diff={_estr_diff:+.2f}%')\n                if abs(_estr_diff) > 1.50:\n                    print(f'    [EUR] \u20ACSTR guard (|diff|>150bp) \u2014 stale or wrong contract, skip')\n                    _estr_found = False\n                    continue\n                _b0a, _cp0a, _hp0a = classify(_estr_implied, dfr)\n                print(f'    [EUR] \u20ACSTR futures \u2192 {_b0a}  cutProb={_cp0a}  hikeProb={_hp0a}  [ois]')\n                _source_override['EUR'] = 'ois'\n                return _b0a, _cp0a, _hp0a\n            break\n        except Exception as\
        \ _e0a:\n            continue\n    if not _estr_found:\n        print(f'    [EUR] investing.com \u20ACSTR futures: no valid ID found in probe range')\n\n    # \u2500\u2500 TIER 0-B: euribor-rates.eu \u2014 dual-tenor curve slope (v8.13.0) \u2500\u2500\n    # NOTE (v8.12.0): Stooq CSV (previously TIER 0-NEW) removed \u2014 Stooq now\n    # requires API key + captcha for CSV downloads; unusable from GH Actions.\n    #\n    # METHOD: curve-slope (3M\u22121M spread), not single-tenor slope.\n    #\n    # WHY SINGLE-TENOR SLOPE FAILS (v8.6.0\u2013v8.12.0 root cause):\n    #   implied_3m_avg = Euribor3M \u2212 22bp credit spread.\n    #   When a hike is expected early in the 3M window (e.g., June 11 meeting\n    #   with period starting June 1), most of the 3M period is POST-hike but\n    #   the average is dragged down by the pre-hike portion. The slope diff\n    #   vs DFR falls within the 10bp hold band even at 91% market-implied prob.\n    #   Example (2026-06-04): 3M=2.276%, DFR=2.0%\
        \ \u2192 implied=2.056%, diff=+6bp \u2192\n    #   hold. Incorrect \u2014 market was pricing ~91% probability of a June 11 hike.\n    #\n    # WHY CURVE SLOPE WORKS:\n    #   The spread Euribor3M \u2212 Euribor1M isolates rate-change expectations for\n    #   months 2\u20133 relative to month 1. In a stable-rate environment the structural\n    #   3M\u22121M spread is \u22480\u201310bp (credit spreads largely cancel across tenors).\n    #   A hike expectation within the 3M window widens the spread materially:\n    #     THRESHOLD_CURVE_HIKE = 15bp  \u2192 market materially pricing a hike\n    #     THRESHOLD_CURVE_CUT  = \u221210bp \u2192 market pricing cuts in near window\n    #   Example (2026-06-04): 2.276% \u2212 1.991% = +28.5bp \u2192 hike (\u2713 at ~91% prob)\n    #   Euribor 12M=2.786% corroborates further tightening ahead.\n    #\n    # The homepage (euribor-rates.eu/en/current-euribor-rates/) lists all tenors\n    # (1W, 1M, 3M, 6M, 12M) in one table \u2014 single request\
        \ gives 1M and 3M.\n    # Single-tenor fallback (3M only) retained if 1M not parsed.\n    # Staleness guard: |curve_spread| > 1.00% \u2192 anomalous, skip T0-B.\n    # biasMethod: 'ois' (curve-slope, forward-looking term structure).\n    CREDIT_SPREAD_EUR_3M_SLOPE = 0.22   # structural Euribor3M\u2013DFR premium\n    THRESHOLD_CURVE_HIKE = 0.15    # 15bp 3M\u22121M spread \u2192 market pricing hike\n    THRESHOLD_CURVE_CUT  = -0.10   # \u221210bp \u2192 market pricing cuts in near window\n    try:\n        from html.parser import HTMLParser as _HP\n        # Probe order: homepage first (gives all tenors in one request),\n        # then fallback URLs. Homepage slug confirmed from source HTML 2026-06-04.\n        _eur_url_probes = [\n            'https://www.euribor-rates.eu/en/current-euribor-rates/',\n            'https://www.euribor-rates.eu/current-euribor-rates/',\n            'https://www.euribor-rates.eu/en/current-euribor-rates/2/euribor-rate-3-months/',\n        ]\n      \
        \  _eur_r = None\n        _eur_url = None\n        for _probe_url in _eur_url_probes:\n            try:\n                _pr = requests.get(_probe_url, headers=HEADERS, timeout=15)\n                if _pr.status_code == 200 and len(_pr.text) > 500:\n                    _eur_r = _pr\n                    _eur_url = _probe_url\n                    break\n            except Exception:\n                continue\n        if _eur_r is None:\n            raise Exception('all euribor-rates.eu URL probes returned non-200 or empty')\n\n        class _EurParser(_HP):\n            \"\"\"\n            Parses euribor-rates.eu in both known formats:\n            - Multi-column (live page): <thead> row with date <th>s,\n              then tenor rows with N value <td>s. Grabs the first (most\n              recent) value from each tenor row.\n            - Single-column (legacy): simple 2-col table (tenor link, value).\n            Uses <th> detection to identify and skip the date-header row.\n   \
        \         v8.14.0: added <th> support to handle multi-column live page.\n            \"\"\"\n            def __init__(self):\n                super().__init__()\n                self._in_td = self._in_th = False\n                self._cells = []\n                self._row = []   # list of (tag_type, text)\n                self.tenor_rates = {}   # tenor_key \u2192 most-recent rate_float\n                self.date_label = None  # most recent date from header row\n            def handle_starttag(self, tag, attrs):\n                if tag == 'tr':\n                    self._row = []\n                elif tag == 'th':\n                    self._in_th = True; self._cells = []\n                elif tag == 'td':\n                    self._in_td = True; self._cells = []\n            def handle_endtag(self, tag):\n                if tag == 'th':\n                    self._in_th = False\n                    self._row.append(('th', ''.join(self._cells).strip()))\n                elif tag ==\
        \ 'td':\n                    self._in_td = False\n                    self._row.append(('td', ''.join(self._cells).strip()))\n                elif tag == 'tr' and self._row:\n                    types = [t for t, _ in self._row]\n                    vals  = [v for _, v in self._row]\n                    # Header row (all <th>): grab most-recent date label\n                    if all(t == 'th' for t in types):\n                        dates = [v for v in vals if v.strip() and '/' in v]\n                        if dates:\n                            self.date_label = dates[0]\n                        return\n                    if not vals:\n                        return\n                    # Identify tenor from first cell text\n                    _tenor = None\n                    for _t in ('12 month', '6 month', '3 month', '1 month', '1 week'):\n                        if _t in vals[0].lower():\n                            _tenor = _t; break\n                    if _tenor is\
        \ None:\n                        return\n                    # First numeric value in cols 1+ is the most recent rate\n                    for cell in vals[1:]:\n                        try:\n                            rate_val = float(cell.replace('%','').replace(',','.').strip())\n                            if 0.0 <= rate_val <= 15.0:\n                                self.tenor_rates[_tenor] = rate_val\n                                break\n                        except (ValueError, IndexError):\n                            continue\n            def handle_data(self, data):\n                if self._in_td: self._cells.append(data)\n                elif self._in_th: self._cells.append(data)\n\n        _ep = _EurParser()\n        _ep.feed(_eur_r.text)\n        _eur1m = _ep.tenor_rates.get('1 month')\n        _eur3m = _ep.tenor_rates.get('3 month')\n        _eur_date_str = f' \xB7 {_ep.date_label}' if _ep.date_label else ''\n        print(f'    [EUR] euribor-rates.eu parsed{_eur_date_str}:\
        \ 1M={_eur1m}%  3M={_eur3m}%  '\n              f'tenors={list(_ep.tenor_rates.keys())}')\n\n        if _eur3m is not None and dfr is not None:\n            if _eur1m is not None:\n                # \u2500\u2500 Dual-tenor curve slope (primary) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n                _curve_spread = round(_eur3m - _eur1m, 4)\n                print(f'    [EUR] curve spread (3M\u22121M)={_curve_spread:+.3f}%  DFR={dfr}%  '\n                      f'[hike\u2265+{THRESHOLD_CURVE_HIKE*100:.0f}bp | '\n                      f'cut\u2264{THRESHOLD_CURVE_CUT*100:.0f}bp]')\n                if abs(_curve_spread) > 1.00:\n                    print(f'    [EUR] curve spread guard (|spread|>100bp) \u2014 anomalous, skip T0-B')\n                else:\n                    if _curve_spread >= THRESHOLD_CURVE_HIKE:\n                        _hp0b = min(100, round(_curve_spread\
        \ / 0.25 * 100))\n                        print(f'    [EUR] curve slope \u2192 hike  hikeProb={_hp0b}%  [ois]')\n                        _source_override['EUR'] = 'ois'\n                        return 'hike', 0, _hp0b\n                    elif _curve_spread <= THRESHOLD_CURVE_CUT:\n                        _cp0b = min(100, round(abs(_curve_spread) / 0.25 * 100))\n                        print(f'    [EUR] curve slope \u2192 cut  cutProb={_cp0b}%  [ois]')\n                        _source_override['EUR'] = 'ois'\n                        return 'cut', _cp0b, 0\n                    else:\n                        print(f'    [EUR] curve slope \u2192 hold  [ois]')\n                        _source_override['EUR'] = 'ois'\n                        return 'hold', 0, 0\n            else:\n                # \u2500\u2500 Single-tenor fallback (3M only \u2014 1M not parsed) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n                _implied_3m_avg = round(_eur3m\
        \ - CREDIT_SPREAD_EUR_3M_SLOPE, 4)\n                _slope_diff = round(_implied_3m_avg - dfr, 4)\n                print(f'    [EUR] 3M only: implied_avg={_implied_3m_avg}%  DFR={dfr}%  '\n                      f'slope_diff={_slope_diff:+.2f}%  [single-tenor fallback]')\n                if abs(_slope_diff) > 1.00:\n                    print(f'    [EUR] 3M guard (|slope_diff|>100bp) \u2014 stale or anomalous, skip T0-B')\n                else:\n                    _b0b, _cp0b, _hp0b = classify(_implied_3m_avg, dfr)\n                    print(f'    [EUR] 3M slope \u2192 {_b0b}  cutProb={_cp0b}  hikeProb={_hp0b}  [ois]')\n                    _source_override['EUR'] = 'ois'\n                    return _b0b, _cp0b, _hp0b\n        else:\n            print(f'    [EUR] euribor-rates.eu: 3M rate not parsed (tenors={list(_ep.tenor_rates.keys())})')\n    except Exception as _e0b:\n        print(f'    [EUR] euribor-rates.eu failed: {_e0b}')\n    # \u2500\u2500 TIER 0-C: ECB official Euribor\
        \ 3M stats HTML page (v8.7.0) \u2500\u2500\u2500\u2500\u2500\u2500\n    # The ECB website publishes daily Euribor fixings as a public HTML stats\n    # page \u2014 completely separate from the FM SDMX API (which is blocked from\n    # GH Actions). No API restrictions; this is a plain HTML table page.\n    # URL: ecb.europa.eu/stats/financial_markets_and_interest_rates/money_market/\n    #      euribor/html/euribor-rates-YYYY.en.html\n    # Contains the most recent Euribor fixing for all tenors (1W, 1M, 3M, 6M, 12M).\n    # Same credit-spread formula as TIER 0-B: implied = Euribor3M - 22bp.\n    # This tier is only reached when TIER 0-A and 0-B both fail.\n    try:\n        import re as _re0c\n        _ecb_eur_url = (\n            'https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates'\n            f'/money_market/euribor/html/euribor-rates-{date.today().year}.en.html'\n        )\n        _ecb_eur_r = requests.get(_ecb_eur_url, headers=HEADERS, timeout=15)\n       \
        \ _ecb_eur_r.raise_for_status()\n        _ecb_text = _ecb_eur_r.text\n        # Strategy 1: find \"3 months\" or \"3M\" column header then first numeric value\n        # The table has column headers and rows; we want the 3M column's latest value.\n        # Look for a digit sequence immediately following a \"3 month\" label in the HTML.\n        _ecb_3m = None\n        # Pattern: text \"3 months\" or \"3M\" followed (within ~200 chars) by a decimal rate\n        _m3m = _re0c.search(\n            r'3\\s*(?:month|M)\\b.{0,300}?(\\b\\d{1,2}\\.\\d{2,4}\\b)',\n            _ecb_text, _re0c.IGNORECASE | _re0c.DOTALL\n        )\n        if _m3m:\n            _ecb_3m_cand = float(_m3m.group(1))\n            if 0.5 <= _ecb_3m_cand <= 15.0:\n                _ecb_3m = _ecb_3m_cand\n        # Strategy 2: generic extraction \u2014 find all rates in page, take median in\n        # plausible range, cross-check with DFR \xB1 150bp\n        if _ecb_3m is None and dfr is not None:\n            _all_rates_ecb\
        \ = [float(x) for x in _re0c.findall(r'\\b(\\d{1,2}\\.\\d{3})\\b', _ecb_text)\n                              if 0.5 <= float(x) <= 15.0]\n            _rates_near_dfr = [r for r in _all_rates_ecb if abs(r - dfr) < 1.50]\n            if _rates_near_dfr:\n                _ecb_3m = sorted(_rates_near_dfr)[len(_rates_near_dfr) // 2]\n        if _ecb_3m is not None and dfr is not None:\n            print(f'    [EUR] ECB Euribor stats page: 3M candidate={_ecb_3m}%')\n            _ecb_impl = round(_ecb_3m - CREDIT_SPREAD_EUR_3M_SLOPE, 4)\n            _ecb_diff = round(_ecb_impl - dfr, 4)\n            print(f'    [EUR] ECB page implied_avg={_ecb_impl}%  DFR={dfr}%  slope_diff={_ecb_diff:+.2f}%')\n            if abs(_ecb_diff) <= 1.00:\n                _b0c, _cp0c, _hp0c = classify(_ecb_impl, dfr)\n                print(f'    [EUR] ECB Euribor page \u2192 {_b0c}  cutProb={_cp0c}  hikeProb={_hp0c}  [ois]')\n                _source_override['EUR'] = 'ois'\n                return _b0c, _cp0c,\
        \ _hp0c\n            else:\n                print(f'    [EUR] ECB page guard (|slope_diff|>100bp) \u2014 anomalous, skip')\n        else:\n            print(f'    [EUR] ECB Euribor stats page: could not extract 3M rate')\n    except Exception as _e0c:\n        print(f'    [EUR] ECB Euribor stats page failed: {_e0c}')\n\n    # \u2500\u2500 TIER 1: Spot ESTER normalised to DFR (hike/cut structural check) \u2500\u2500\n    # v8.2.0: Only return if classify() signals CUT or HIKE. A \"hold\" from\n    # ESTER normalisation is non-informative and passes through to TIER 2.\n    # Rationale: after adding the structural spread back, ester_adj \u2248 DFR \u2192\n    # always \u2248 0bp diff \u2192 classify() returns hold regardless of expectations.\n    # Only a genuine structural break (e.g. ESTER hasn't normalised after a\n    # surprise cut) would produce a real CUT/HIKE signal here.\n    ester_vals = []\n    try:\n        ecb_url = (\n            'https://data-api.ecb.europa.eu/service/data/EST/'\n\
        \            'B.EU000A2X2A25.WT?lastNObservations=5&format=jsondata'\n        )\n        r = requests.get(ecb_url, headers=HEADERS, timeout=15)\n        r.raise_for_status()\n        ds = r.json()['dataSets'][0]['series']\n        series_key = list(ds.keys())[0]\n        obs = ds[series_key]['observations']\n        for idx in sorted(obs.keys(), key=int, reverse=True):\n            val = obs[idx][0]\n            if val is not None:\n                ester_vals.append(float(val))\n        if ester_vals:\n            print(f'    [EUR] ESTER={ester_vals[0]}% (ECB Data Portal \xB7 EST.B.EU000A2X2A25.WT, {len(ester_vals)} obs)')\n    except Exception as e:\n        print(f'    [EUR] ECB Data Portal ESTER failed: {e}')\n\n    # \u2500\u2500 TIER 1-alt: FRED ECBESTRVOLWGTTRMDMNRT (v8.8.0) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Fallback for ester_vals when ECB Data Portal is blocked or unavailable.\n    # FRED publishes the same ECB-sourced\
        \ \u20ACSTR daily compounded rate\n    # (series ECBESTRVOLWGTTRMDMNRT) with a 1-business-day lag.\n    # Only used if ECB Data Portal returned nothing above.\n    # The value feeds ester_adj for the TIER 2 stale guard \u2014 if ester_adj\n    # remains None the guard cannot fire, letting stale OECD data through.\n    if not ester_vals:\n        try:\n            _fred_estr = fred_latest('ECBESTRVOLWGTTRMDMNRT')\n            if _fred_estr is not None:\n                ester_vals = [_fred_estr]\n                print(f'    [EUR] ESTER={_fred_estr}% (FRED \xB7 ECBESTRVOLWGTTRMDMNRT \xB7 fallback)')\n            else:\n                print(f'    [EUR] FRED ECBESTRVOLWGTTRMDMNRT: no value returned')\n        except Exception as _ef:\n            print(f'    [EUR] FRED ECBESTRVOLWGTTRMDMNRT failed: {_ef}')\n\n    ester = ester_vals[0] if ester_vals else None\n    ester_adj = None\n\n    if ester is not None and dfr is not None:\n        spreads = [dfr - v for v in ester_vals]\n     \
        \   spreads = [max(-0.20, min(0.20, s)) for s in spreads]\n        spread = sorted(spreads)[len(spreads)//2]\n        print(f'    [EUR] ESTER-DFR spread (dynamic, N={len(spreads)}): {spread:.4f}%')\n        ester_adj = ester + spread\n    elif ester is not None:\n        ester_adj = ester\n        print(f'    [EUR] DFR unavailable \u2014 using raw ESTER (no spread normalisation)')\n\n    print(f'    [EUR] ESTER_adj={ester_adj}%  DFR={dfr}%')\n    _t1_bias, _t1_cut, _t1_hike = classify(ester_adj, dfr)\n    if _t1_bias in ('cut', 'hike'):\n        # Genuine structural ESTER deviation \u2014 real post-decision lag signal\n        print(f'    [EUR] ESTER Tier 1 structural deviation: {_t1_bias} \u2014 returning')\n        return _t1_bias, _t1_cut, _t1_hike\n    # \"hold\" from normalised ESTER is non-informative \u2014 fall through to TIER 2\n    print(f'    [EUR] ESTER Tier 1 hold (structural anchor) \u2014 passing to TIER 2')\n\n    # \u2500\u2500 TIER 2: FRED Euribor 3M, structural\
        \ spread-adjusted (v8.2.0) \u2500\u2500\n    # FRED IR3TIB01EZM156N: OECD Euro Area 3-Month Interbank (Euribor 3M).\n    # Euribor 3M is forward-looking: embeds expected ECB policy for the next\n    # quarter. Structural credit/term premium over DFR: ~25bp stable.\n    # Threshold: THRESHOLD (10bp) \u2014 correct for a term-rate instrument.\n    # (Not THRESHOLD_OECD=25bp: Euribor is not an overnight monthly average.)\n    # Staleness guard: if |adj_diff| > 75bp, OECD data is lagging a missed move.\n    CREDIT_SPREAD_EUR_3M = 0.25  # Euribor 3M structural spread over ECB DFR\n    try:\n        eur_3m = fred_latest('IR3TIB01EZM156N')\n        if eur_3m is not None and dfr is not None:\n            eur_3m_adj = round(eur_3m - CREDIT_SPREAD_EUR_3M, 4)\n            eur_3m_diff = round(eur_3m_adj - dfr, 4)\n            print(f'    [EUR] Euribor 3M={eur_3m}%  adj={eur_3m_adj}%  DFR={dfr}%  diff={eur_3m_diff:+.2f}%')\n            # v8.7.0: Cross-check guard \u2014 if ESTER_adj \u2248 DFR\
        \ (TIER 1 returned hold:\n            # market NOT pricing a cut in the overnight market) but the FRED monthly\n            # Euribor 3M (OECD, 1-2 month lag) signals a cut, the two signals are\n            # structurally inconsistent. The OECD monthly average lags real-time\n            # market pricing by 4-8 weeks and will not yet reflect a recent ECB hike\n            # expectation repricing. Prefer the more current ESTER signal \u2192 skip.\n            # Guard logic: adj < DFR (i.e. credit-adj Euribor below policy floor)\n            # AND ESTER_adj within 15bp of DFR (confirming stable overnight market).\n            # This does NOT fire when ESTER itself is below DFR (genuine cut cycle).\n            _ester_stable = (ester_adj is not None and abs(ester_adj - dfr) < 0.20)\n            if eur_3m_adj < dfr and _ester_stable:\n                print(f'    [EUR] TIER 2 stale guard: adj={eur_3m_adj}% < DFR={dfr}% '\n                      f'but ESTER_adj={ester_adj:.3f}% \u2248 DFR\
        \ \u2014 OECD monthly lag '\n                      f'confirmed, skipping TIER 2 to prevent false cut signal')\n            elif abs(eur_3m_diff) > 0.75:\n                print(f'    [EUR] Euribor 3M guard triggered (|diff|>75bp) \u2014 stale or anomalous, skipping')\n            else:\n                _b2, _cp2, _hp2 = classify(eur_3m_adj, dfr)\n                print(f'    [EUR] Euribor 3M \u2192 {_b2}  cutProb={_cp2}  hikeProb={_hp2}  [spread]')\n                return _b2, _cp2, _hp2\n        else:\n            print(f'    [EUR] FRED IR3TIB01EZM156N unavailable')\n    except Exception as e:\n        print(f'    [EUR] FRED Euribor 3M error: {e}')\n\n    return None, None, None\n\ndef fetch_bias_gbp():\n    \"\"\"\n    GBP CB rate expectations via SONIA OIS forward rates (v8.18.0).\n\n    SOURCE CHAIN (in order of preference):\n    0. cbonds.com OIS GBP SONIA curve, meeting-bracketed  [NEW, v8.18.0]\n         Full daily SONIA OIS curve (SW-60Y) via cbonds.com, same\n         mechanism\
        \ as JPY/EUR's cbonds curves. Forward rate between the\n         next two MPC meetings via fwd(T1,T2), classified at the\n         standard 10bp daily-OIS threshold. Closes a documented gap:\n         the BoE's own June 2026 Monetary Policy Summary described the\n         UK OIS curve sloping upward ~30bp into year-end on hike-risk\n         premia \u2014 a signal the old TIER 1/2 single-snapshot spread\n         below could not see. biasMethod: 'ois'.\n    1. BoE yield curve \u2014 instantaneous 1M OIS forward rate  [demoted from Primary, v8.18.0]\n         URL: https://www.bankofengland.co.uk/boeapps/database/fromshowcolumns.asp\n              ?Travel=NIxIRx&FromSeries=1&ToSeries=50&DAT=RNG&...&C=IUQIBLOK\n         Series: IUQIBLOK \u2014 BoE 1M OIS forward from the nominal liability curve.\n         Published daily. Best forward-looking market rate for MPC expectations.\n         NOTE v8.13.0: BoE boeapps returns HTTP 403 \u201CHost not in allowlist\u201D\n         from GitHub\
        \ Actions IPs (Cloudflare block, confirmed 2026-06-04).\n         Attempt retained for resilience; falls through to SECONDARY immediately.\n    2. FRED IR3TIB01GBM156N \u2014 UK 3M interbank rate (OECD)  [SECONDARY \u2014 monthly]\n         Compared raw against Bank Rate (no credit-spread deduction; see v8.14.0).\n         UK IR3TIB tracks Bank Rate closely and can run below it when cuts are\n         expected. Staleness guard: |IR3TIB \u2212 BankRate| > 80bp \u2192 skip.\n         biasMethod: \u2018spread\u2019. Uses THRESHOLD_OECD (25bp).\n         v8.13.0: added as SECONDARY. v8.14.0: removed 28bp credit deduction.\n    3. FRED IUDSOIA \u2014 SONIA overnight spot rate  [TERTIARY]\n         Fallback when both BoE API and IR3TIB are unavailable. Less forward-looking.\n    4. heuristic_bias(\u2018GBP\u2019) via caller \u2014 last resort.\n\n    Policy rate: current_rate(\u2018GBP\u2019) from rates/GBP.json.\n    Threshold: THRESHOLD (10bp) for IUQIBLOK/SONIA; THRESHOLD_OECD (25bp)\
        \ for IR3TIB.\n    \"\"\"\n    from datetime import date as _date, datetime as _gbp_dt, timedelta\n\n    bank_rate = current_rate('GBP')\n    if bank_rate is None:\n        print(f'    [GBP] rates/GBP.json unavailable \u2014 cannot classify')\n        return None, None, None\n\n    # \u2500\u2500 v8.134.0: SONIA spot anchor for the futures/OIS-forward tiers \u2500\u2500\n    # Same failure mode as USD (see fetch_bias_usd() docstring): the\n    # Barchart JU futures contract and the cbonds/BoE OIS forward curves\n    # all settle against genuine daily SONIA, not the Bank Rate policy\n    # decision itself. SONIA runs a documented, structural few-bp\n    # *below* Bank Rate (BoE's own SONIA methodology notes a small\n    # negative wedge versus Bank Rate, distinct from the Fed's much\n    # wider EFFR-vs-ceiling corridor). Anchoring the futures/OIS tiers\n    # below): genuine SONIA overnight spot (FRED IUDSOIA), NOT bank_rate\n    # to bank_rate instead of SONIA re-derives the same\
        \ class of bias\n    # as USD's DFEDTARU bug, just smaller in magnitude. TIER 2 (IR3TIB\n    # spread-vs-BankRate) and TIER 3 (SONIA-vs-BankRate structural\n    # check) are intentionally exempt from this fix \u2014 they exist to\n    # keep using `bank_rate` \u2014 see their own docstrings. Falls back to\n    # bank_rate if FRED IUDSOIA is unavailable.\n    _sonia_anchor = fred_latest('IUDSOIA')\n    if _sonia_anchor is not None:\n        _policy_anchor['GBP'] = _sonia_anchor\n        print(f'    [GBP] SONIA/IUDSOIA={_sonia_anchor}%  Bank Rate={bank_rate}%  '\n              f'(anchor for futures/OIS forward tiers)')\n    _gbp_fwd_anchor = _sonia_anchor  # v8.135.4: no Bank Rate fallback for TIER -1\n\n    # \u2500\u2500 TIER -1: Barchart JU (1-Month SONIA futures), meeting-bracketed (v8.119.0) \u2500\u2500\n    # NEW. Genuine dated futures instrument (ICE-listed), confirmed\n    # scrapable this session via bc-dynamic-config JSON \u2014 see\n    # _barchart_meeting_bracketed_bias()\
        \ docstring for discovery detail\n    # and the confirmed-live-from-sandbox caveat. Same day-weighted\n    # formula as AUD/CAD/USD/EUR. Ranked ahead of the cbonds curve below\n    # for the same reason as EUR: a single priced futures contract for\n    # the next MPC meeting's month, no curve interpolation needed.\n    # FIX (v8.135.4): same class as USD's DFEDTARU-ceiling bug \u2014 if\n    # FRED IUDSOIA is unavailable, skip this tier instead of silently\n    # anchoring the formula to bank_rate (Bank Rate sits a few bp above\n    # genuine SONIA; letting the formula amplify that ordinary spread\n    # fabricates a directional signal the same way the USD case did).\n    try:\n        if _gbp_fwd_anchor is None:\n            raise ValueError(\n                'FRED IUDSOIA (genuine SONIA spot) unavailable \u2014 skipping TIER -1 '\n                'rather than anchoring the formula to Bank Rate')\n        _meetings_gbp = sorted(\n            _date.fromisoformat(_d) for _d in CALENDAR_2026.get('GBP',\
        \ []))\n        _future_gbp0 = _next_unresolved_meetings('GBP', _meetings_gbp, _date.today())\n        if not _future_gbp0:\n            raise ValueError('no upcoming MPC meeting found in CALENDAR_2026')\n        # v8.134.0: anchored to SONIA spot (`_gbp_fwd_anchor`), not bank_rate \u2014\n        # this futures contract settles against SONIA, not the Bank Rate decision.\n        _bias_gm1, _cp_gm1, _hp_gm1 = _barchart_meeting_bracketed_bias(\n            'GBP', 'JU', _future_gbp0[0], _gbp_fwd_anchor)\n        return _bias_gm1, _cp_gm1, _hp_gm1\n    except Exception as _egbp0:\n        print(f'    [GBP] Barchart JU futures unavailable: {_egbp0}')\n\n    # \u2500\u2500 TIER 0: cbonds.com OIS GBP SONIA curve \u2014 meeting-bracketed (v8.18.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (SW out to 60Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS GBP\n    # SONIA\" family \u2014 same mechanism confirmed working for JPY TONA\n    # (v8.17.0)\
        \ and EUR \u20ACSTR (v8.18.0). One GET to index id 72097 (the\n    # \"1Y\" page; any page in the subgroup returns the identical full\n    # ladder) returns all tenors in one response. Confirmed fresh\n    # (1 day old) on 2026-06-21. Note tenor naming: GBP's shortest tenor\n    # is labelled \"SW\" (single week), not \"1W\" as EUR uses \u2014 handled as\n    # a 7-day special case below. Link text also carries a \"mid\" suffix\n    # after the tenor (e.g. \"OIS GBP SONIA SW mid\"), unlike JPY/EUR/NZD's\n    # plain \"{tenor} {rate}%\" \u2014 the regex below accounts for it.\n    #\n    # This directly closes a documented gap: the BoE's own June 2026\n    # Monetary Policy Summary described the UK OIS curve as sloping\n    # upward ~30bp into year-end on hike-risk premia \u2014 a signal the\n    # prior IR3TIB single-snapshot spread (still TIER 2 below) could not\n    # see. Forward-rate extraction: same fwd(T1,T2) formula as JPY/EUR.\n    # T1/T2 = days to the next two MPC meetings\
        \ (CALENDAR_2026['GBP']),\n    # curve-interpolated. Classified via classify() against Bank Rate\n    # using the standard 10bp threshold (daily OIS instrument).\n    _gbp_today = _date.today()\n    _gbp_cb_curve = {}\n    try:\n        _gbp_cb_r = requests.get(\n            'https://cbonds.com/indexes/72097/',\n            headers=HEADERS, timeout=15,\n        )\n        _gbp_cb_r.raise_for_status()\n        _gbp_cb_text = re.sub(r'<[^>]+>', ' ', _gbp_cb_r.text)\n        _gbp_cb_text = ' '.join(_gbp_cb_text.split())\n        _gbp_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _gtnr, _grate in re.findall(\n            r'OIS GBP SONIA (SW|\\d{1,2}[WMY])\\s+mid\\s+([\\d.]+)\\s*%',\n            _gbp_cb_text,\n        ):\n            try:\n                _gdays = 7 if _gtnr == 'SW' else int(_gtnr[:-1]) * _gbp_cb_unit[_gtnr[-1]]\n                _gbp_cb_curve[_gdays] = float(_grate)\n            except ValueError:\n                continue\n    except Exception as _egbp:\n      \
        \  print(f'    [GBP] cbonds OIS curve fetch failed: {_egbp}')\n\n    if len(_gbp_cb_curve) < 4:\n        print(f'    [GBP] cbonds OIS curve: only {len(_gbp_cb_curve)} tenor(s) parsed \u2014 skipping')\n    else:\n        _gbp_days_sorted = sorted(_gbp_cb_curve)\n        print(\n            f'    [GBP] cbonds OIS curve: {len(_gbp_cb_curve)} tenors parsed '\n            f'({_gbp_days_sorted[0]}d={_gbp_cb_curve[_gbp_days_sorted[0]]}% \u2026 '\n            f'{_gbp_days_sorted[-1]}d={_gbp_cb_curve[_gbp_days_sorted[-1]]}%)'\n        )\n\n        def _gbp_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _gbp_days_sorted[0]:\n                return _gbp_cb_curve[_gbp_days_sorted[0]], _gbp_days_sorted[0], _gbp_days_sorted[0]\n            if _target >= _gbp_days_sorted[-1]:\n        \
        \        return _gbp_cb_curve[_gbp_days_sorted[-1]], _gbp_days_sorted[-1], _gbp_days_sorted[-1]\n            for _i in range(len(_gbp_days_sorted) - 1):\n                _d0, _d1 = _gbp_days_sorted[_i], _gbp_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _gbp_cb_curve[_d0], _gbp_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _gbp_cb_curve[_gbp_days_sorted[-1]], _gbp_days_sorted[-1], _gbp_days_sorted[-1]\n\n        _mtg_list_gbp = sorted(\n            _gbp_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('GBP', [])\n        )\n        _future_mtgs_gbp = _next_unresolved_meetings('GBP', _mtg_list_gbp, _gbp_today)\n\n        if len(_future_mtgs_gbp) >= 1:\n            _gt1_date = _future_mtgs_gbp[0]\n            _gt2_date = (\n                _future_mtgs_gbp[1] if len(_future_mtgs_gbp) >= 2\n           \
        \     else (_gt1_date + timedelta(days=49))\n            )\n            _gt1_days = (_gt1_date - _gbp_today).days\n            _gt2_days = (_gt2_date - _gbp_today).days\n\n            if _gt1_days >= 0 and _gt2_days > _gt1_days:\n                _gbp_ois_t1, _gbp_t1_d0, _gbp_t1_d1 = _gbp_cb_interp(_gt1_days)\n                _gbp_ois_t2, _gbp_t2_d0, _gbp_t2_d1 = _gbp_cb_interp(_gt2_days)\n                _gbp_fwd = (_gt2_days * _gbp_ois_t2 - _gt1_days * _gbp_ois_t1) / (_gt2_days - _gt1_days)\n                print(\n                    f'    [GBP] cbonds curve: OIS({_gt1_days}d\u2192{_gt1_date})={_gbp_ois_t1:.4f}%  '\n                    f'[{_gbp_t1_d0}d-{_gbp_t1_d1}d]  '\n                    f'OIS({_gt2_days}d\u2192{_gt2_date})={_gbp_ois_t2:.4f}%  '\n                    f'[{_gbp_t2_d0}d-{_gbp_t2_d1}d]'\n                )\n                print(\n                    f'    [GBP] cbonds implied post-meeting forward={_gbp_fwd:.4f}%  anchor(SONIA)={_gbp_fwd_anchor}%'\n              \
        \  )\n                # FIX (2026-09-09, live incident): a transient FRED IUDSOIA\n                # outage (502/timeout) was silently discarding a fully-computed,\n                # 33-tenor cbonds curve result (classify() returns None,None,None\n                # whenever policy/anchor is None), cascading TIER 0 all the way\n                # down to the heuristic fallback despite genuine OIS data being\n                # available. This is NOT the same failure class as v8.135.4's\n                # \"no Bank Rate fallback for TIER -1\" decision (below) \u2014 that\n                # rule protects against the USD DFEDTARU-class bug, where the\n                # policy-decision rate itself sits meaningfully away from the\n                # instrument's true settlement rate. BoE's own published SONIA\n                # methodology documents a small, structural SONIA-vs-Bank-Rate\n                # wedge (historically ~2-7bp, currently <2bp) \u2014 well inside this\n             \
        \   # function's own 10bp THRESHOLD \u2014 so falling back to bank_rate\n                # here only when the live SONIA spot is unavailable cannot itself\n                # flip a hold into a false hike/cut the way anchoring USD's\n                # futures tier to DFEDTARU did. Degrades TIER 0 gracefully to\n                # bank_rate instead of abandoning a good curve fetch outright.\n                _gbp_fwd_anchor_t0 = _gbp_fwd_anchor if _gbp_fwd_anchor is not None else bank_rate\n                if _gbp_fwd_anchor is None:\n                    print(f'    [GBP] SONIA spot unavailable \u2014 TIER 0 falling back to '\n                          f'Bank Rate={bank_rate}% as anchor (BoE-documented wedge <10bp threshold)')\n                _gb0, _gcp0, _ghp0 = classify(_gbp_fwd, _gbp_fwd_anchor_t0)\n                if _gb0 is not None:\n                    print(f'    [GBP] cbonds OIS curve \u2192 {_gb0}  cutProb={_gcp0}  hikeProb={_ghp0}  [ois]')\n                    _source_override['GBP']\
        \ = 'ois'\n                    return _gb0, _gcp0, _ghp0\n\n    # \u2500\u2500 TIER 1: BoE boeapps database \u2014 1M OIS forward \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Demoted from primary in v8.18.0 \u2014 kept for resilience (403 block is\n    # Cloudflare-IP-based, may lift), but cbonds above is now preferred:\n    # it's a full curve rather than a single 1M point, and isn't gated\n    # behind a BoE-side allowlist.\n    # Series IUQIBLOK: instantaneous 1M OIS forward from BoE nominal curve\n    # Published each business day at ~17:00 London time.\n    ois_1m = None\n    try:\n        today_d = _date.today()\n        start   = (today_d - timedelta(days=10)).strftime('%d/%b/%Y')\n        end     = today_d.strftime('%d/%b/%Y')\n        boe_url = (\n            'https://www.bankofengland.co.uk/boeapps/database/fromshowcolumns.asp'\n            f'?Travel=NIxIRx&FromSeries=1&ToSeries=50'\n            f'&DAT=RNG&FD={today_d.day}&FM={today_d.strftime(\"\
        %b\")}&FY={today_d.year}'\n            f'&TD={today_d.day}&TM={today_d.strftime(\"%b\")}&TY={today_d.year}'\n            f'&VFD=Y&html.x=66&html.y=26&C=IUQIBLOK&UsingCodes=True&CSVF=TT&BoEpdf=pdf.pdf'\n        )\n        # Use the CSV export endpoint directly\n        boe_csv_url = (\n            'https://www.bankofengland.co.uk/boeapps/database/fromshowcolumns.asp'\n            '?Travel=NIxIRx&FromSeries=1&ToSeries=50&DAT=RNG'\n            f'&FD=1&FM=Jan&FY=2026&TD={today_d.day}&TM={today_d.strftime(\"%b\")}&TY={today_d.year}'\n            '&VFD=Y&html.x=66&html.y=26&C=IUQIBLOK&UsingCodes=True&CSVF=TT&BoEpdf=pdf.pdf'\n        )\n        r = requests.get(boe_csv_url, headers=HEADERS, timeout=15)\n        r.raise_for_status()\n        lines = r.text.splitlines()\n        # BoE CSV: header row then date,value rows\n        for line in reversed(lines):\n            line = line.strip()\n            if not line or 'Date' in line:\n                continue\n            parts = [p.strip().strip('\"\
        ') for p in line.split(',')]\n            if len(parts) >= 2 and parts[1] not in ('', 'n/a', 'NA'):\n                try:\n                    ois_1m = float(parts[1])\n                    print(f'    [GBP] BoE 1M OIS forward={ois_1m}% (IUQIBLOK \xB7 {parts[0]})')\n                    break\n                except ValueError:\n                    continue\n    except Exception as e:\n        print(f'    [GBP] BoE 1M OIS forward failed: {e}')\n\n    if ois_1m is not None:\n        print(f'    [GBP] 1M OIS forward={ois_1m}%  anchor(SONIA)={_gbp_fwd_anchor}%  [forward-looking]')\n        return classify(ois_1m, _gbp_fwd_anchor)\n\n    # \u2500\u2500 Secondary: FRED IR3TIB01GBM156N \u2014 UK 3M interbank (raw) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # v8.13.0: promoted to SECONDARY to fill the gap from BoE 403 block.\n    # v8.14.0: removed 28bp credit-spread deduction.\n    #   UK IR3TIB (OECD 3M interbank) does NOT carry a systematic positive\n    #   spread over\
        \ Bank Rate, unlike AUD BBSW (+28bp) or NZD IR3TIB (+22bp).\n    #   In practice it tracks Bank Rate closely (\xB10\u201310bp in stable environments)\n    #   and can run BELOW Bank Rate when the market is pricing cuts, since the\n    #   3M average incorporates the post-cut level for part of the window.\n    #   Example (2026-06-04): IR3TIB=3.71% < Bank Rate=3.75% \u2192 raw diff=\u22124bp\n    #   \u2192 hold (correct; market ~96% hold). With 28bp deduction \u2192 diff=\u221232bp\n    #   \u2192 cut/100%, which was wrong.\n    # Staleness guard: |IR3TIB \u2212 Bank Rate| > 80bp \u2192 stale, skip.\n    _gbp_3m = fred_latest('IR3TIB01GBM156N')\n    if _gbp_3m is not None:\n        _gbp_3m_diff = round(_gbp_3m - bank_rate, 4)\n        _gbp_3m_spread = abs(_gbp_3m_diff)\n        print(f'    [GBP] IR3TIB={_gbp_3m}%  BankRate={bank_rate}%  diff={_gbp_3m_diff:+.2f}%')\n        if _gbp_3m_spread > 0.80:\n            print(f'    [GBP] IR3TIB spread={_gbp_3m_spread:.2f}% >80bp \u2014 stale,\
        \ skipping')\n        else:\n            _b_3m, _cp_3m, _hp_3m = classify(_gbp_3m, bank_rate, threshold=THRESHOLD_OECD)\n            print(f'    [GBP] IR3TIB raw \u2192 {_b_3m}  cutProb={_cp_3m}  hikeProb={_hp_3m}  [spread]')\n            return _b_3m, _cp_3m, _hp_3m\n\n    # \u2500\u2500 Tertiary: FRED IUDSOIA \u2014 SONIA overnight spot \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Intentionally classified against `bank_rate` (not\n    # _gbp_fwd_anchor \u2014 this tier's whole purpose is to detect a genuine\n    # SONIA-vs-Bank-Rate deviation, so reuses `bank_rate` directly (same\n    # pattern as CAD TIER 2 below). Reuses the top-of-function\n    # fetched _sonia_anchor instead of re-fetching if present.\n    print(f'    [GBP] BoE forward + IR3TIB unavailable \u2014 using SONIA spot (lagging fallback)')\n    sonia = _sonia_anchor if _sonia_anchor is not None else fred_latest('IUDSOIA')\n    print(f'    [GBP] SONIA spot={sonia}%\
        \  BankRate={bank_rate}%')\n    if sonia is not None:\n        return classify(sonia, bank_rate)\n    return None, None, None\n\ndef fetch_bias_jpy():\n    \"\"\"\n    JPY \u2014 four-tier OIS forward probability engine (v8.17.0).\n\n    TIER 0-A  cbonds.com OIS JPY (Annual Money vs TONA) curve\n      (v8.17.0; ID/regex corrected v8.121.1)\n      REPLACES the investing.com TONA 3M futures probe (v8.15.0), which\n      was built on a false premise: investing.com does not redistribute\n      TFX/OSE 3-Month TONA futures under any instrument ID. Confirmed by\n      manually searching investing.com's full rates-bonds catalog\n      (2026-06-21) \u2014 no such page exists, unlike AUD's ASX 30-day IB\n      futures, which investing.com genuinely carries under id 8980. The\n      15-ID probe list could never have succeeded.\n\n      BUG FOUND AND FIXED v8.121.1: the v8.17.0 implementation shipped\n      against id 73681 with regex text \"OIS JPY TONA\" \u2014 neither matches\n      the\
        \ live page. Manually saved HTML from the actual subgroup\n      (2026-08-10) confirms the family is titled \"OIS JPY (Annual Money\n      vs TONA)\" starting at id 217649 (1W), stepping +2 per tenor\n      (217655=1M, 217657=2M, ... 217709=40Y) \u2014 same naming/ID convention\n      as CHF/NOK/NZD's already-correct curves. The old id/regex pair\n      never matched anything, so this tier has been silently falling\n      through to TIER 0-B on every run since it shipped. Shortest tenor\n      is 1W, not 1D as the original docstring assumed \u2014 no sub-weekly\n      point exists for JPY (matches CHF/NOK; only GBP/EUR go to 7d=1W\n      as their shortest too, so this was never actually anomalous).\n\n      cbonds.com renders the full OIS JPY (Annual Money vs TONA) tenor\n      curve (1W out to 40Y) server-side, unauthenticated, on every index\n      subpage \u2014 the \"Authorization required\" gate blocks only historical\n      CSV export, not the live snapshot table itself. One\
        \ GET to the 1W\n      index page (id 217649) returns the entire subgroup curve in one\n      response.\n\n      Forward-rate extraction: an OIS(T) quote is the market's expected\n      average overnight rate compounded over [0,T]. The implied forward\n      average rate over a window [T1,T2] is recovered via:\n          fwd(T1,T2) = (T2\xB7OIS(T2) \u2212 T1\xB7OIS(T1)) / (T2 \u2212 T1)\n      T1 = days to the next BoJ meeting (curve-interpolated).\n      T2 = days to the meeting after that (curve-interpolated).\n      fwd(T1,T2) isolates the market-implied average rate for the period\n      right after the upcoming meeting \u2014 the same signal TIER 0-A was\n      always meant to produce. Classified via the standard classify()\n      (10bp/25bp-step), same convention as every other daily-OIS\n      currency in this workflow.\n\n    TIER 0-B  TONA spot \u2014 BoJ official API (primary) \u2192 SNB zimoma\n      (fallback)  (v8.17.0)\n      BoJ operates a public no-key REST API (stat-search.boj.or.jp,\n\
        \      db=FM01, code=STRDCLUCON) confirmed working from GH Actions in\n      fetch_ois_rates.py v6.4 (production run #47+, 0 failures). Daily\n      frequency eliminates the monthly-staleness false trigger that\n      affected the SNB zimoma-only source (zimoma is monthly; after a\n      same-month BoJ hike it kept showing the pre-hike average for\n      weeks). SNB zimoma is retained as the fallback leg when the BoJ\n      API is unavailable. Used for direct classification when diff >\n      \xB15bp (rare \u2014 TONA almost always tracks BoJ target within 3bp).\n      Falls through to TIER 0-C when in the hold zone or guard-suppressed.\n\n    TIER 0-C  BoJ MPM vote scraper (calendar-based direct URL, v8.15.0)\n      Constructs candidate URLs directly from CALENDAR_2026['JPY']\n      (past meetings only), descending \u2014 k{YY}{MMDD}a.htm,\n      k{YY}{MMDD}b.htm, k{YY}{MMDD}.htm \u2014 until a 200+content response\n      is found. www.boj.or.jp blocks GH Actions IPs with HTTP 403\
        \ on\n      every URL variant (confirmed 2026-06-21) \u2014 this tier is currently\n      unreachable from GH Actions and falls straight to its 50bp\n      post-NIRP baseline. Retained because the block is IP-based, not\n      content-based: if BoJ's posture changes, this resumes working\n      with no code change. Vote count \u2192 hikeProb calibration (v8.15.0,\n      calibrated vs rateprobability.com / Polymarket June 2026 at ~97%\n      hike, 6-3 vote):\n        6-3 (3+ hawkish dissenters):  hikeProb = 97%\n        7-2 (2 dissenters):            hikeProb = 80%\n        8-1 (1 dissenter):             hikeProb = 65%\n        unanimous hold, post-NIRP:     hikeProb = 50% (baseline)\n      Only active in post-NIRP tightening cycle (current rate > 0,\n      rate history contains \u22640 observation).\n\n    TIER 1   FRED IRSTCI01JPM156N (OECD overnight Japan, monthly)\n      Last-resort fallback. Staleness guard: 50bp vs BoJ target.\n    \"\"\"\n    import calendar as _calendar\n\
        \    from datetime import date as _date, datetime as _datetime, timedelta as _timedelta\n\n    policy = current_rate('JPY')\n\n    # ------------------------------------------------------------------ #\n    # TIER 0-A \u2014 cbonds.com OIS JPY (Annual Money vs TONA) curve          #\n    # (id/regex corrected v8.121.1 \u2014 see docstring BUG FOUND note above)  #\n    # One GET returns the full subgroup tenor curve (1W-40Y), parsed via  #\n    # tag-strip + whitespace-collapse (resilient to exact table markup,   #\n    # same defensive technique already used for the BoJ vote page text).  #\n    # See module docstring above for the fwd(T1,T2) derivation.           #\n    # ------------------------------------------------------------------ #\n    _today_jpy = _date.today()\n    _cb_curve = {}\n    try:\n        _cb_r = requests.get(\n            'https://cbonds.com/indexes/217649/',\n            headers=HEADERS, timeout=15,\n        )\n        _cb_r.raise_for_status()\n        _cb_text\
        \ = re.sub(r'<[^>]+>', ' ', _cb_r.text)\n        _cb_text = ' '.join(_cb_text.split())\n        _cb_unit = {'D': 1, 'W': 7, 'M': 30, 'Y': 360}\n        for _tnr, _rate in re.findall(\n            r'OIS JPY \\(Annual Money vs TONA\\) (\\d{1,2}[DWMY])\\s+([\\d.]+)\\s*%', _cb_text\n        ):\n            try:\n                _days = int(_tnr[:-1]) * _cb_unit[_tnr[-1]]\n                _cb_curve[_days] = float(_rate)\n            except ValueError:\n                continue\n    except Exception as _ecb:\n        print(f'    [JPY] cbonds OIS curve fetch failed: {_ecb}')\n\n    if len(_cb_curve) < 4:\n        print(f'    [JPY] cbonds OIS curve: only {len(_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif policy is not None:\n        _cb_days_sorted = sorted(_cb_curve)\n        print(\n            f'    [JPY] cbonds OIS curve: {len(_cb_curve)} tenors parsed '\n            f'({_cb_days_sorted[0]}d={_cb_curve[_cb_days_sorted[0]]}% \u2026 '\n            f'{_cb_days_sorted[-1]}d={_cb_curve[_cb_days_sorted[-1]]}%)'\n\
        \        )\n\n        def _cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _cb_days_sorted[0]:\n                return _cb_curve[_cb_days_sorted[0]], _cb_days_sorted[0], _cb_days_sorted[0]\n            if _target >= _cb_days_sorted[-1]:\n                return _cb_curve[_cb_days_sorted[-1]], _cb_days_sorted[-1], _cb_days_sorted[-1]\n            for _i in range(len(_cb_days_sorted) - 1):\n                _d0, _d1 = _cb_days_sorted[_i], _cb_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _cb_curve[_d0], _cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _cb_curve[_cb_days_sorted[-1]], _cb_days_sorted[-1], _cb_days_sorted[-1]\n\n \
        \       _mtg_list_jpy = sorted(\n            _datetime.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('JPY', [])\n        )\n        _future_mtgs_jpy = _next_unresolved_meetings('JPY', _mtg_list_jpy, _today_jpy)\n\n        if len(_future_mtgs_jpy) >= 1:\n            _t1_date = _future_mtgs_jpy[0]\n            _t2_date = (\n                _future_mtgs_jpy[1] if len(_future_mtgs_jpy) >= 2\n                else (_t1_date + _timedelta(days=49))\n            )\n            _t1_days = (_t1_date - _today_jpy).days\n            _t2_days = (_t2_date - _today_jpy).days\n\n            if _t1_days >= 0 and _t2_days > _t1_days:\n                _ois_t1, _jpy_t1_d0, _jpy_t1_d1 = _cb_interp(_t1_days)\n                _ois_t2, _jpy_t2_d0, _jpy_t2_d1 = _cb_interp(_t2_days)\n                _fwd = (_t2_days * _ois_t2 - _t1_days * _ois_t1) / (_t2_days - _t1_days)\n                print(\n                    f'    [JPY] cbonds curve: OIS({_t1_days}d\u2192{_t1_date})={_ois_t1:.4f}%\
        \  '\n                    f'[{_jpy_t1_d0}d-{_jpy_t1_d1}d]  '\n                    f'OIS({_t2_days}d\u2192{_t2_date})={_ois_t2:.4f}%  '\n                    f'[{_jpy_t2_d0}d-{_jpy_t2_d1}d]'\n                )\n                print(\n                    f'    [JPY] cbonds implied post-meeting forward={_fwd:.4f}%  '\n                    f'BoJ rate={policy}%'\n                )\n                _b0a, _cp0a, _hp0a = classify(_fwd, policy)\n                if _b0a is not None:\n                    print(f'    [JPY] cbonds OIS curve \u2192 {_b0a}  cutProb={_cp0a}  hikeProb={_hp0a}  [ois]')\n                    _source_override['JPY'] = 'ois'\n                    return _b0a, _cp0a, _hp0a\n\n    # ------------------------------------------------------------------ #\n    # TIER 0-B \u2014 TONA spot: BoJ official API (primary) \u2192 SNB zimoma      #\n    #            (secondary fallback). Fetched before TIER 0-C so the    #\n    #            spot value is available for the fallback classify\
        \ path. #\n    # ------------------------------------------------------------------ #\n    tona = None\n    tona_source = None\n    tona_is_daily = False\n\n    # Primary: BoJ official API (no key) \u2014 same call as fetch_ois_rates.py v6.4\n    try:\n        _boj_prior_mon = (_today_jpy.replace(day=1) - _timedelta(days=1))\n        _boj_start_ym  = _boj_prior_mon.strftime('%Y%m')\n        _boj_r = requests.get(\n            'https://www.stat-search.boj.or.jp/api/v1/getDataCode',\n            params={'format': 'json', 'lang': 'en', 'db': 'FM01',\n                    'code': 'STRDCLUCON', 'startDate': _boj_start_ym},\n            headers=HEADERS, timeout=15,\n        )\n        _boj_r.raise_for_status()\n        _boj_payload = _boj_r.json()\n        _boj_status  = _boj_payload.get('STATUS')\n        if _boj_status != 200:\n            print(\n                f'    [JPY] BoJ API STATUS={_boj_status}: '\n                f'{_boj_payload.get(\"MESSAGE\", \"no message\")}'\n         \
        \   )\n        else:\n            _boj_resultset = _boj_payload.get('RESULTSET') or []\n            _boj_vals = (_boj_resultset[0].get('VALUES') or {}) if _boj_resultset else {}\n            _boj_dates_arr = _boj_vals.get('SURVEY_DATES') or []\n            _boj_vals_arr  = _boj_vals.get('VALUES') or []\n            for _bdt_raw, _bval_raw in reversed(list(zip(_boj_dates_arr, _boj_vals_arr))):\n                if _bval_raw is None:\n                    continue\n                try:\n                    tona = float(_bval_raw)\n                    _bs = str(int(_bdt_raw))\n                    tona_source = f'TONA via BoJ API FM01/STRDCLUCON \xB7 {_bs[:4]}-{_bs[4:6]}-{_bs[6:8]}'\n                    tona_is_daily = True\n                    print(f'    [JPY] TONA={tona}% ({tona_source})')\n                    break\n                except (ValueError, TypeError):\n                    continue\n    except Exception as _eboj:\n        print(f'    [JPY] BoJ API failed: {_eboj}')\n\n \
        \   today_d = _date.today()\n    # Secondary: SNB zimoma (monthly) \u2014 only attempted if BoJ API above failed\n    if tona is None:\n        m = today_d.month - 4\n        y = today_d.year\n        if m <= 0:\n            m += 12\n            y -= 1\n        from_date = f'{y}-{m:02d}'\n        try:\n            snb_url = (\n                'https://data.snb.ch/api/cube/zimoma/data/csv/en'\n                f'?dimSel=D0(TONA)&fromDate={from_date}'\n            )\n            r = requests.get(snb_url, headers=HEADERS, timeout=15)\n            r.raise_for_status()\n            lines = r.text.splitlines()\n            data_lines = [l for l in lines[3:] if l.strip() and ';' in l]\n            for line in reversed(data_lines):\n                parts = [p.strip().strip('\"') for p in line.split(';')]\n                if len(parts) >= 3 and parts[2]:\n                    try:\n                        tona = float(parts[2])\n                        tona_source = f'TONA via SNB zimoma \xB7\
        \ {parts[0]}'\n                        print(f'    [JPY] TONA={tona}% ({tona_source})')\n                        break\n                    except ValueError:\n                        continue\n        except Exception as e:\n            print(f'    [JPY] SNB zimoma failed: {e}')\n\n    print(f'    [JPY] TONA={tona}%  BoJ rate={policy}%')\n    if tona is not None and policy is not None:\n        diff = tona - policy\n\n        # \u2500\u2500 TONA settlement lag guard (v8.2.0) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        # \u2500\u2500 TONA staleness + settlement lag guard (v8.16.0) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        # Two failure modes require suppression of TONA spot classify:\n        #\n        # (A) MONTHLY SOURCE LAG \u2014 SNB zimoma TONA is a monthly dataset.\n        #     parts[0] in\
        \ the CSV is \"YYYY-MM\" (e.g. \"2026-05\").\n        #     After a BoJ hike in June, zimoma still shows the May average\n        #     for weeks. diff = 0.727 - 1.00 = -0.273 \u2192 classify() returns\n        #     cut/100%, which is exactly wrong.\n        #     Fix: if the TONA observation month < current month, suppress.\n        #\n        # (B) SETTLEMENT LAG (daily TONA, when available) \u2014 TONA is\n        #     published by JSDA 1\u20132 business days after a BoJ policy change.\n        #     Original guard checked days_since_change <= 2, but rates/*.json\n        #     uses FRED monthly series dated to the 1st of the month \u2014\n        #     a hike on June 16 appears as date=\"2026-06-01\", so\n        #     days_since_change = 16, guard never fired.\n        #     Fix: check whether obs[0] and obs[1] differ AND obs[0] is in\n        #     the current calendar month \u2014 that means a rate change occurred\n        #     this month, regardless of the exact day FRED\
        \ assigned.\n        #\n        # Either condition routes to TIER 0-C (BoJ MPM vote scraper).\n        _tona_suppressed = False\n        if abs(diff) > 0.05 and not tona_is_daily:\n            # Guard A: monthly TONA source lag (SNB zimoma only \u2014 the BoJ\n            # API leg is daily and structurally cannot exhibit this lag)\n            if tona_source is not None:\n                try:\n                    # tona_source format: \"TONA via SNB zimoma \xB7 2026-05\"\n                    _tona_date_part = tona_source.split('\xB7')[-1].strip()  # \"2026-05\"\n                    _tona_y = int(_tona_date_part[:4])\n                    _tona_m = int(_tona_date_part[5:7])\n                    if (_tona_y, _tona_m) < (_today_jpy.year, _today_jpy.month):\n                        print(\n                            f'    [JPY] TONA monthly staleness guard: '\n                            f'TONA date={_tona_date_part} is prior month '\n                            f'(today={_today_jpy.year}-{_today_jpy.month:02d}),\
        \ '\n                            f'diff={diff:+.3f}% \u2014 suppressing, falling through to TIER 0-C'\n                        )\n                        _tona_suppressed = True\n                except Exception as _emg:\n                    print(f'    [JPY] monthly staleness guard parse failed: {_emg}')\n\n            # Guard B: rate changed this calendar month (FRED monthly date = 1st)\n            if not _tona_suppressed:\n                _jpy_obs_lag = load_rate_obs('JPY')\n                if _jpy_obs_lag and len(_jpy_obs_lag) >= 2:\n                    try:\n                        _r0_lag = float(_jpy_obs_lag[0]['value'])\n                        _r1_lag = float(_jpy_obs_lag[1]['value'])\n                        _d0_lag = _date.fromisoformat(_jpy_obs_lag[0]['date'][:10])\n                        # Rate changed this month = obs[0] != obs[1] and obs[0]\n                        # is dated to the current month (FRED monthly granularity)\n                        _rate_changed_this_month\
        \ = (\n                            _r0_lag != _r1_lag\n                            and _d0_lag.year  == _today_jpy.year\n                            and _d0_lag.month == _today_jpy.month\n                        )\n                        if _rate_changed_this_month:\n                            print(\n                                f'    [JPY] TONA settlement lag guard: '\n                                f'rate changed {_r1_lag}%\u2192{_r0_lag}% this month '\n                                f'(obs date={_d0_lag}), diff={diff:+.3f}% \u2014 '\n                                f'suppressing TONA classify, falling through to TIER 0-C'\n                            )\n                            _tona_suppressed = True\n                    except Exception as _elag:\n                        print(f'    [JPY] settlement lag guard check failed: {_elag}')\n\n        if not _tona_suppressed:\n            # If TONA has moved meaningfully outside the hold zone, classify directly.\n       \
        \     if diff < -0.05:\n                cut_prob = min(100, round(abs(diff) / 0.25 * 100))\n                return 'cut', cut_prob, 0\n            if diff > 0.05:\n                hike_prob = min(100, round(diff / 0.25 * 100))\n                return 'hike', 0, hike_prob\n\n        # TONA is in the hold zone (abs(diff) \u2264 5bp) OR lag guard suppressed it \u2014\n        # this is the normal state. TONA anchors to the current BoJ policy rate\n        # and cannot encode forward market pricing. Fall through to TIER 0-B.\n\n    # ------------------------------------------------------------------ #\n    # TIER 0-C \u2014 BoJ MPM vote scraper (calendar-based direct URL)        #\n    # v8.15.0: replaces broken index-page scraper                        #\n    # ------------------------------------------------------------------ #\n    _jpy_obs = load_rate_obs('JPY')\n    _had_nirp = bool(_jpy_obs and any(float(o['value']) <= 0 for o in _jpy_obs))\n    _cur_jpy  = float(_jpy_obs[0]['value'])\
        \ if _jpy_obs else 0.0\n\n    # Only apply forward supplement in an active post-NIRP tightening cycle.\n    if not (_cur_jpy > 0 and _had_nirp):\n        return 'hold', 0, 0\n\n    _boj_supplement = 50  # post-NIRP baseline\n\n    try:\n        # Build candidate URLs directly from CALENDAR_2026 calendar.\n        # The old approach (scraping the index page for links) failed because\n        # BoJ's 2026 index page renders the decision link table via JavaScript,\n        # so the raw HTML response contains no k{YY}{MMDD}*.htm hrefs.\n        # Fix: construct URLs directly from known past meeting dates.\n        _today2 = _date.today()\n        _past_meetings = sorted(\n            [\n                _datetime.strptime(_ds, '%Y-%m-%d').date()\n                for _ds in CALENDAR_2026.get('JPY', [])\n                if _datetime.strptime(_ds, '%Y-%m-%d').date() < _today2\n            ],\n            reverse=True\n        )\n        _boj_page_r = None\n        _boj_page_url = None\n\
        \        for _mtg_d in _past_meetings[:4]:  # try last 4 meetings at most\n            _yy = str(_mtg_d.year)[2:]\n            _mmdd = f'{_mtg_d.month:02d}{_mtg_d.day:02d}'\n            for _sfx in ['a', 'b', '']:\n                _cu = (\n                    f'https://www.boj.or.jp/en/mopo/mpmdeci/'\n                    f'mpr_{_mtg_d.year}/k{_yy}{_mmdd}{_sfx}.htm'\n                )\n                try:\n                    _cr = requests.get(_cu, headers=HEADERS, timeout=10)\n                    if _cr.status_code == 200 and len(_cr.text) > 300:\n                        _boj_page_r = _cr\n                        _boj_page_url = _cu\n                        break\n                except Exception:\n                    continue\n            if _boj_page_r is not None:\n                break\n\n        if _boj_page_r is not None:\n            print(f'    [JPY] BoJ MPM page: {_boj_page_url} ({len(_boj_page_r.text)}B)')\n            _vote_text = ' '.join(_boj_page_r.text.split()).lower()\n\
        \n            if 'voted unanimously' in _vote_text or 'unanimous' in _vote_text:\n                _boj_supplement = 50\n                print(f'    [JPY] BoJ vote: unanimous hold \u2192 supplement={_boj_supplement}bp')\n            else:\n                # Count members who voted to raise rates\n                _raise_m = re.search(\n                    r'(\\d)\\s+(?:members?\\s+)?voted?\\s+(?:to\\s+)?raise',\n                    _vote_text\n                )\n                _hike_voters = int(_raise_m.group(1)) if _raise_m else 0\n                if _hike_voters == 0:\n                    # Try split pattern: \"6 to 3\" / \"six to three\" / \"6, with 3\"\n                    _sp = re.search(\n                        r'(\\d)\\s*(?:,\\s*with\\s+|to\\s+|against\\s+)(\\d)',\n                        _vote_text\n                    )\n                    if _sp:\n                        _hike_voters = int(_sp.group(2))\n                # v8.15.0: recalibrated vs rateprobability.com /\
        \ Polymarket Jun 2026\n                # Market ~97% hike probability with April 28 6-3 vote (3 hawk dissenters)\n                _boj_supplement = (\n                    97 if _hike_voters >= 3 else   # 3+ hawks \u2192 imminent hike ~97%\n                    80 if _hike_voters == 2 else   # 2 hawks \u2192 clearly hawkish ~80%\n                    65 if _hike_voters == 1 else   # 1 hawk \u2192 mildly hawkish ~65%\n                    50                             # unanimous \u2192 neutral post-NIRP\n                )\n                print(f'    [JPY] BoJ vote: hike_voters={_hike_voters} \u2192 supplement={_boj_supplement}bp')\n        else:\n            print(f'    [JPY] BoJ MPM: no page found for last {len(_past_meetings[:4])} meetings \u2192 baseline {_boj_supplement}bp')\n\n    except Exception as _ej:\n        print(f'    [JPY] BoJ vote parse failed: {_ej} \u2192 baseline {_boj_supplement}bp')\n\n    print(f'    [JPY] TONA hold zone \u2192 vote-calibrated supplement={_boj_supplement}bp')\n\
        \    print(f'    [JPY] blended hikeProb={_boj_supplement}%  (TONA hold + BoJ MPM vote)')\n    return 'hike', 0, _boj_supplement\n\n    # ------------------------------------------------------------------ #\n    # TIER 1 \u2014 FRED IRSTCI01JPM156N (OECD overnight Japan, monthly)      #\n    # Unreachable in normal flow; retained as dead-code documentation     #\n    # of the ultimate fallback if all upstream branches were restructured #\n    # ------------------------------------------------------------------ #\n    jpy_oecd = fred_latest('IRSTCI01JPM156N')\n    if jpy_oecd is not None and policy is not None:\n        if abs(jpy_oecd - policy) > 0.50:\n            print(f'    [JPY] FRED IRSTCI01JPM156N={jpy_oecd}%  BoJ rate={policy}%')\n            print(f'    [JPY] diff={abs(jpy_oecd - policy):.2f}% exceeds 50bp \u2014 OECD series stale')\n        else:\n            print(f'    [JPY] FRED OECD overnight={jpy_oecd}%  BoJ rate={policy}% (SNB zimoma fallback)')\n            return\
        \ classify(jpy_oecd, policy, threshold=THRESHOLD_OECD)\n    return None, None, None\n\ndef fetch_bias_aud():\n    \"\"\"\n    AUD CB rate expectations \u2014 5-source chain.\n\n    SOURCE CHAIN (in order of preference):\n    1. investing.com ASX 30-day IB futures (instrument 8980)  [PRIMARY \u2014 daily, true OIS]\n         investing.com redistributes ASX 30-day Interbank Cash Rate Futures data\n         via api.investing.com/api/financialdata/8980/historical/chart/.\n         Instrument ID 8980 confirmed via browser DevTools (May 2026).\n         Accessible from GH Actions (cloudscraper passes Cloudflare WAF; status 200\n         with application/json confirmed in test run 2026-05-15).\n         Price format: 100 - implied_yield (ASX standard). Last close used.\n         Meeting probability computed via ASX formula (rate_tracker_calc.htm):\n           X = r_t*(n_b/N) + [p*(r_t\xB10.25) + (1-p)*r_t]*(n_a/N)\n         where X=implied yield, n_b=days before meeting, n_a=days after,\
        \ N=total.\n         STALENESS GUARD: last candle older than 3 business days \u2192 skip.\n         biasMethod: 'ois' via _source_override.\n\n    2. cash-rate-scraper GitHub CSV  [SECONDARY \u2014 daily, true ASX IB futures]\n         MattCowgill/cash-rate-scraper publishes daily CSVs of ASX 30-day IB\n         futures data on GitHub (no Cloudflare). CONFIRMED SCHEMA (from source R):\n           date       \u2014 1st of the contract expiry month (floor_date(dateExpiry,\"month\"))\n           cash_rate  \u2014 100 - pricePreviousSettlement (ASX-implied cash rate %)\n           scrape_date \u2014 previous settlement date\n         Files named scraped_cash_rate_YYYY-MM-DD.csv. Parser selects nearest\n         contract whose expiry month >= next RBA meeting month.\n         STALENESS GUARD: file age > 7 days \u2192 skip (repo may have stopped\n         updating if ASX changes its upstream API again).\n         biasMethod: 'ois' via _source_override.\n\n    3. FRED IR3TIB01AUM156N \u2014\
        \ OECD AUD 3-month bank bill rate  [TERTIARY \u2014 monthly]\n         The 90-day bank bill rate is the canonical AUD money market forward rate.\n         It is structurally forward-looking: it prices in expected cash rate moves\n         over the next quarter. The spread (bank_bill - cash_rate) widens when the\n         market expects hikes, narrows/inverts when it expects cuts.\n         Adjustment: subtract a stable term premium (historically 20\u201330bp in normal\n         cycles) to isolate the policy-expectation signal. Guard: if adjusted diff\n         vs cash rate > 75bp or < -75bp, data is stale or anomalous \u2014 skip.\n         biasMethod: 'spread'.\n\n         NOTE \u2014 yfinance (formerly Tier 2, removed v7.79.5):\n         Yahoo Finance blocks ASX futures data from non-Australian IPs. Confirmed:\n         IBM6.AX and all IB{mc}{year}.AX formats return \"possibly delisted; no price\n         data\" from GH Actions runners (US IPs). Not a ticker-format issue \u2014\
        \ Yahoo's\n         market data licensing restricts ASX futures to AU-region access only.\n         RBA F1 OIS series (FIRMMOIS1): discontinued December 2022, data ends there.\n         ASX ib_expectation_curve_0.json / PDF: 403 Cloudflare from GH Actions IPs.\n         No free public API provides real-time ASX IB futures outside Australia.\n\n    4. ASX ib_expectation_curve_0.json  [QUATERNARY \u2014 daily, true OIS, Cloudflare-blocked]\n         Original ASX JSON endpoint. Kept for resilience: ASX may whitelist GH\n         Actions IPs in future, or Cloudflare posture may change.\n         biasMethod: 'ois' via _source_override.\n\n    5. FRED IRSTCI01AUM156N \u2014 OECD AUD overnight rate  [QUINARY \u2014 monthly]\n         OECD overnight/call rate via FRED. Monthly, ~3-5 week lag.\n         Staleness guard: abs(diff)>50bp OR overnight>10bp below target.\n         biasMethod: 'spread'.\n\n    6. rates/AUD.json trajectory  [FALLBACK \u2014 heuristic]\n\n    DESIGN NOTE \u2014 source\
        \ history:\n      v7.23.27: ASX IB Expectation Curve PDF \u2014 dead (image-rendered, never updated).\n      v7.23.29: FRED IR3TIB01AUM156N \u2014 OECD 3-month interbank, same lag issue.\n      v7.23.30-v7.42.x: rates/AUD.json trajectory \u2014 heuristic, no market signal.\n      v7.43.0: ECB SDW AUONIA \u2014 hypothesis disproved, series returned 404.\n      v7.44.0: RBA F1 CSV \u2014 returned 403 (bot-blocking confirmed on first run).\n      v7.45.0: FRED IRSTCI01AUM156N + staleness guard \u2014 matches NZD pattern.\n      v7.49.0: ASX ib_expectation_curve_0.json added as true-OIS primary.\n      v7.52.0: Two-sided staleness guard for OECD \u2014 rejects pre-hike lag.\n               RBA Statistics API /A3/data added as secondary (403 in practice).\n      v7.79.0: cash-rate-scraper CSV + yfinance IB futures added as Tier 1/2.\n               ASX JSON demoted to Tier 3 (still tried; Cloudflare may relent).\n               RBA Statistics API removed (redundant \u2014 403 same as\
        \ ASX).\n      v7.79.5: yfinance removed \u2014 Yahoo Finance blocks ASX futures data from\n               non-AU IPs (market data licensing). All IB{mc}{year}.AX tickers\n               return \"possibly delisted\" from GH Actions US runners regardless\n               of ticker format. RBA F1 OIS series discontinued Dec 2022.\n               IR3TIB01AUM156N (90-day bank bill) promoted to Tier 2 with\n               spread-adjustment formula matching NZD pattern (term premium 25bp).\n      v7.81.0: Fix AUD Tier 1 return: cutProb/hikeProb now in correct slots (was\n               returning dominant prob in cutProb slot regardless of bias direction).\n               Clean all BIAS_SOURCE_LABELS to industry-standard instrument names\n               (no internal implementation details in user-facing tooltips).\n      v7.80.0: investing.com ASX IB futures (instrument 8980) added as Tier 1.\n               Instrument ID confirmed via browser DevTools 2026-05-15.\n               Status\
        \ 200 + application/json confirmed from GH Actions (cloudscraper).\n               Full ASX probability formula implemented (rate_tracker_calc.htm).\n               cash-rate-scraper demoted to Tier 2; IR3TIB demoted to Tier 3.\n    \"\"\"\n    rba_target = current_rate('AUD')\n\n    # \u2500\u2500 helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    def _aud_next_meeting_date():\n        \"\"\"Return the next upcoming, not-yet-resolved RBA meeting date as\n        a date object, or None. v8.46.0: skips a meeting dated today (or\n        earlier) if it's already been decided per ff_calendar.json,\n        instead of treating an already-announced decision as \"next\".\"\"\"\n        meetings_aud\
        \ = CALENDAR_2026.get('AUD', [])\n        today_d = date.today()\n        for m in sorted(meetings_aud):\n            m_d = date.fromisoformat(m)\n            if m_d >= today_d and not _meeting_resolved('AUD', m_d):\n                return m_d\n        return None\n\n    # -- Tier 1: investing.com ASX 30-day IB futures (instrument 8980) ----------\n    # api.investing.com redistributes ASX IB Cash Rate Futures data daily.\n    # Instrument ID 8980 confirmed via browser DevTools (2026-05-15).\n    # Accessible from GH Actions with cloudscraper: status 200 + JSON confirmed.\n    # Uses the official ASX formula (documented in rate_tracker_calc.htm):\n    #   X = r_t*(n_b/N) + [p*(r_new) + (1-p)*r_t]*(n_a/N)  \u2192  solve for p\n    # where X=implied yield from futures, n_b=days before meeting decision,\n    # n_a=days after (inclusive of decision day), N=total days in contract month.\n    try:\n        import calendar as _calendar\n        _inv_url = ('https://api.investing.com/api/financialdata/8980/'\n\
        \                    'historical/chart/?interval=P1D&pointscount=160')\n        _inv_headers = {\n            **HEADERS,\n            'X-Requested-With': 'XMLHttpRequest',\n            'domain-id': 'www',\n            'Referer': 'https://www.investing.com/rates-bonds/aud-30-day-interbank',\n        }\n        _inv_r = SCRAPER.get(_inv_url, headers=_inv_headers, timeout=15)\n        if _inv_r.status_code != 200:\n            raise ValueError(f'HTTP {_inv_r.status_code}')\n        _inv_data = _inv_r.json().get('data', [])\n        if not _inv_data:\n            raise ValueError('empty data array')\n\n        # Last candle: [timestamp_ms, open, high, low, close, volume, ?]\n        _inv_last = _inv_data[-1]\n        _inv_ts = date.fromtimestamp(_inv_last[0] / 1000)\n        _inv_price = float(_inv_last[4])  # close\n        _inv_age = (date.today() - _inv_ts).days\n\n        # Staleness guard: skip if last candle is older than 3 business days\n        # (accounts for weekends \u2014\
        \ Mon candle is 2 days old, acceptable)\n        if _inv_age > 5:\n            raise ValueError(f'last candle {_inv_ts} is {_inv_age}d old (>5d stale)')\n\n        _inv_implied = round(100.0 - _inv_price, 6)  # % p.a.\n        print(f'    [AUD] investing.com IB8980: price={_inv_price}  '\n              f'implied={_inv_implied}%  date={_inv_ts}  age={_inv_age}d')\n\n        if rba_target is None:\n            raise ValueError('rba_target unavailable for formula')\n\n        # Apply ASX probability formula for the next RBA meeting\n        _next_mtg = _aud_next_meeting_date()\n        if _next_mtg is None:\n            raise ValueError('no upcoming RBA meeting found in CALENDAR_2026')\n\n        # Contract month = the month containing the next meeting\n        # (ASX IB futures settle based on the calendar month of the RBA decision)\n        _cm_year  = _next_mtg.year\n        _cm_month = _next_mtg.month\n        _cm_days  = _calendar.monthrange(_cm_year, _cm_month)[1]  # N\n     \
        \   _cm_start = date(_cm_year, _cm_month, 1)\n        # n_b = days from start of month up to (but not including) meeting day\n        _n_b = (_next_mtg - _cm_start).days\n        # n_a = remaining days including meeting day\n        _n_a = _cm_days - _n_b\n\n        X   = _inv_implied / 100.0\n        r_t = rba_target   / 100.0\n\n        # Test cut (r_new = r_t - 0.25pp) and hike (r_new = r_t + 0.25pp)\n        # p = (X - r_t) / ((r_new - r_t) * (n_a / N))\n        _p_cut  = 0.0\n        _p_hike = 0.0\n        _denom_cut  = (r_t - 0.0025 - r_t) * (_n_a / _cm_days)  # negative\n        _denom_hike = (r_t + 0.0025 - r_t) * (_n_a / _cm_days)  # positive\n        if _denom_cut  != 0: _p_cut  = max(0.0, min(1.0, (X - r_t) / _denom_cut))\n        if _denom_hike != 0: _p_hike = max(0.0, min(1.0, (X - r_t) / _denom_hike))\n\n        print(f'    [AUD] ASX formula: N={_cm_days} n_b={_n_b} n_a={_n_a} '\n              f'meeting={_next_mtg}  cut={_p_cut*100:.1f}%  hike={_p_hike*100:.1f}%')\n\
        \n        # Determine bias and dominant probability\n        # v8.121.0: mode-of-distribution rule, same fix as the shared\n        # Barchart helper \u2014 see its comment above for full rationale.\n        _p_hold = max(0.0, 1.0 - _p_cut - _p_hike)\n        if _p_cut >= _p_hike and _p_cut >= _p_hold:\n            _inv_bias = 'cut'\n            _inv_prob = _p_cut\n        elif _p_hike > _p_cut and _p_hike >= _p_hold:\n            _inv_bias = 'hike'\n            _inv_prob = _p_hike\n        else:\n            _inv_bias = 'hold'\n            _inv_prob = _p_hold\n\n        print(f'    [AUD] investing.com \u2192 {_inv_bias}  prob={_inv_prob*100:.1f}%  [ois]')\n        _source_override['AUD'] = 'ois'\n        # Return (bias, cutProb, hikeProb) \u2014 match classify() signature: integers 0-100.\n        # _p_cut/_p_hike are fractions 0.0\u20131.0; convert to 0\u2013100 integer scale.\n        if _inv_bias == 'cut':\n            return _inv_bias, min(100, round(_p_cut  * 100)), 0\n   \
        \     elif _inv_bias == 'hike':\n            return _inv_bias, 0, min(100, round(_p_hike * 100))\n        else:\n            return _inv_bias, 0, 0\n\n    except Exception as _e:\n        print(f'    [AUD] investing.com IB8980 unavailable: {_e}')\n\n    # -- Backup: Barchart IQ (SFE 30-Day Bank Rate futures), meeting-bracketed (v8.119.0) --\n    # NEW, optional backup tier. This is the SAME underlying instrument as\n    # Tier 1 above (ASX 30-Day Interbank Cash Rate Futures) via a different\n    # vendor \u2014 \"SFE\" is the legacy Sydney Futures Exchange name Barchart\n    # still lists it under, now part of ASX. Not a methodology upgrade\n    # (Tier 1's investing.com feed is already the genuine market\n    # standard) \u2014 added purely as resilience if investing.com's feed\n    # ever breaks, using the shared bc-dynamic-config JSON helper\n    # confirmed working this session (2026-08-10, IQU26 snapshot). See\n    # _barchart_meeting_bracketed_bias() docstring for the discovery\n\
        \    # detail and its confirmed-live-from-sandbox caveat.\n    try:\n        _next_mtg_bc = _aud_next_meeting_date()\n        if _next_mtg_bc is None:\n            raise ValueError('no upcoming RBA meeting found in CALENDAR_2026')\n        _bias_abc, _cp_abc, _hp_abc = _barchart_meeting_bracketed_bias(\n            'AUD', 'IQ', _next_mtg_bc, rba_target)\n        return _bias_abc, _cp_abc, _hp_abc\n    except Exception as _eaudbc:\n        print(f'    [AUD] Barchart IQ futures (backup) unavailable: {_eaudbc}')\n\n    # -- Primary: cash-rate-scraper GitHub CSV (ASX IB futures, no Cloudflare) --\n    # MattCowgill/cash-rate-scraper fetches ASX IB futures each night via the\n    # Markit/ASX API and commits a dated CSV to daily_data/.\n    #\n    # CONFIRMED CSV SCHEMA (from scrape_cash_rate.R source, verified 2026-05-15):\n    #   date       \u2014 YYYY-MM-DD, floor_date(dateExpiry, \"month\"):\n    #                the 1st day of the month in which the IB futures contract expires.\n\
        \    #   cash_rate  \u2014 100 - pricePreviousSettlement: the ASX-implied cash rate in %.\n    #   scrape_date \u2014 date the data was scraped (previous settlement date).\n    #\n    # File naming: scraped_cash_rate_YYYY-MM-DD.csv (yesterday's date, per Sys.Date()-1).\n    # Strategy: list daily_data/ via GitHub Contents API, take the latest file,\n    # then select the row whose 'date' is the first contract month >= next RBA meeting.\n    try:\n        gh_api_url = ('https://api.github.com/repos/MattCowgill/cash-rate-scraper'\n                      '/contents/daily_data')\n        gh_r = requests.get(gh_api_url,\n                            headers={**HEADERS, 'Accept': 'application/vnd.github+json'},\n                            timeout=12)\n        gh_r.raise_for_status()\n        files = gh_r.json()\n        # Files named scraped_cash_rate_YYYY-MM-DD.csv \u2014 pick lex-last\n        csv_files = sorted(\n            [f for f in files if isinstance(f, dict) and\n            \
        \ f.get('name', '').endswith('.csv')],\n            key=lambda f: f['name']\n        )\n        if csv_files:\n            latest_file = csv_files[-1]\n            csv_url = latest_file.get('download_url') or latest_file.get('url')\n            csv_date = latest_file['name'].replace('.csv', '')\n            # Staleness guard: reject CSV files older than 7 days.\n            # MattCowgill/cash-rate-scraper stopped updating when ASX changed\n            # its API (last file: scraped_cash_rate_2025-03-10.csv as of May 2026).\n            # A stale CSV produces futures prices from months ago and must not\n            # be used for policy-bias classification.\n            try:\n                _date_part = csv_date.replace('scraped_cash_rate_', '')\n                _file_date = date.fromisoformat(_date_part)\n                _file_age_days = (date.today() - _file_date).days\n                if _file_age_days > 7:\n                    print(f'    [AUD] cash-rate-scraper CSV ({csv_date}):\
        \ '\n                          f'{_file_age_days}d old > 7d limit \u2014 stale, skipping')\n                    raise ValueError('stale')\n            except ValueError as _ve:\n                if str(_ve) == 'stale':\n                    raise\n                print(f'    [AUD] cash-rate-scraper: cannot parse date from '\n                      f'\"{csv_date}\" \u2014 proceeding without age check')\n            csv_r = requests.get(csv_url, headers=HEADERS, timeout=12)\n            csv_r.raise_for_status()\n            lines = csv_r.text.strip().splitlines()\n            if len(lines) >= 2:\n                header = [h.strip().strip('\"').lower()\n                          for h in lines[0].split(',')]\n                # Locate required columns by name\n                try:\n                    date_col = header.index('date')\n                    rate_col = next(i for i, h in enumerate(header)\n                                    if 'cash_rate' in h or 'cashrate' in h\n         \
        \                           or h == 'cash_rate')\n                except (ValueError, StopIteration):\n                    print(f'    [AUD] cash-rate-scraper CSV: unexpected header: {header}')\n                    raise ValueError('schema mismatch')\n                # The 'date' column is the 1st-of-month for the futures expiry.\n                # Select the row whose expiry month is >= next RBA meeting month.\n                next_mtg_crs = _aud_next_meeting_date()\n                # Floor next meeting to first of that month for comparison\n                next_mtg_month = (next_mtg_crs.replace(day=1).isoformat()\n                                  if next_mtg_crs else date.today().replace(day=1).isoformat())\n                best_implied = None\n                best_contract_date = None\n                for line in lines[1:]:\n                    parts = [p.strip().strip('\"') for p in line.split(',')]\n                    if len(parts) <= max(date_col, rate_col):\n           \
        \             continue\n                    try:\n                        contract_date = parts[date_col]\n                        if contract_date < next_mtg_month:\n                            continue  # expired contract, skip\n                        implied = float(parts[rate_col])\n                        if not (0.0 <= implied <= 20.0):\n                            continue\n                        # Take the nearest contract (smallest date >= meeting month)\n                        if best_contract_date is None or contract_date < best_contract_date:\n                            best_implied = implied\n                            best_contract_date = contract_date\n                    except (ValueError, IndexError):\n                        continue\n                if best_implied is not None and rba_target is not None:\n                    print(f'    [AUD] cash-rate-scraper CSV ({csv_date}): '\n                          f'cash_rate={best_implied}%  contract={best_contract_date}'\n\
        \                          f'  RBA target={rba_target}%')\n                    _source_override['AUD'] = 'ois'\n                    return classify(best_implied, rba_target, threshold=THRESHOLD_OECD)\n                else:\n                    print(f'    [AUD] cash-rate-scraper CSV ({csv_date}): '\n                          f'no row with contract_date >= {next_mtg_month}'\n                          f'  (header={header})')\n        else:\n            print(f'    [AUD] cash-rate-scraper: empty file list from GitHub API')\n    except Exception as e:\n        print(f'    [AUD] cash-rate-scraper unavailable: {e}')\n\n    # -- Secondary: FRED IR3TIB01AUM156N (OECD AUD 3-month bank bill rate) --\n    # The 90-day bank bill rate is AUD's canonical money market forward rate.\n    # It is forward-looking: the market prices expected cash rate moves into\n    # the bill rate. Spread (bill_rate - cash_rate) is positive in normal cycles\n    # (~20-30bp term premium), widens when hikes are priced,\
        \ inverts for cuts.\n    #\n    # Adjustment formula (mirrors NZD IR3TIB pattern):\n    #   AUD_TERM_PREMIUM = 0.25  (25bp \u2014 stable through 2022-2026 AU cycles)\n    #   adj_rate = ir3tib - AUD_TERM_PREMIUM\n    #   adj_diff = adj_rate - rba_target\n    #\n    # GUARDS:\n    #   Symmetric: |adj_diff| > 75bp \u2192 stale or anomalous \u2192 skip.\n    #   Asymmetric (cycle-aware): if adj_diff < 0 AND rates/AUD.json shows a\n    #     recent hike (r0 > r1, age \u2264 3mo), the negative diff is explained by\n    #     OECD monthly lag (4-6 weeks) \u2014 not a market cut signal. Skip.\n    #     Example: RBA hikes in March/May 2026 \u2192 IR3TIB still shows pre-hike\n    #     level \u2192 adj_diff = -41bp \u2192 would produce false \"cut 100%\".\n    AUD_TERM_PREMIUM = 0.25\n    try:\n        ir3tib_aud = fred_latest('IR3TIB01AUM156N')\n        if ir3tib_aud is not None and rba_target is not None:\n            adj_aud = round(ir3tib_aud - AUD_TERM_PREMIUM, 4)\n            adj_diff_aud\
        \ = round(adj_aud - rba_target, 4)\n            print(f'    [AUD] IR3TIB={ir3tib_aud}%  adj={adj_aud}%  '\n                  f'RBA={rba_target}%  adj_diff={adj_diff_aud:.2f}%')\n            if abs(adj_diff_aud) > 0.75:\n                print(f'    [AUD] IR3TIB guard triggered (|diff|>75bp) \u2014 stale or anomalous, skipping')\n            elif adj_diff_aud < 0:\n                # Negative adj_diff in a hike cycle = OECD lag artifact.\n                # Check rates/AUD.json: if recent hike (r0>r1, age\u22643mo), skip.\n                _obs_a = load_rate_obs('AUD')\n                _hike_cycle = False\n                if _obs_a and len(_obs_a) >= 2:\n                    try:\n                        _r0a = float(_obs_a[0]['value'])\n                        _r1a = float(_obs_a[1]['value'])\n                        _age_a = (date.today() - date.fromisoformat(_obs_a[0]['date'][:10]))\n                        _months_a = _age_a.days // 30\n                        _hike_cycle = (_r0a >\
        \ _r1a) and (_months_a <= 3)\n                    except Exception:\n                        pass\n                if _hike_cycle:\n                    print(f'    [AUD] IR3TIB adj_diff={adj_diff_aud:.2f}% < 0 but '\n                          f'recent hike cycle detected \u2014 OECD lag artifact, skipping')\n                else:\n                    return classify(adj_aud, rba_target, threshold=THRESHOLD_OECD)\n            else:\n                return classify(adj_aud, rba_target, threshold=THRESHOLD_OECD)\n        else:\n            print(f'    [AUD] IR3TIB01AUM156N unavailable from FRED')\n    except Exception as e:\n        print(f'    [AUD] IR3TIB01AUD error: {e}')\n\n    # -- Tertiary: ASX ib_expectation_curve_0.json (Cloudflare-blocked on GH runner)\n    # Retained for resilience \u2014 may succeed if ASX relaxes bot-detection.\n    try:\n        asx_url = 'https://www.asx.com.au/data/trt/ib_expectation_curve_0.json'\n        asx_headers = {**HEADERS, 'Accept': 'application/json',\n\
        \                       'Referer': 'https://www.asx.com.au/'}\n        asx_r = requests.get(asx_url, headers=asx_headers, timeout=12)\n        asx_r.raise_for_status()\n        ct = asx_r.headers.get('Content-Type', '')\n        if 'html' in ct.lower():\n            raise ValueError(f'ASX returned HTML not JSON (Content-Type: {ct})')\n        asx_data = asx_r.json()\n        meetings_list = (asx_data if isinstance(asx_data, list)\n                         else asx_data.get('meetings', asx_data.get('data', [])))\n        if meetings_list:\n            first = meetings_list[0]\n            implied = None\n            for key in ('impliedCashRate', 'implied_cash_rate', 'rate',\n                        'impliedRate', 'cashRate'):\n                if key in first:\n                    try:\n                        implied = float(first[key])\n                        break\n                    except (ValueError, TypeError):\n                        continue\n            meeting_date =\
        \ first.get('meetingDate') or first.get('date', 'unknown')\n            if implied is not None and rba_target is not None:\n                print(f'    [AUD] ASX IB JSON={implied}%  RBA target={rba_target}%'\n                      f'  meeting={meeting_date}')\n                _source_override['AUD'] = 'ois'\n                return classify(implied, rba_target, threshold=THRESHOLD_OECD)\n            else:\n                print(f'    [AUD] ASX JSON parsed but no implied rate \u2014 keys:'\n                      f' {list(first.keys())}')\n    except Exception as e:\n        print(f'    [AUD] ASX IB JSON unavailable: {e}')\n\n    # -- Quaternary: FRED IRSTCI01AUM156N (OECD AUD overnight rate) ----\n    aud_overnight = fred_latest('IRSTCI01AUM156N')\n\n    if aud_overnight is not None and rba_target is not None:\n        aud_diff = aud_overnight - rba_target\n        # Two-sided staleness guard (v7.52.0): rejects OECD data that lags\n        # an RBA hike cycle (overnight<target-10bp)\
        \ or has implausible spread.\n        _aud_stale = (abs(aud_diff) > 0.50) or (aud_diff < -0.10)\n        if _aud_stale:\n            print(f'    [AUD] FRED IRSTCI01AUM156N={aud_overnight}%  RBA target={rba_target}%')\n            print(f'    [AUD] diff={aud_diff:.2f}% \u2014 OECD data stale (pre-hike lag or >50bp spread)')\n            print(f'    [AUD] staleness guard triggered \u2014 falling back to rates/AUD.json trajectory')\n        else:\n            print(f'    [AUD] OECD overnight={aud_overnight}%  RBA target={rba_target}%')\n            return classify(aud_overnight, rba_target, threshold=THRESHOLD_OECD)\n\n    # -- Fallback: rates/AUD.json trajectory (heuristic) --------------\n    if aud_overnight is None:\n        print(f'    [AUD] all market sources unavailable \u2014 falling back to rates/AUD.json trajectory')\n    obs = load_rate_obs('AUD')\n    if not obs or len(obs) < 2:\n        print(f'    [AUD] rates/AUD.json insufficient data \u2014 deferring to heuristic')\n\
        \        return None, None, None\n\n    try:\n        r0 = float(obs[0]['value'])\n        r1 = float(obs[1]['value'])\n        r2 = float(obs[2]['value']) if len(obs) > 2 else r1\n\n        from datetime import date as _date\n        today_d = _date.today()\n        age = _date.fromisoformat(obs[0]['date'][:10])\n        months_old = (today_d.year - age.year) * 12 + (today_d.month - age.month)\n\n        print(f'    [AUD] trajectory: r0={r0}% ({obs[0][\"date\"]}), r1={r1}%, r2={r2}%  age={months_old}mo')\n\n        if r0 > r1 and r1 > r2:\n            print(f'    [AUD] two consecutive hikes -> hike  [heuristic]')\n            return 'hike', None, None\n        if r0 < r1 and r1 < r2:\n            print(f'    [AUD] two consecutive cuts -> cut  [heuristic]')\n            return 'cut', None, None\n        if months_old <= 3:\n            if r0 > r1:\n                print(f'    [AUD] recent hike (<=3mo) -> hike  [heuristic]')\n                return 'hike', None, None\n           \
        \ if r0 < r1:\n                print(f'    [AUD] recent cut (<=3mo) -> cut  [heuristic]')\n                return 'cut', None, None\n        print(f'    [AUD] no clear trajectory -> hold  [heuristic]')\n        return 'hold', None, None\n\n    except Exception as e:\n        print(f'    [AUD] trajectory analysis failed: {e}')\n        return None, None, None\n\ndef fetch_bias_cad():\n    \"\"\"\n    CAD CB rate expectations \u2014 four-tier chain (v8.120.0).\n\n    TIER -1 \u2014 Barchart RI (CORRA 1-Month futures), meeting-bracketed\n      (v8.120.0): NEW, highest priority. Same shared\n      _barchart_meeting_bracketed_bias() helper and bc-dynamic-config\n      JSON mechanism already proven for USD/EUR/GBP/AUD (v8.119.0),\n      confirmed this session via a saved HTML snapshot of Barchart's\n      CORRA 1-Month quote page (front-month RIQ26, lastPrice=97.7125\n      \u2192 implied=2.2875%, ~4bp from BoC target \u2014 a sane reading).\n      Added to supersede TIER 0 below, whose\
        \ m-x.ca scrape returned\n      an implausible implied=0.25% (a 200bp-in-one-month read) on\n      its first live run this session. biasMethod: 'ois'.\n\n    TIER 0 \u2014 Montreal Exchange COA (1-Month CORRA Futures), meeting-\n      bracketed via the exchange's own methodology (v8.118.0):\n      NEW. m-x.ca publishes a public, unauthenticated \"Canadian Interest\n      Rate Expectations\" tool page with daily COA settlement prices and\n      their implied compounded CORRA rate per contract month. The page\n      also computes an \"Implied Probability of the BoC Movement\" column\n      itself \u2014 but that specific figure requires client-side JS input\n      (a spreadsheet-style calculator) and always renders 0.00% in the\n      static HTML; the underlying COA prices/implied-CORRA figures it is\n      built from are server-rendered and scrapable. TMX's own copy\n      describes this as \"comparable to the WIRP function in Bloomberg\n      based on the CAD OIS swap curve\" \u2014\
        \ this is the genuine BoC-\n      equivalent of the ASX 30-day IB futures formula already used for\n      AUD (same underlying idea CME FedWatch uses for USD, which this\n      terminal cannot access for free \u2014 see fetch_bias_usd()).\n      Formula (same as AUD's, applied to the contract month containing\n      the next BoC meeting):\n        X = r_t*(n_b/N) + r_new*(n_a/N)  \u2192  solve for r_new\n      where X = COA-implied compounded CORRA for that month's contract,\n      r_t = current BoC target (pre-meeting), n_b/n_a = days before/\n      after the meeting within that month, N = days in month. r_new is\n      tested at r_t\xB125bp to derive cut/hike probability.\n      LIMITATION: m-x.ca's tool only lists the ~4 nearest COA contract\n      months. A meeting more than ~4 months out falls through to TIER 1.\n      biasMethod: 'ois' via _source_override.\n      BUG + GUARD (v8.120.0): the first live GH Actions run of this\n      tier (right after v8.118.1's UnboundLocalError\
        \ fix shipped)\n      returned implied=0.25% against a BoC target of 2.25% \u2014 a\n      200bp-in-one-month read, caught by Santiago cross-checking\n      against m-x.ca's own CRA (3-Month) table (implied ~2.35% for\n      the same period, i.e. essentially flat) rather than trusted at\n      face value. Root cause unconfirmed (suspected column mismatch\n      in the COA-table regex \u2014 possibly reading \"Variation from\n      Actual CORRA Rate\" instead of \"Daily compounded CORRA\n      implied\"); Santiago's intended TMX HTML snapshot to diagnose\n      it didn't attach this session. Not fixed at the parsing level\n      \u2014 instead (a) demoted below the new Barchart RI TIER -1 above,\n      which supersedes it in normal operation, and (b) given a\n      >100bp-from-target sanity guard so that if this tier is ever\n      reached (Barchart RI unavailable), it raises instead of\n      publishing an implausible reading.\n\n    TIER 1 \u2014 cbonds.com OIS CAD (CORRA) curve,\
        \ meeting-bracketed (v8.19.0):\n      NEW. Full daily CORRA OIS curve (1W out to 40Y) via cbonds.com,\n      same mechanism as JPY/EUR/GBP/NZD's cbonds curves. Forward rate\n      between the next two BoC meetings via fwd(T1,T2), classified at\n      the standard 10bp daily-OIS threshold.\n      LIMITATION: the curve is structurally sparse between 3M and 18M\n      \u2014 cbonds publishes 1W, 1M, 3M, then jumps straight to 18M (no\n      2M or 4M-15M points). For the next two BoC meetings as of\n      2026-06-21 (15 Jul, ~24d; 9 Sep, ~80d), both T1 and T2 fall\n      within the populated 1W-3M region, so this is a clean bracket,\n      not a clamp \u2014 but a future meeting falling inside the 3M-18M\n      gap would degrade to a coarse straight-line interpolation\n      across 15 months. Flagged here for awareness, not yet hit.\n      biasMethod: 'ois' via _source_override.\n\n    TIER 2 \u2014 Bank of Canada Valet API CORRA spot (series AVG.INTWO):\n      Demoted from sole source\
        \ in v8.19.0 \u2014 the cbonds curve above is\n      forward-looking and meeting-bracketed; this is a same-day spot\n      print with no curve shape. Kept as a fallback for when cbonds\n      is unreachable.\n\n      FIX (v8.17.0): V122514 (used since this fetcher was introduced)\n      is NOT CORRA \u2014 confirmed by inspecting Valet's own series\n      metadata, V122514 is \"Overnight rate\", the policy target itself\n      (monthly, end-of-month dated), part of the\n      ATABLE_POLICY_INSTRUMENT table. This meant the CAD bias signal\n      was structurally comparing the policy rate against itself \u2014\n      diff was always \u22480, so this fetcher could never produce a real\n      cut/hike read regardless of actual market conditions. Same root\n      cause already fixed in fetch_ois_rates.py v6.1 (CHANGELOG\n      v8.8.4) but never ported here.\n\n      AVG.INTWO \u2014 \"Canadian Overnight Repo Rate Average (CORRA) (%)\"\n      \u2014 is the correct series, member of Valet's\
        \ own CORRA\n      observation group, published daily. Confirmed working in\n      fetch_ois_rates.py production run #47 (CORRA 2.3%, 2026-06-18).\n    \"\"\"\n    from datetime import date as _cad_date, datetime as _cad_dt, timedelta as _cad_td\n\n    cur = current_rate('CAD')\n    boc_target = cur  # v8.134.0: preserve the true BoC target separately \u2014\n    # `cur` gets reassigned below to the CORRA-spot anchor for the futures-\n    # formula tiers. Same failure mode as USD/GBP: Barchart RI and m-x.ca\n    # COA both settle against genuine daily CORRA, not the BoC's target\n    # rate decision. BoC's own CORRA methodology documents a small\n    # (~2bp average) structural spread versus target. TIER 2's own\n    # structural CORRA-vs-target check below must keep comparing against\n    # `boc_target`, not against the CORRA-basis `cur` used upstream.\n    # \u2500\u2500 v8.134.0: CORRA spot anchor for the futures/OIS-forward tiers \u2500\u2500\n    _corra_anchor = boc_latest('AVG.INTWO')\n\
        \    if _corra_anchor is not None:\n        _policy_anchor['CAD'] = _corra_anchor\n        print(f'    [CAD] CORRA/AVG.INTWO={_corra_anchor}%  BoC target={cur}%  '\n              f'(anchor for futures/OIS forward tiers)')\n    else:\n        print(f'    [CAD] BoC Valet CORRA unavailable \u2014 '\n              'TIER -1/TIER 0 formulas will be skipped (v8.135.4, see below); '\n              'boc_target retained only for TIER 2\\'s structural check')\n    # v8.135.4: `cur` no longer silently falls back to boc_target here \u2014\n    # same anchor-basis bug class as USD/GBP. TIER -1 (Barchart RI) and\n    # TIER 0 (m-x.ca COA) both consume `cur` below; each now guards on\n    # it being None and skips rather than anchoring the day-weighted\n    # formula to the raw BoC target. TIER 2's own structural check keeps\n    # using `boc_target` directly (unaffected, see its docstring).\n    cur = _corra_anchor\n    # NOTE: _cad_today must be defined before TIER 0 (below) since both TIER 0\n\
        \    # and TIER 1 reference it \u2014 v8.118.1 fix: TIER 0 was inserted ahead of the\n    # original TIER 0 (now TIER 1)'s `_cad_today = _cad_date.today()` line,\n    # which left TIER 0 reading a not-yet-assigned local var (UnboundLocalError,\n    # confirmed live in the first GH Actions run after v8.118.0 shipped \u2014\n    # TIER 0 parsed 4 COA contracts successfully, then crashed on this line\n    # before it could apply the formula, silently falling through to TIER 1).\n    _cad_today = _cad_date.today()\n\n    # \u2500\u2500 TIER -1: Barchart RI (CORRA 1-Month futures), meeting-bracketed (v8.120.0) \u2500\u2500\n    # NEW, highest priority. Santiago sent a saved HTML snapshot of Barchart's\n    # \"CORRA 1-Month Prices and CORRA 1-Month Futures Prices\" quote page this\n    # session (2026-08-10) \u2014 confirmed it uses the same server-rendered\n    # bc-dynamic-config JSON already proven for ZQ/EG/JU/IQ (v8.119.0), under\n    # symbol root 'RI' (front-month snapshot: RIQ26,\
        \ lastPrice=97.7125 \u2192\n    # implied=2.2875%, essentially flat vs BoC target 2.25% \u2014 a sane, ~4bp\n    # reading). This directly replaces TIER 0 below as primary: that tier's\n    # m-x.ca COA scrape returned implied=0.25% in the first live run this\n    # session (BoC target=2.25%, i.e. a 200bp cut in one month \u2014 not a\n    # plausible market read), most likely a column-parsing bug in the regex\n    # that reads m-x.ca's COA table (unconfirmed root cause \u2014 Santiago's TMX\n    # HTML snapshot intended to diagnose it didn't attach this session; not\n    # blocking, since this tier supersedes it). Uses the identical shared\n    # helper and formula as every other Barchart tier \u2014 no new parsing code.\n    # VERIFICATION CAVEAT: same class as the other four Barchart tiers \u2014\n    # parsed from a browser-fetched HTML snapshot, not a live GH Actions\n    # fetch from this sandbox (barchart.com unreachable here). Worth checking\n    # the first live run's log\
        \ for a successful \"[CAD] Barchart RI ... \u2192 \"\n    # line before treating this as fully proven, same discipline as v8.119.0.\n    try:\n        if cur is None:\n            raise ValueError(\n                'BoC Valet CORRA (AVG.INTWO) unavailable \u2014 skipping TIER -1 '\n                'rather than anchoring the formula to the raw BoC target')\n        _mtg_list_cadm1 = sorted(\n            _cad_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('CAD', []))\n        _future_cadm1 = _next_unresolved_meetings('CAD', _mtg_list_cadm1, _cad_today)\n        if not _future_cadm1:\n            raise ValueError('no upcoming BoC meeting found in CALENDAR_2026')\n        # v8.134.0: `cur` here is now the CORRA spot anchor (see note above),\n        # not the raw BoC target \u2014 this futures contract settles against CORRA.\n        _bias_cm1, _cp_cm1, _hp_cm1 = _barchart_meeting_bracketed_bias(\n            'CAD', 'RI', _future_cadm1[0], cur)\n      \
        \  return _bias_cm1, _cp_cm1, _hp_cm1\n    except Exception as _ecadbc:\n        print(f'    [CAD] Barchart RI futures unavailable: {_ecadbc}')\n\n    # \u2500\u2500 TIER 0: Montreal Exchange COA CORRA futures \u2014 meeting-bracketed (v8.118.0) \u2500\u2500\n    # Public, unauthenticated tool page; base COA prices/implied-CORRA figures\n    # are server-rendered (the page's own \"Implied Probability\" column needs\n    # client-side JS input and is not usable \u2014 see docstring above for detail).\n    try:\n        import calendar as _cad_calendar\n\n        _mx_url = 'https://www.m-x.ca/en/trading/tools/canadian-interest-rate-expectations'\n        _mx_r = requests.get(_mx_url, headers=HEADERS, timeout=15)\n        _mx_r.raise_for_status()\n        _mx_text = re.sub(r'<[^>]+>', ' ', _mx_r.text)\n        _mx_text = ' '.join(_mx_text.split())\n\n        _mx_month_names = ('January|February|March|April|May|June|July|August|'\n                            'September|October|November|December')\n\
        \        _mx_contracts = {}\n        for _mname, _myear, _mprice, _mimplied in re.findall(\n            rf'({_mx_month_names})\\s+(\\d{{4}})\\s*\\(COA\\w+\\)\\s+([\\d.]+)\\s+([\\d.]+)\\s*%',\n            _mx_text,\n        ):\n            _mx_contracts[(_mname, int(_myear))] = {\n                'price': float(_mprice), 'implied': float(_mimplied),\n            }\n\n        if not _mx_contracts:\n            raise ValueError('no COA contract rows parsed from m-x.ca')\n\n        print(f'    [CAD] m-x.ca: {len(_mx_contracts)} COA contract(s) parsed '\n              f'({\", \".join(f\"{m} {y}\" for m, y in _mx_contracts)})')\n\n        if cur is None:\n            raise ValueError('current BoC target unavailable for formula')\n\n        _mtg_list_cad0 = sorted(\n            _cad_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('CAD', [])\n        )\n        _future_mtgs_cad0 = _next_unresolved_meetings('CAD', _mtg_list_cad0, _cad_today)\n        if not _future_mtgs_cad0:\n\
        \            raise ValueError('no upcoming BoC meeting found in CALENDAR_2026')\n        _mx_next_mtg = _future_mtgs_cad0[0]\n\n        _mx_key = (_mx_next_mtg.strftime('%B'), _mx_next_mtg.year)\n        if _mx_key not in _mx_contracts:\n            raise ValueError(\n                f'no COA contract listed for {_mx_key[0]} {_mx_key[1]} '\n                f'(only {len(_mx_contracts)} near-month contracts published \u2014 '\n                f'meeting likely too far out for TIER 0)'\n            )\n\n        _mx_implied = _mx_contracts[_mx_key]['implied']\n\n        # Sanity guard (v8.120.0): confirmed live this session that this\n        # tier's regex can return an implausible implied rate (0.25% vs a\n        # 2.25% BoC target \u2014 a 200bp move in one month) \u2014 root cause\n        # unconfirmed (suspected column mismatch against m-x.ca's table,\n        # possibly capturing the \"Variation from Actual CORRA Rate\" column\n        # instead of \"Daily compounded CORRA implied\"\
        ), but this tier is now\n        # demoted below the new Barchart RI TIER -1 above, so it's only\n        # reached if Barchart RI itself fails. A >100bp gap from the current\n        # BoC target in either direction is economically implausible for a\n        # near-dated 1-month contract even in a fast-moving cycle \u2014 treat as\n        # a parse failure rather than publish it, matching the \"no invented\n        # fallbacks, no implausible values\" principle already applied via\n        # similar guards elsewhere (EUR's 150bp \u20ACSTR guard, AUD/NZD's\n        # 75-80bp OECD guards).\n        if abs(_mx_implied - cur) > 1.00:\n            raise ValueError(\n                f'{_mx_key[0]} {_mx_key[1]}: implied={_mx_implied}% vs '\n                f'anchor={cur}% \u2014 {abs(_mx_implied - cur)*100:.0f}bp gap '\n                f'exceeds 100bp sanity guard, likely a parse error, skipping')\n\n        _mx_days_in_month = _cad_calendar.monthrange(_mx_next_mtg.year, _mx_next_mtg.month)[1]\n\
        \        _mx_month_start = _cad_date(_mx_next_mtg.year, _mx_next_mtg.month, 1)\n        _mx_n_b = (_mx_next_mtg - _mx_month_start).days\n        _mx_n_a = _mx_days_in_month - _mx_n_b\n\n        X   = _mx_implied / 100.0\n        r_t = cur / 100.0\n        _mx_p_cut  = 0.0\n        _mx_p_hike = 0.0\n        _mx_denom_cut  = (r_t - 0.0025 - r_t) * (_mx_n_a / _mx_days_in_month)\n        _mx_denom_hike = (r_t + 0.0025 - r_t) * (_mx_n_a / _mx_days_in_month)\n        if _mx_denom_cut  != 0: _mx_p_cut  = max(0.0, min(1.0, (X - r_t) / _mx_denom_cut))\n        if _mx_denom_hike != 0: _mx_p_hike = max(0.0, min(1.0, (X - r_t) / _mx_denom_hike))\n\n        print(f'    [CAD] m-x.ca COA formula: contract={_mx_key[0]} {_mx_key[1]}  '\n              f'implied={_mx_implied}%  anchor(CORRA)={cur}%  '\n              f'N={_mx_days_in_month} n_b={_mx_n_b} n_a={_mx_n_a}  '\n              f'meeting={_mx_next_mtg}  cut={_mx_p_cut*100:.1f}%  hike={_mx_p_hike*100:.1f}%')\n\n        # v8.121.0: mode-of-distribution\
        \ rule, same fix as the shared\n        # Barchart helper and AUD's ASX formula \u2014 see the Barchart\n        # helper's comment above for full rationale (CME FedWatch\n        # divergence case).\n        _mx_p_hold = max(0.0, 1.0 - _mx_p_cut - _mx_p_hike)\n        if _mx_p_cut >= _mx_p_hike and _mx_p_cut >= _mx_p_hold:\n            _mx_bias = 'cut'\n        elif _mx_p_hike > _mx_p_cut and _mx_p_hike >= _mx_p_hold:\n            _mx_bias = 'hike'\n        else:\n            _mx_bias = 'hold'\n\n        print(f'    [CAD] m-x.ca COA \u2192 {_mx_bias}  cut={_mx_p_cut*100:.1f}%  '\n              f'hike={_mx_p_hike*100:.1f}%  [ois]')\n        _source_override['CAD'] = 'ois'\n        if _mx_bias == 'cut':\n            return _mx_bias, min(100, round(_mx_p_cut * 100)), 0\n        elif _mx_bias == 'hike':\n            return _mx_bias, 0, min(100, round(_mx_p_hike * 100))\n        else:\n            return _mx_bias, 0, 0\n\n    except Exception as _emx:\n        print(f'    [CAD] m-x.ca\
        \ COA futures unavailable: {_emx}')\n\n    # \u2500\u2500 TIER 1: cbonds.com OIS CAD (CORRA) curve \u2014 meeting-bracketed (v8.19.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (1W out to 40Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS CAD\n    # (Semiannual Money vs CORRA)\" family \u2014 same mechanism confirmed\n    # working for JPY/EUR/GBP/NZD's cbonds curves. One GET to index id\n    # 218385 (the \"1W\" page; any page in the subgroup returns the\n    # identical full ladder) returns all tenors in one response.\n    # Confirmed fresh (3 days old) on 2026-06-21.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) = (T2\xB7OIS(T2) \u2212 T1\xB7OIS(T1))\n    # / (T2\u2212T1) used for JPY/EUR/GBP/NZD. T1/T2 = days to the next two\n    # BoC meetings (CALENDAR_2026['CAD']), curve-interpolated.\n    # Classified via classify() against the BoC target rate using the\n    # standard 10bp threshold (daily OIS instrument).\n    #\
        \ (_cad_today is already defined above, before TIER 0 \u2014 v8.118.1)\n    _cad_cb_curve = {}\n    try:\n        _cad_cb_r = requests.get(\n            'https://cbonds.com/indexes/218385/',\n            headers=HEADERS, timeout=15,\n        )\n        _cad_cb_r.raise_for_status()\n        _cad_cb_text = re.sub(r'<[^>]+>', ' ', _cad_cb_r.text)\n        _cad_cb_text = ' '.join(_cad_cb_text.split())\n        _cad_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _ctnr, _crate in re.findall(\n            r'OIS CAD \\(Semiannual Money vs CORRA\\) (\\d{1,2}[WMY])\\s+([\\d.]+)\\s*%',\n            _cad_cb_text,\n        ):\n            try:\n                _cdays = int(_ctnr[:-1]) * _cad_cb_unit[_ctnr[-1]]\n                _cad_cb_curve[_cdays] = float(_crate)\n            except ValueError:\n                continue\n    except Exception as _ecad:\n        print(f'    [CAD] cbonds OIS curve fetch failed: {_ecad}')\n\n    if len(_cad_cb_curve) < 4:\n        print(f'    [CAD] cbonds OIS\
        \ curve: only {len(_cad_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif cur is not None:\n        _cad_days_sorted = sorted(_cad_cb_curve)\n        print(\n            f'    [CAD] cbonds OIS curve: {len(_cad_cb_curve)} tenors parsed '\n            f'({_cad_days_sorted[0]}d={_cad_cb_curve[_cad_days_sorted[0]]}% \u2026 '\n            f'{_cad_days_sorted[-1]}d={_cad_cb_curve[_cad_days_sorted[-1]]}%)'\n        )\n\n        def _cad_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _cad_days_sorted[0]:\n                return _cad_cb_curve[_cad_days_sorted[0]], _cad_days_sorted[0], _cad_days_sorted[0]\n            if _target >= _cad_days_sorted[-1]:\n                return _cad_cb_curve[_cad_days_sorted[-1]], _cad_days_sorted[-1], _cad_days_sorted[-1]\n            for _i in\
        \ range(len(_cad_days_sorted) - 1):\n                _d0, _d1 = _cad_days_sorted[_i], _cad_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _cad_cb_curve[_d0], _cad_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _cad_cb_curve[_cad_days_sorted[-1]], _cad_days_sorted[-1], _cad_days_sorted[-1]\n\n        _mtg_list_cad = sorted(\n            _cad_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('CAD', [])\n        )\n        _future_mtgs_cad = _next_unresolved_meetings('CAD', _mtg_list_cad, _cad_today)\n\n        if len(_future_mtgs_cad) >= 1:\n            _ct1_date = _future_mtgs_cad[0]\n            _ct2_date = (\n                _future_mtgs_cad[1] if len(_future_mtgs_cad) >= 2\n                else (_ct1_date + _cad_td(days=49))\n            )\n            _ct1_days = (_ct1_date - _cad_today).days\n     \
        \       _ct2_days = (_ct2_date - _cad_today).days\n\n            if _ct1_days >= 0 and _ct2_days > _ct1_days:\n                if _ct1_days < _cad_days_sorted[0] or _ct2_days > _cad_days_sorted[-1]:\n                    print(\n                        f'    [CAD] note: meeting bracket ({_ct1_days}d/{_ct2_days}d) falls '\n                        f'partly outside the densely-sampled curve region \u2014 see TIER 0 '\n                        f'sparse-curve limitation above'\n                    )\n                _cad_ois_t1, _cad_t1_d0, _cad_t1_d1 = _cad_cb_interp(_ct1_days)\n                _cad_ois_t2, _cad_t2_d0, _cad_t2_d1 = _cad_cb_interp(_ct2_days)\n                _cad_fwd = (_ct2_days * _cad_ois_t2 - _ct1_days * _cad_ois_t1) / (_ct2_days - _ct1_days)\n                print(\n                    f'    [CAD] cbonds curve: OIS({_ct1_days}d\u2192{_ct1_date})={_cad_ois_t1:.4f}%  '\n                    f'[{_cad_t1_d0}d-{_cad_t1_d1}d]  '\n                    f'OIS({_ct2_days}d\u2192\
        {_ct2_date})={_cad_ois_t2:.4f}%  '\n                    f'[{_cad_t2_d0}d-{_cad_t2_d1}d]'\n                )\n                print(\n                    f'    [CAD] cbonds implied post-meeting forward={_cad_fwd:.4f}%  anchor(CORRA)={cur}%'\n                )\n                _cb0, _ccp0, _chp0 = classify(_cad_fwd, cur)\n                if _cb0 is not None:\n                    print(f'    [CAD] cbonds OIS curve \u2192 {_cb0}  cutProb={_ccp0}  hikeProb={_chp0}  [ois]')\n                    _source_override['CAD'] = 'ois'\n                    return _cb0, _ccp0, _chp0\n\n    # \u2500\u2500 TIER 2: Bank of Canada Valet API \u2014 CORRA spot (AVG.INTWO) \u2500\u2500\u2500\u2500\u2500\u2500\n    # Intentionally classified against `boc_target` (not the CORRA-basis\n    # `cur` reassigned above) \u2014 this tier's purpose is a genuine\n    # structural CORRA-vs-target check (same pattern as GBP's tertiary\n    # SONIA-vs-BankRate tier); comparing `_corra_anchor` (already CORRA)\n    # against\
        \ itself would always read \u22480. Reuses the top-of-function\n    # already-fetched `_corra_anchor` instead of re-fetching if present.\n    corra = _corra_anchor if _corra_anchor is not None else boc_latest('AVG.INTWO')\n    print(f'    [CAD] CORRA/AVG.INTWO={corra}%  BoC target={boc_target}%')\n    return classify(corra, boc_target)\n\ndef fetch_bias_chf():\n    \"\"\"\n    CHF CB rate expectations \u2014 three-tier chain (v8.19.0).\n\n    TIER 0 \u2014 cbonds.com OIS CHF (SARON) curve, meeting-bracketed (v8.19.0):\n      NEW. Full daily SARON OIS curve (1W out to 40Y) via cbonds.com,\n      same mechanism as JPY/EUR/GBP/NZD/CAD's cbonds curves. Forward\n      rate between the next two SNB meetings via fwd(T1,T2),\n      classified at the standard 10bp daily-OIS threshold. This curve\n      is densely sampled out to 1Y (monthly tenors 1M-11M present),\n      so the next SNB meeting (2026-09-24, ~95d out) brackets cleanly\n      between 3M and 4M with no clamping or sparse-region\
        \ degradation.\n      biasMethod: 'ois' via _source_override.\n\n    TIER 1 \u2014 SNB SARON spot via SNB data portal public REST API:\n      Demoted from sole source in v8.19.0 \u2014 the cbonds curve above is\n      forward-looking and meeting-bracketed; this is a same-day spot\n      print with no curve shape, and previously needed a manually\n      calibrated meeting-proximity multiplier (below) to approximate\n      what the curve now gives directly.\n      Cube: snbgwdzid \u2014 Swiss money market rates, daily frequency.\n      URL: https://data.snb.ch/api/cube/snbgwdzid/data/csv/en?dimSel=D0(SARON)\n      CSV format: 3-line header, then date;D0;value rows (separator ';').\n      Policy anchor: SNB sight deposit rate from current_rate('CHF').\n      Threshold 5bp \u2014 SARON tracks SNB policy rate closely.\n\n    TIER 2 \u2014 FRED IRSTCI01CHM156N (OECD overnight Switzerland, monthly):\n      Activated when both TIER 0 and TIER 1 are unavailable.\n    \"\"\"\n    from datetime\
        \ import date as _chf_date, datetime as _chf_dt, timedelta as _chf_td2\n\n    policy = current_rate('CHF')\n\n    # \u2500\u2500 TIER 0: cbonds.com OIS CHF (SARON) curve \u2014 meeting-bracketed (v8.19.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (1W out to 40Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS CHF\n    # (Annual Money vs SARON)\" family \u2014 same mechanism confirmed working\n    # for JPY/EUR/GBP/NZD/CAD's cbonds curves. One GET to index id 217715\n    # (the \"1W\" page; any page in the subgroup returns the identical\n    # full ladder) returns all tenors in one response. Confirmed fresh\n    # (3 days old) on 2026-06-21.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) formula as the other\n    # cbonds curves. T1/T2 = days to the next two SNB meetings\n    # (CALENDAR_2026['CHF']), curve-interpolated.\n    _chf_today = _chf_date.today()\n    _chf_cb_curve = {}\n    try:\n        _chf_cb_r = requests.get(\n\
        \            'https://cbonds.com/indexes/217715/',\n            headers=HEADERS, timeout=15,\n        )\n        _chf_cb_r.raise_for_status()\n        _chf_cb_text = re.sub(r'<[^>]+>', ' ', _chf_cb_r.text)\n        _chf_cb_text = ' '.join(_chf_cb_text.split())\n        _chf_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _ftnr, _frate in re.findall(\n            r'OIS CHF \\(Annual Money vs SARON\\) (\\d{1,2}[WMY])\\s+(-?[\\d.]+)\\s*%',\n            _chf_cb_text,\n        ):\n            try:\n                _fdays = int(_ftnr[:-1]) * _chf_cb_unit[_ftnr[-1]]\n                _chf_cb_curve[_fdays] = float(_frate)\n            except ValueError:\n                continue\n    except Exception as _echf:\n        print(f'    [CHF] cbonds OIS curve fetch failed: {_echf}')\n\n    if len(_chf_cb_curve) < 4:\n        print(f'    [CHF] cbonds OIS curve: only {len(_chf_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif policy is not None:\n        _chf_days_sorted = sorted(_chf_cb_curve)\n\
        \        print(\n            f'    [CHF] cbonds OIS curve: {len(_chf_cb_curve)} tenors parsed '\n            f'({_chf_days_sorted[0]}d={_chf_cb_curve[_chf_days_sorted[0]]}% \u2026 '\n            f'{_chf_days_sorted[-1]}d={_chf_cb_curve[_chf_days_sorted[-1]]}%)'\n        )\n\n        def _chf_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _chf_days_sorted[0]:\n                return _chf_cb_curve[_chf_days_sorted[0]], _chf_days_sorted[0], _chf_days_sorted[0]\n            if _target >= _chf_days_sorted[-1]:\n                return _chf_cb_curve[_chf_days_sorted[-1]], _chf_days_sorted[-1], _chf_days_sorted[-1]\n            for _i in range(len(_chf_days_sorted) - 1):\n                _d0, _d1 = _chf_days_sorted[_i], _chf_days_sorted[_i + 1]\n                if _d0 <= _target <=\
        \ _d1:\n                    _r0, _r1 = _chf_cb_curve[_d0], _chf_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _chf_cb_curve[_chf_days_sorted[-1]], _chf_days_sorted[-1], _chf_days_sorted[-1]\n\n        _mtg_list_chf = sorted(\n            _chf_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('CHF', [])\n        )\n        _future_mtgs_chf = _next_unresolved_meetings('CHF', _mtg_list_chf, _chf_today)\n\n        if len(_future_mtgs_chf) >= 1:\n            _ft1_date = _future_mtgs_chf[0]\n            _ft2_date = (\n                _future_mtgs_chf[1] if len(_future_mtgs_chf) >= 2\n                else (_ft1_date + _chf_td2(days=98))\n            )\n            _ft1_days = (_ft1_date - _chf_today).days\n            _ft2_days = (_ft2_date - _chf_today).days\n\n            if _ft1_days >= 0 and _ft2_days > _ft1_days:\n                _chf_ois_t1, _chf_t1_d0,\
        \ _chf_t1_d1 = _chf_cb_interp(_ft1_days)\n                _chf_ois_t2, _chf_t2_d0, _chf_t2_d1 = _chf_cb_interp(_ft2_days)\n                _chf_fwd = (_ft2_days * _chf_ois_t2 - _ft1_days * _chf_ois_t1) / (_ft2_days - _ft1_days)\n                print(\n                    f'    [CHF] cbonds curve: OIS({_ft1_days}d\u2192{_ft1_date})={_chf_ois_t1:.4f}%  '\n                    f'[{_chf_t1_d0}d-{_chf_t1_d1}d]  '\n                    f'OIS({_ft2_days}d\u2192{_ft2_date})={_chf_ois_t2:.4f}%  '\n                    f'[{_chf_t2_d0}d-{_chf_t2_d1}d]'\n                )\n                print(\n                    f'    [CHF] cbonds implied post-meeting forward={_chf_fwd:.4f}%  SNB={policy}%'\n                )\n                _fb0, _fcp0, _fhp0 = classify(_chf_fwd, policy)\n                if _fb0 is not None:\n                    print(f'    [CHF] cbonds OIS curve \u2192 {_fb0}  cutProb={_fcp0}  hikeProb={_fhp0}  [ois]')\n                    _source_override['CHF'] = 'ois'\n             \
        \       return _fb0, _fcp0, _fhp0\n\n    # \u2500\u2500 TIER 1: SNB SARON spot via SNB data portal public REST API \u2500\u2500\u2500\u2500\u2500\n    saron = None\n    try:\n        from datetime import date as _date, timedelta\n        today = _date.today()\n        from_date = (today - timedelta(days=14)).strftime('%Y-%m-%d')\n        snb_url = (\n            'https://data.snb.ch/api/cube/snbgwdzid/data/csv/en'\n            f'?dimSel=D0(SARON)&fromDate={from_date}'\n        )\n        r = requests.get(snb_url, headers=HEADERS, timeout=15)\n        r.raise_for_status()\n        lines = r.text.splitlines()\n        # SNB CSV: first 3 lines are header/metadata, data starts at line 4\n        data_lines = [l for l in lines[3:] if l.strip() and ';' in l]\n        for line in reversed(data_lines):\n            parts = [p.strip().strip('\"') for p in line.split(';')]\n            if len(parts) >= 3 and parts[2]:\n                try:\n                    saron = float(parts[2])\n   \
        \                 print(f'    [CHF] SARON={saron}% (SNB snbgwdzid \xB7 {parts[0]})')\n                    break\n                except ValueError:\n                    continue\n    except Exception as e:\n        print(f'    [CHF] SNB data portal failed: {e}')\n\n    print(f'    [CHF] SARON={saron}%  SNB rate={policy}%')\n    if saron is not None and policy is not None:\n        diff = saron - policy\n        if diff < -0.05:\n            # v8.6.0: SNB quarterly meeting proximity amplifier.\n            # SARON pre-positions for expected SNB cuts but only partially\n            # reflects the full probability: daily repo mechanics mean SARON\n            # moves ~1/3 of the full probability magnitude before a quarterly\n            # meeting. Amplify by meeting proximity:\n            #   \u226430 days: \xD73 (market fully pre-positioning)\n            #   \u226460 days: \xD72 (partial pre-positioning)\n            #   >60 days: \xD71 (no amplification, meeting too far)\n     \
        \       # Calibrated: SARON=-6bp vs SNB=0% \u2192 base 24% \xD7 3 = 72% \u2248 market 75%\n            # for June 18 2026 meeting (14 days out).\n            from datetime import date as _cd\n            _today_cd = _cd.today()\n            _chf_dates = [date.fromisoformat(d) for d in CALENDAR_2026.get('CHF', [])]\n            _chf_mtg = next((d for d in sorted(_chf_dates) if d >= _today_cd), None)\n            _days_to_snb = (_chf_mtg - _today_cd).days if _chf_mtg else 99\n            _snb_multiplier = 3 if _days_to_snb <= 30 else 2 if _days_to_snb <= 60 else 1\n            cut_prob_base = min(100, round(abs(diff) / 0.25 * 100))\n            cut_prob = min(100, cut_prob_base * _snb_multiplier)\n            print(f'    [CHF] diff={diff*100:.0f}bp  days_to_meeting={_days_to_snb}  '\n                  f'multiplier={_snb_multiplier}x  cutProb={cut_prob_base}%\u2192{cut_prob}%')\n            return 'cut', cut_prob, 0\n        if diff > 0.05:\n            hike_prob = min(100, round(diff\
        \ / 0.25 * 100))\n            return 'hike', 0, hike_prob\n        return 'hold', 0, 0\n\n    # -- TIER 2 Fallback: FRED IRSTCI01CHM156N (OECD overnight Switzerland, monthly) -\n    # Activated when SNB data portal is unavailable (503/timeout).\n    # Uses THRESHOLD_OECD (25bp) \u2014 OECD monthly averaging creates structural\n    # spread vs SNB sight deposit rate, same as AUD/NZD/JPY OECD pattern.\n    # Staleness guard: 50bp vs SNB sight deposit rate.\n    chf_oecd = fred_latest('IRSTCI01CHM156N')\n    if chf_oecd is not None and policy is not None:\n        if abs(chf_oecd - policy) > 0.50:\n            print(f'    [CHF] FRED IRSTCI01CHM156N={chf_oecd}%  SNB rate={policy}%')\n            print(f'    [CHF] diff={abs(chf_oecd - policy):.2f}% exceeds 50bp \u2014 OECD series stale')\n        else:\n            print(f'    [CHF] FRED OECD overnight={chf_oecd}%  SNB rate={policy}% (SNB portal fallback)')\n            return classify(chf_oecd, policy, threshold=THRESHOLD_OECD)\n   \
        \ return None, None, None\n\ndef fetch_bias_nzd():\n    \"\"\"\n    NZD CB rate expectations \u2014 6-source chain (v8.18.0).\n\n    SOURCE CHAIN (in order of preference):\n    0. cbonds.com OIS NZD (NZIONA) curve, meeting-bracketed  [NEW, v8.18.0 \u2014 PRIMARY]\n         Full daily NZIONA OIS curve (1M-30Y) via cbonds.com, same\n         mechanism as JPY/EUR/GBP's cbonds curves. Forward rate between\n         the next two RBNZ meetings via fwd(T1,T2), classified at the\n         standard 10bp daily-OIS threshold. LIMITATION: shortest\n         published tenor is 1M (~30d) \u2014 no sub-monthly point, unlike\n         JPY/GBP/EUR. When the next meeting is <30d out, the near leg\n         clamps to the 1M print instead of true interpolation (flagged\n         in the log whenever it triggers). Still strictly better than\n         the IR3TIB single-snapshot proxy below: it's a full curve, not\n         one point, and isn't behind Cloudflare like NZFBF. biasMethod:\n         'ois' via\
        \ _source_override.\n\n    1. NZFBF NZOR/NZOS \u2014 multi-route probe  [demoted from Primary, v8.18.0 \u2014 daily, true OIS forward]\n         NZFBF publishes NZ Overnight Indexed Swap RBNZ Meeting Date (NZOR)\n         closing mid-rates for each upcoming RBNZ meeting tenor. The website is\n         a Next.js SPA (Cloudflare-blocked from GH Actions; __NEXT_DATA__ is\n         empty at SSR time). We probe the Next.js internal data API endpoints\n         that the SPA client calls post-hydration, then fall through to the\n         legacy HTML parse as a belt-and-suspenders attempt.\n         biasMethod: 'ois' via _source_override.\n\n    2. NZFBF NZOS fallback paths  [PRIMARY-B \u2014 same source, different routes]\n         Tries: __NEXT_DATA__ JSON, HTML table parse.  Kept for resilience.\n\n    3. FRED IR3TIB01NZM156N \u2014 NZ 3M interbank (credit-adj)  [SECONDARY \u2014 monthly]\n         22bp credit-spread deduction isolates the OCR-expectations component.\n         Staleness\
        \ guard relaxed to 80bp (v7.79.0): OCR held at 2.25% since\n         Nov 2025 \u2014 at this rate level IR3TIB spread of 22-40bp is structural,\n         not stale, and the old 60bp guard was incorrectly blocking valid data.\n         RBNZ OCR-track supplement retained (max 55bp blended hikeProb).\n         biasMethod: 'spread'.\n\n    4. FRED IRSTCI01NZM156N \u2014 OECD overnight NZD  [TERTIARY \u2014 monthly]\n         Staleness guard relaxed to 75bp (v7.79.0): same rationale as IR3TIB \u2014\n         with OCR at 2.25%, a >50bp overnight deviation is implausible given\n         stable RBNZ policy; actual stale data shows deviations of 80bp+.\n         biasMethod: 'spread'.\n\n    5. rates/NZD.json trajectory  [FALLBACK \u2014 heuristic]\n\n    DESIGN NOTE \u2014 source history:\n      v7.44.0: FRED IRSTCI01NZM156N \u2014 no staleness guard \u2192 hike 100% false pos.\n      v7.45.0: staleness guard added (50bp vs OCR).\n      v7.47.0: FRED IRAS2YNZM156N (2Y bond) promoted to primary.\n\
        \      v7.48.0: NZFBF OIS (pd.read_html) added as true-OIS primary.\n      v7.50.0: NZFBF rewritten to stdlib HTMLParser (no pandas on GH runner).\n               IRAS2YNZM156N (400) replaced with RBNZ B2 CSV (2Y swap, daily).\n               ASX: Content-Type guard added (returns HTML not JSON on GH runner).\n      v7.52.0: NZFBF __NEXT_DATA__ probe added (SPA architecture).\n               IR3TIB reinstated with 22bp credit-spread deduction + RBNZ track.\n      v7.79.0: NZFBF: added Next.js _buildManifest + internal API endpoint probe.\n               RBNZ B2 CSV removed (Cloudflare blocks GH Actions \u2014 confirmed).\n               IR3TIB staleness guard relaxed 60bp\u219280bp (OCR at 2.25%, structural).\n               OECD overnight staleness guard relaxed 50bp\u219275bp (same rationale).\n      v8.13.0: NZFBF: switched from requests.get() to SCRAPER (cloudscraper) to\n               bypass Cloudflare WAF on nzfbf.co.nz. requests.get() returned a\n               challenge\
        \ page (200 OK, no table) causing '0 rows' log. Added\n               challenge-page detection guard (<5KB + no <table> tag).\n    \"\"\"\n    rbnz = current_rate('NZD')\n\n    # \u2500\u2500 TIER 0: cbonds.com OIS NZD (NZIONA) curve \u2014 meeting-bracketed (v8.18.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (1M out to 30Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS NZD\n    # (Annual Money vs NZIONA)\" family \u2014 same mechanism confirmed working\n    # for JPY TONA, EUR \u20ACSTR, and GBP SONIA. One GET to index id 218145\n    # (the \"1M\" page; any page in the subgroup returns the identical full\n    # ladder) returns all tenors in one response. Confirmed fresh\n    # (3 days old) on 2026-06-21.\n    #\n    # LIMITATION (documented honestly, not silently): unlike JPY (1D),\n    # GBP (SW=7d) or EUR (1W=7d), NZD's shortest published tenor is 1M\n    # (~30d) \u2014 there is no sub-monthly point. When the next RBNZ meeting\n\
        \    # is closer than 30 days out (as it is for the 2026-06-21 run: 8 Jul\n    # meeting is ~17 days away), _interp() cannot truly bracket T1 \u2014 it\n    # clamps to the 1M print as the nearest available read rather than\n    # interpolating. This is a coarser approximation for near-dated\n    # meetings than JPY/GBP/EUR get, and is flagged in the log output\n    # below whenever it triggers, so it's auditable rather than silent.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) formula as JPY/EUR/GBP.\n    # T1/T2 = days to the next two RBNZ MPC meetings\n    # (CALENDAR_2026['NZD']), curve-interpolated (or clamped, per above).\n    # Classified via classify() against the OCR using the standard 10bp\n    # threshold (daily OIS instrument).\n    from datetime import date as _nzd_date, datetime as _nzd_dt, timedelta as _nzd_td\n\n    _nzd_today = _nzd_date.today()\n    _nzd_cb_curve = {}\n    try:\n        _nzd_cb_r = requests.get(\n            'https://cbonds.com/indexes/218145/',\n\
        \            headers=HEADERS, timeout=15,\n        )\n        _nzd_cb_r.raise_for_status()\n        _nzd_cb_text = re.sub(r'<[^>]+>', ' ', _nzd_cb_r.text)\n        _nzd_cb_text = ' '.join(_nzd_cb_text.split())\n        _nzd_cb_unit = {'M': 30, 'Y': 360}\n        for _ntnr, _nrate in re.findall(\n            r'OIS NZD \\(Annual Money vs NZIONA\\) (\\d{1,2}[MY])\\s+([\\d.]+)\\s*%',\n            _nzd_cb_text,\n        ):\n            try:\n                _ndays = int(_ntnr[:-1]) * _nzd_cb_unit[_ntnr[-1]]\n                _nzd_cb_curve[_ndays] = float(_nrate)\n            except ValueError:\n                continue\n    except Exception as _enzd:\n        print(f'    [NZD] cbonds OIS curve fetch failed: {_enzd}')\n\n    if len(_nzd_cb_curve) < 4:\n        print(f'    [NZD] cbonds OIS curve: only {len(_nzd_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif rbnz is not None:\n        _nzd_days_sorted = sorted(_nzd_cb_curve)\n        print(\n            f'    [NZD] cbonds OIS curve:\
        \ {len(_nzd_cb_curve)} tenors parsed '\n            f'({_nzd_days_sorted[0]}d={_nzd_cb_curve[_nzd_days_sorted[0]]}% \u2026 '\n            f'{_nzd_days_sorted[-1]}d={_nzd_cb_curve[_nzd_days_sorted[-1]]}%)'\n        )\n\n        def _nzd_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _nzd_days_sorted[0]:\n                return _nzd_cb_curve[_nzd_days_sorted[0]], _nzd_days_sorted[0], _nzd_days_sorted[0]\n            if _target >= _nzd_days_sorted[-1]:\n                return _nzd_cb_curve[_nzd_days_sorted[-1]], _nzd_days_sorted[-1], _nzd_days_sorted[-1]\n            for _i in range(len(_nzd_days_sorted) - 1):\n                _d0, _d1 = _nzd_days_sorted[_i], _nzd_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _nzd_cb_curve[_d0],\
        \ _nzd_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _nzd_cb_curve[_nzd_days_sorted[-1]], _nzd_days_sorted[-1], _nzd_days_sorted[-1]\n\n        _mtg_list_nzd = sorted(\n            _nzd_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('NZD', [])\n        )\n        _future_mtgs_nzd = _next_unresolved_meetings('NZD', _mtg_list_nzd, _nzd_today)\n\n        if len(_future_mtgs_nzd) >= 1:\n            _nt1_date = _future_mtgs_nzd[0]\n            _nt2_date = (\n                _future_mtgs_nzd[1] if len(_future_mtgs_nzd) >= 2\n                else (_nt1_date + _nzd_td(days=49))\n            )\n            _nt1_days = (_nt1_date - _nzd_today).days\n            _nt2_days = (_nt2_date - _nzd_today).days\n\n            if _nt1_days >= 0 and _nt2_days > _nt1_days:\n                if _nt1_days < _nzd_days_sorted[0]:\n                    print(\n             \
        \           f'    [NZD] note: next meeting ({_nt1_days}d) is closer than the '\n                        f'shortest curve tenor ({_nzd_days_sorted[0]}d) \u2014 clamping to the '\n                        f'1M print rather than interpolating (see TIER 0 limitation above)'\n                    )\n                _nzd_ois_t1, _nzd_t1_d0, _nzd_t1_d1 = _nzd_cb_interp(_nt1_days)\n                _nzd_ois_t2, _nzd_t2_d0, _nzd_t2_d1 = _nzd_cb_interp(_nt2_days)\n                _nzd_fwd = (_nt2_days * _nzd_ois_t2 - _nt1_days * _nzd_ois_t1) / (_nt2_days - _nt1_days)\n                print(\n                    f'    [NZD] cbonds curve: OIS({_nt1_days}d\u2192{_nt1_date})={_nzd_ois_t1:.4f}%  '\n                    f'[{_nzd_t1_d0}d-{_nzd_t1_d1}d]  '\n                    f'OIS({_nt2_days}d\u2192{_nt2_date})={_nzd_ois_t2:.4f}%  '\n                    f'[{_nzd_t2_d0}d-{_nzd_t2_d1}d]'\n                )\n                print(\n                    f'    [NZD] cbonds implied post-meeting forward={_nzd_fwd:.4f}%\
        \  RBNZ OCR={rbnz}%'\n                )\n                _nb0, _ncp0, _nhp0 = classify(_nzd_fwd, rbnz)\n                if _nb0 is not None:\n                    print(f'    [NZD] cbonds OIS curve \u2192 {_nb0}  cutProb={_ncp0}  hikeProb={_nhp0}  [ois]')\n                    _source_override['NZD'] = 'ois'\n                    return _nb0, _ncp0, _nhp0\n\n    # -- TIER 1: NZFBF NZOR/NZOS \u2014 multi-route probe ------------------\n    # Demoted from Primary in v8.18.0 \u2014 kept for resilience (Cloudflare\n    # block may lift), but cbonds above is now preferred: confirmed\n    # reachable from this environment, vs NZFBF's confirmed-blocked\n    # status (see \"no __NEXT_DATA__\" in production logs).\n    # The NZFBF site (nzfbf.co.nz) returns 403 from GitHub Actions IPs due\n    # to Cloudflare. We keep the attempt for resilience (Cloudflare posture\n    # may change) and to capture the SSR data if it ever appears.\n    #\n    # Route A: Next.js internal data API /_next/data/{buildId}/...json\n\
        \    #   The SPA fetches data from this endpoint post-hydration. If we can\n    #   read the buildId from __NEXT_DATA__, we can call the data endpoint\n    #   directly and get structured JSON without a headless browser.\n    # Route B: __NEXT_DATA__ SSR block (usually empty for NZFBF).\n    # Route C: legacy HTML table parse.\n    try:\n        import json as _json, re as _re\n        from html.parser import HTMLParser\n\n        class _TblParser(HTMLParser):\n            def __init__(self):\n                super().__init__()\n                self._in_table = self._in_cell = False\n                self.rows, self._row, self._cell = [], [], ''\n            def handle_starttag(self, tag, attrs):\n                if tag == 'table': self._in_table = True\n                elif tag == 'tr' and self._in_table: self._row = []\n                elif tag in ('td', 'th') and self._in_table:\n                    self._in_cell = True; self._cell = ''\n            def handle_endtag(self, tag):\n\
        \                if tag == 'table': self._in_table = False\n                elif tag == 'tr' and self._in_table and self._row:\n                    self.rows.append(self._row[:])\n                elif tag in ('td', 'th') and self._in_table:\n                    self._in_cell = False\n                    self._row.append(self._cell.strip())\n            def handle_data(self, data):\n                if self._in_cell: self._cell += data\n\n        # v8.13.0: Use SCRAPER (cloudscraper) instead of requests.get\n        # to bypass Cloudflare WAF on nzfbf.co.nz \u2014 same approach as AUD/EUR\n        # investing.com probes. Previous requests.get() returned a Cloudflare\n        # challenge page (200 OK but empty table), causing '0 rows' log output.\n        nzfbf_url = 'https://www.nzfbf.co.nz/benchmarks/closing-rates/nzos'\n        _nzfbf_hdrs = {\n            **HEADERS,\n            'Referer': 'https://www.nzfbf.co.nz/',\n            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',\n\
        \        }\n        nzfbf_r = SCRAPER.get(nzfbf_url, headers=_nzfbf_hdrs, timeout=15)\n        nzfbf_r.raise_for_status()\n        _nzfbf_html = nzfbf_r.text\n        # Cloudflare challenge detection: if response is <5KB with no table, skip\n        if len(_nzfbf_html) < 5000 and '<table' not in _nzfbf_html.lower():\n            raise Exception(f'NZFBF: likely Cloudflare challenge page ({len(_nzfbf_html)}B, no table)')\n\n        # Route A: extract buildId and call Next.js data API\n        _nd_match = _re.search(\n            r'<script[^>]+id=[\"\\']__NEXT_DATA__[\"\\'][^>]*>(.*?)</script>',\n            _nzfbf_html, _re.S)\n        _nzfbf_found = False\n        if _nd_match:\n            try:\n                _nd = _json.loads(_nd_match.group(1))\n                _build_id = _nd.get('buildId', '')\n                # Route A: call /_next/data/{buildId}/benchmarks/closing-rates/nzos.json\n                if _build_id:\n                    _data_url = (f'https://www.nzfbf.co.nz/_next/data/{_build_id}'\n\
        \                                 f'/benchmarks/closing-rates/nzos.json')\n                    try:\n                        _da_r = requests.get(_data_url, headers=HEADERS, timeout=10)\n                        _da_r.raise_for_status()\n                        _da = _da_r.json()\n                        # Flatten and search for numeric rate fields\n                        _da_str = _json.dumps(_da)\n                        _da_rates = _re.findall(\n                            r'\"(?:rate|ois|closing|value|midRate|mid_rate)\"'\n                            r'\\s*:\\s*\"?([\\d.]+)%?\"', _da_str, _re.I)\n                        for _v in _da_rates:\n                            try:\n                                ois_rate = float(_v)\n                                if 0.0 <= ois_rate <= 15.0 and rbnz is not None:\n                                    print(f'    [NZD] NZFBF Next.js data API '\n                                          f'OIS={ois_rate}%  RBNZ OCR={rbnz}%')\n        \
        \                            _source_override['NZD'] = 'ois'\n                                    return classify(ois_rate, rbnz,\n                                                    threshold=THRESHOLD_OECD)\n                            except ValueError:\n                                continue\n                        print(f'    [NZD] NZFBF Next.js data API: no rate found')\n                    except Exception as _ea:\n                        print(f'    [NZD] NZFBF Next.js data API error: {_ea}')\n\n                # Route B: __NEXT_DATA__ inline rates\n                _nd_str = _json.dumps(_nd)\n                _nd_rates = _re.findall(\n                    r'\"(?:rate|ois|closing|value|midRate|mid_rate)\"'\n                    r'\\s*:\\s*\"?([\\d.]+)%?\"', _nd_str, _re.I)\n                for _v in _nd_rates:\n                    try:\n                        ois_rate = float(_v)\n                        if 0.0 <= ois_rate <= 15.0 and rbnz is not None:\n                 \
        \           print(f'    [NZD] NZFBF __NEXT_DATA__ '\n                                  f'OIS={ois_rate}%  RBNZ OCR={rbnz}%')\n                            _source_override['NZD'] = 'ois'\n                            _nzfbf_found = True\n                            return classify(ois_rate, rbnz, threshold=THRESHOLD_OECD)\n                    except ValueError:\n                        continue\n                _pp = _nd.get('props', {}).get('pageProps', {})\n                print(f'    [NZD] NZFBF __NEXT_DATA__ no rate \u2014 '\n                      f'pageProps keys: {list(_pp.keys())[:6]}')\n            except Exception as _e:\n                print(f'    [NZD] NZFBF __NEXT_DATA__ parse error: {_e}')\n        else:\n            _html_head = _nzfbf_html[:400].replace('\\n', ' ')\n            print(f'    [NZD] NZFBF no __NEXT_DATA__ \u2014 html[:400]: {_html_head}')\n\n        # Route C: HTML table parse (belt-and-suspenders)\n        if not _nzfbf_found:\n            parser = _TblParser()\n\
        \            parser.feed(_nzfbf_html)\n            data_rows = [r for r in parser.rows if len(r) >= 2]\n            for row in data_rows:\n                tenor = row[0]\n                for cell in row[1:]:\n                    try:\n                        ois_rate = float(cell.strip().rstrip('%').strip())\n                        if not (0.0 <= ois_rate <= 15.0):\n                            continue\n                        if rbnz is not None:\n                            print(f'    [NZD] NZFBF HTML table '\n                                  f'OIS={ois_rate}%  RBNZ OCR={rbnz}%'\n                                  f'  tenor={tenor}')\n                            _source_override['NZD'] = 'ois'\n                            return classify(ois_rate, rbnz, threshold=THRESHOLD_OECD)\n                    except (ValueError, IndexError):\n                        continue\n            print(f'    [NZD] NZFBF table parsed ({len(data_rows)} rows) '\n                  f'but no numeric\
        \ rate \u2014 sample: {data_rows[:2]}')\n    except Exception as e:\n        print(f'    [NZD] NZFBF unavailable: {e}')\n\n    # -- Secondary: FRED IR3TIB01NZM156N \u2014 NZ 3M interbank (credit-adj) --\n    # v7.79.0: staleness guard relaxed 60bp\u219280bp.\n    # Rationale: RBNZ has held OCR at 2.25% since Nov 2025. At this level,\n    # the structural NZ bank credit premium in IR3TIB is ~22bp. The previous\n    # 60bp guard was designed for a post-cut cycle where OECD data lagged a\n    # large OCR move, but was too tight for a stable-rate environment where\n    # IR3TIB spread = OCR + 22bp credit + ~0\u201315bp forward premium \u2192 37\u201347bp.\n    # 80bp guard only fires for genuinely stale data (2+ missed OCR moves).\n    CREDIT_SPREAD_NZD_3M = 0.22  # empirical NZ 3M interbank premium over OCR\n    nzd_3m = fred_latest('IR3TIB01NZM156N')\n    if nzd_3m is not None and rbnz is not None:\n        nzd_3m_adj = nzd_3m - CREDIT_SPREAD_NZD_3M\n        nzd_3m_diff = nzd_3m_adj\
        \ - rbnz\n        _nzd_3m_raw_spread = abs(nzd_3m - rbnz)\n        if _nzd_3m_raw_spread > 0.80:\n            # >80bp: data almost certainly lagging a missed OCR move\n            print(f'    [NZD] IR3TIB={nzd_3m}% (adj={nzd_3m_adj:.3f}%)  RBNZ OCR={rbnz}%')\n            print(f'    [NZD] raw spread={_nzd_3m_raw_spread:.2f}% >80bp \u2014 stale, skipping')\n        else:\n            # Credit-adjusted classify\n            _b3, _cp3, _hp3 = classify(nzd_3m_adj, rbnz, threshold=THRESHOLD_OECD)\n            # RBNZ OCR-track supplement: if the RBNZ's own MPS OCR track\n            # projects rising rates and IR3TIB-adj is positive, blend in\n            # a hike-probability supplement (max 55bp combined).\n            _nzd_obs = load_rate_obs('NZD')\n            _track_hike_bp = 0\n            if _nzd_obs and len(_nzd_obs) >= 3:\n                _r0 = float(_nzd_obs[0]['value'])\n                _r1 = float(_nzd_obs[1]['value'])\n                _r2 = float(_nzd_obs[2]['value'])\n  \
        \          if _r0 >= _r1 and _r1 >= _r2 and nzd_3m_diff >= 0.15:\n                    _track_hike_bp = 20  # v7.87.0: reduced from 40 \u2014 at OCR\u22642.25% the structural IR3TIB spread is smaller; 40bp overstated market pricing vs ~25% actual (interest.co.nz Apr 2026)\n                    # v8.6.0: gate added \u2014 only apply supplement if adj_diff >= 15bp\n                    # A +9bp adj_diff is within noise of the 22bp credit spread\n                    # estimation uncertainty and should not trigger a hike signal\n            if _b3 == 'hike' or (_b3 == 'hold' and _track_hike_bp > 0 and nzd_3m_diff > 0):\n                _hp_blended = min(55, (_hp3 or 0) + _track_hike_bp)\n                print(f'    [NZD] IR3TIB={nzd_3m}% adj={nzd_3m_adj:.3f}%  OCR={rbnz}%  '\n                      f'adj_diff={nzd_3m_diff:.2f}%  track_supplement={_track_hike_bp}bp')\n                print(f'    [NZD] blended hikeProb={_hp_blended}%  (IR3TIB-adj + RBNZ track)')\n                return 'hike',\
        \ 0, _hp_blended\n            elif _b3 == 'cut':\n                print(f'    [NZD] IR3TIB credit-adj signals cut  '\n                      f'adj={nzd_3m_adj:.3f}%  OCR={rbnz}%')\n                return _b3, _cp3, _hp3\n            else:\n                print(f'    [NZD] IR3TIB credit-adj: hold  '\n                      f'adj={nzd_3m_adj:.3f}%  OCR={rbnz}%')\n                return _b3, _cp3, _hp3\n\n    # -- Tertiary: FRED IRSTCI01NZM156N (OECD overnight) ---------------\n    # v7.79.0: staleness guard relaxed 50bp\u219275bp.\n    # With OCR at 2.25%, the OECD overnight series should track within\n    # 10-30bp in a stable-rate environment.  >75bp implies the OECD data\n    # is lagging at least two full OCR moves and should not be used.\n    nzd_overnight = fred_latest('IRSTCI01NZM156N')\n    if nzd_overnight is not None and rbnz is not None:\n        _nzd_ov_diff = abs(nzd_overnight - rbnz)\n        if _nzd_ov_diff > 0.75:\n            print(f'    [NZD] FRED IRSTCI01NZM156N={nzd_overnight}%\
        \  RBNZ OCR={rbnz}%')\n            print(f'    [NZD] diff={_nzd_ov_diff:.2f}% >75bp \u2014 OECD overnight stale, skipping')\n        else:\n            print(f'    [NZD] OECD overnight={nzd_overnight}%  RBNZ OCR={rbnz}%'\n                  f' (FRED IRSTCI01NZM156N)')\n            return classify(nzd_overnight, rbnz, threshold=THRESHOLD_OECD)\n\n    # -- Fallback: rates/NZD.json trajectory (heuristic) ---------------\n    print(f'    [NZD] all market sources unavailable \u2014 falling back to rates/NZD.json trajectory')\n    obs = load_rate_obs('NZD')\n    if not obs or len(obs) < 2:\n        print(f'    [NZD] rates/NZD.json insufficient data \u2014 deferring to heuristic')\n        return None, None, None\n\n    try:\n        r0 = float(obs[0]['value'])\n        r1 = float(obs[1]['value'])\n        r2 = float(obs[2]['value']) if len(obs) > 2 else r1\n\n        from datetime import date as _date\n        today_d = _date.today()\n        age = _date.fromisoformat(obs[0]['date'][:10])\n\
        \        months_old = (today_d.year - age.year) * 12 + (today_d.month - age.month)\n\n        print(f\"    [NZD] trajectory: r0={r0}% ({obs[0]['date']}), r1={r1}%, r2={r2}%  age={months_old}mo\")\n\n        if r0 < r1 and r1 < r2:\n            print(f'    [NZD] two consecutive cuts -> cut  [heuristic]')\n            return 'cut', None, None\n        if r0 > r1 and r1 > r2:\n            print(f'    [NZD] two consecutive hikes -> hike  [heuristic]')\n            return 'hike', None, None\n        if months_old <= 3:\n            if r0 > r1:\n                print(f'    [NZD] recent hike (<=3mo) -> hike  [heuristic]')\n                return 'hike', None, None\n            if r0 < r1:\n                print(f'    [NZD] recent cut (<=3mo) -> cut  [heuristic]')\n                return 'cut', None, None\n        print(f'    [NZD] no clear trajectory -> hold  [heuristic]')\n        return 'hold', None, None\n\n    except Exception as e:\n        print(f'    [NZD] trajectory analysis failed:\
        \ {e}')\n        return None, None, None\n\ndef fetch_bias_nok():\n    \"\"\"\n    NOK CB rate expectations \u2014 four-tier chain (v8.19.0).\n\n    TIER 0 \u2014 cbonds.com OIS NOK (NOWA) curve, meeting-bracketed (v8.19.0):\n      NEW. Full daily NOWA OIS curve (1W out to 30Y) via cbonds.com,\n      same mechanism as JPY/EUR/GBP/NZD/CAD/CHF's cbonds curves.\n      Forward rate between the next two Norges Bank meetings via\n      fwd(T1,T2), classified at the standard 10bp daily-OIS\n      threshold. This is a genuine OIS swap curve \u2014 a market-traded\n      forward instrument \u2014 and is structurally distinct from the\n      NOWA *spot print* used in TIER 1 below: the documented\n      unreliability of a single NOWA print (administratively pegged\n      to policy on most days per Norges Bank's own 2018 consultation\n      report, see TIER 1 docstring) does not apply to the OIS curve,\n      since OIS swap rates are priced by the broader derivatives\n      market, not derived\
        \ from NOWA transaction volume on any single\n      day. biasMethod: 'ois' via _source_override (registered ahead\n      of TIER 1's narrower SPREAD_PROXY_CCYS override).\n\n    TIER 1 \u2014 NOWA direct via Norges Bank's own public SDMX API\n      (data.norges-bank.no/api/data/SHORT_RATES/B.NOWA.ON., no key).\n      Demoted from TIER 0 in v8.19.0 \u2014 kept as a fallback for when\n      cbonds is unreachable, since it is still a genuine daily\n      Norges Bank-published series. Ported from fetch_ois_rates.py\n      v6.0 (confirmed live in production run #46, NOWA 4.0%,\n      2026-06-18) \u2014 same class of fix as JPY/CAD above (two parallel\n      \"get OIS rate for CCY X\" implementations that fell out of\n      sync).\n\n      GUARD (v8.17.1): the first production run after this fetcher\n      shipped (v8.17.0) returned 'cut' at 100% cutProb from a single\n      NOWA print 25bp below policy \u2014 investigated and found to be a\n      false signal, not real easing expectations.\
        \ Norges Bank's own\n      consultation report on alternative reference rates (Working\n      Group on Alternative Reference Rates for the Norwegian Krone,\n      Oct 2018) states NOWA requires data from \u22653 banks and \u2265NOK 250m\n      turnover to be transaction-based; absent that, \"Nowa is set\n      equal to the prevailing policy rate.\" The same report notes\n      NOWA had been transaction-based on roughly 30 days total since\n      its 2011 introduction \u2014 i.e. it is administratively pegged to\n      policy on the large majority of days, and on the rare days it\n      IS a real print, third-party analysis (Clarus FT) documents\n      historical divergence from the policy rate of 1-7 *percentage\n      points*, \"generally volatile.\" NOWA is therefore not the same\n      instrument class as SOFR/CORRA/SONIA/SARON/SWESTR (continuously\n      liquid, tightly policy-anchored) despite also being a daily\n      published series, and a single-print 10bp-threshold spot\n\
        \      comparison is the wrong tool for it.\n      Two changes vs v8.17.0: (1) classification threshold widened\n      from THRESHOLD (10bp) to THRESHOLD_OECD (25bp) \u2014 matching the\n      coarser tier already used for similarly thin/illiquid overnight\n      proxies (AUD/NZD OECD monthly); (2) a 'cut' or 'hike' result is\n      only trusted if corroborated by an actual recent policy move in\n      rates/NOK.json (mirrors the SEK v8.4.1 trajectory guard, but\n      bidirectional here since Clarus's divergence finding is not\n      one-sided like SEK's documented failure mode) \u2014 uncorroborated\n      signals are demoted to 'hold' with probability capped at 15.\n      biasMethod still becomes 'ois' via _source_override on success\n      (it remains a genuine daily Norges Bank-published series, more\n      current than the monthly OECD fallback) \u2014 only the\n      classification threshold and trust guard changed.\n\n    TIER 2  FRED IRSTCI01NOM156N (OECD Norway overnight\
        \ interbank rate,\n      monthly) vs Norges Bank policy rate \u2014 unchanged from the prior\n      sole implementation. biasMethod: 'spread' (THRESHOLD_OECD, 25bp),\n      registered via SPREAD_PROXY_CCYS (same as AUD/NZD).\n\n    Falls through to heuristic_bias('NOK') if all tiers are\n    unavailable or stale.\n    \"\"\"\n    import csv as _csv\n    import io as _io\n    from datetime import timedelta, datetime as _nok_dt, date as _nok_date, timedelta as _nok_td\n\n    policy = current_rate('NOK')\n\n    # \u2500\u2500 TIER 0: cbonds.com OIS NOK (NOWA) curve \u2014 meeting-bracketed (v8.19.0) \u2500\u2500\n    # cbonds renders the full subgroup tenor curve (1W out to 30Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS NOK\n    # (Annual Money vs NOWA)\" family \u2014 same mechanism confirmed working\n    # for JPY/EUR/GBP/NZD/CAD/CHF's cbonds curves. One GET to index id\n    # 217967 (the \"1W\" page; any page in the subgroup returns the\n    # identical\
        \ full ladder) returns all tenors in one response.\n    # Confirmed fresh (3 days old) on 2026-06-21.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) formula as the other\n    # cbonds curves. T1/T2 = days to the next two Norges Bank meetings\n    # (CALENDAR_2026['NOK']), curve-interpolated.\n    _nok_today = _nok_date.today()\n    _nok_cb_curve = {}\n    try:\n        _nok_cb_r = requests.get(\n            'https://cbonds.com/indexes/217967/',\n            headers=HEADERS, timeout=15,\n        )\n        _nok_cb_r.raise_for_status()\n        _nok_cb_text = re.sub(r'<[^>]+>', ' ', _nok_cb_r.text)\n        _nok_cb_text = ' '.join(_nok_cb_text.split())\n        _nok_cb_unit = {'W': 7, 'M': 30, 'Y': 360}\n        for _ktnr, _krate in re.findall(\n            r'OIS NOK \\(Annual Money vs NOWA\\) (\\d{1,2}[WMY])\\s+([\\d.]+)\\s*%',\n            _nok_cb_text,\n        ):\n            try:\n                _kdays = int(_ktnr[:-1]) * _nok_cb_unit[_ktnr[-1]]\n                _nok_cb_curve[_kdays]\
        \ = float(_krate)\n            except ValueError:\n                continue\n    except Exception as _enok:\n        print(f'    [NOK] cbonds OIS curve fetch failed: {_enok}')\n\n    if len(_nok_cb_curve) < 4:\n        print(f'    [NOK] cbonds OIS curve: only {len(_nok_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif policy is not None:\n        _nok_days_sorted = sorted(_nok_cb_curve)\n        print(\n            f'    [NOK] cbonds OIS curve: {len(_nok_cb_curve)} tenors parsed '\n            f'({_nok_days_sorted[0]}d={_nok_cb_curve[_nok_days_sorted[0]]}% \u2026 '\n            f'{_nok_days_sorted[-1]}d={_nok_cb_curve[_nok_days_sorted[-1]]}%)'\n        )\n\n        def _nok_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation), d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _nok_days_sorted[0]:\n                return _nok_cb_curve[_nok_days_sorted[0]],\
        \ _nok_days_sorted[0], _nok_days_sorted[0]\n            if _target >= _nok_days_sorted[-1]:\n                return _nok_cb_curve[_nok_days_sorted[-1]], _nok_days_sorted[-1], _nok_days_sorted[-1]\n            for _i in range(len(_nok_days_sorted) - 1):\n                _d0, _d1 = _nok_days_sorted[_i], _nok_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _nok_cb_curve[_d0], _nok_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _nok_cb_curve[_nok_days_sorted[-1]], _nok_days_sorted[-1], _nok_days_sorted[-1]\n\n        _mtg_list_nok = sorted(\n            _nok_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('NOK', [])\n        )\n        _future_mtgs_nok = _next_unresolved_meetings('NOK', _mtg_list_nok, _nok_today)\n\n        if len(_future_mtgs_nok) >= 1:\n            _kt1_date = _future_mtgs_nok[0]\n     \
        \       _kt2_date = (\n                _future_mtgs_nok[1] if len(_future_mtgs_nok) >= 2\n                else (_kt1_date + _nok_td(days=42))\n            )\n            _kt1_days = (_kt1_date - _nok_today).days\n            _kt2_days = (_kt2_date - _nok_today).days\n\n            if _kt1_days >= 0 and _kt2_days > _kt1_days:\n                _nok_ois_t1, _nok_t1_d0, _nok_t1_d1 = _nok_cb_interp(_kt1_days)\n                _nok_ois_t2, _nok_t2_d0, _nok_t2_d1 = _nok_cb_interp(_kt2_days)\n                _nok_fwd = (_kt2_days * _nok_ois_t2 - _kt1_days * _nok_ois_t1) / (_kt2_days - _kt1_days)\n                print(\n                    f'    [NOK] cbonds curve: OIS({_kt1_days}d\u2192{_kt1_date})={_nok_ois_t1:.4f}%  '\n                    f'[{_nok_t1_d0}d-{_nok_t1_d1}d]  '\n                    f'OIS({_kt2_days}d\u2192{_kt2_date})={_nok_ois_t2:.4f}%  '\n                    f'[{_nok_t2_d0}d-{_nok_t2_d1}d]'\n                )\n                print(\n                    f'    [NOK] cbonds\
        \ implied post-meeting forward={_nok_fwd:.4f}%  Norges Bank={policy}%'\n                )\n                _kb0, _kcp0, _khp0 = classify(_nok_fwd, policy)\n                if _kb0 is not None:\n                    print(f'    [NOK] cbonds OIS curve \u2192 {_kb0}  cutProb={_kcp0}  hikeProb={_khp0}  [ois]')\n                    _source_override['NOK'] = 'ois'\n                    return _kb0, _kcp0, _khp0\n\n    # TIER 1 \u2014 NOWA direct (Norges Bank SHORT_RATES SDMX CSV, no key)\n    try:\n        _nb_end   = date.today().strftime('%Y-%m-%d')\n        _nb_start = (date.today() - timedelta(days=21)).strftime('%Y-%m-%d')\n        _nb_r = requests.get(\n            'https://data.norges-bank.no/api/data/SHORT_RATES/B.NOWA.ON.',\n            params={\n                'format': 'csv', 'locale': 'en',\n                'startPeriod': _nb_start, 'endPeriod': _nb_end,\n            },\n            headers=HEADERS, timeout=15,\n        )\n        _nb_r.raise_for_status()\n        _nb_text =\
        \ _nb_r.text.lstrip('\\ufeff')\n        try:\n            _nb_dialect = _csv.Sniffer().sniff(_nb_text.splitlines()[0])\n        except Exception:\n            _nb_dialect = _csv.excel\n        _nb_rows = list(_csv.DictReader(_io.StringIO(_nb_text), dialect=_nb_dialect))\n        nowa, nowa_dt = None, None\n        if _nb_rows:\n            _nb_cols = list(_nb_rows[0].keys())\n            _dt_col  = next((c for c in _nb_cols if c.strip().upper() in\n                             ('TIME_PERIOD', 'DATE', 'TID', 'TIME')), None)\n            _val_col = next((c for c in _nb_cols if c.strip().upper() in\n                             ('OBS_VALUE', 'VALUE', 'NOWA')), None)\n            if _dt_col and _val_col:\n                _nb_sorted = sorted(_nb_rows, key=lambda x: x.get(_dt_col, ''))\n                for _row in reversed(_nb_sorted):\n                    _raw = _row.get(_val_col)\n                    if _raw not in (None, '', '.'):\n                        try:\n                    \
        \        nowa    = float(str(_raw).replace(',', '.'))\n                            nowa_dt = _row.get(_dt_col)\n                            break\n                        except ValueError:\n                            continue\n            else:\n                print(f'    [NOK] SHORT_RATES CSV \u2014 unrecognised columns {_nb_cols}')\n        else:\n            print('    [NOK] SHORT_RATES CSV \u2014 empty response')\n\n        if nowa is not None and policy is not None:\n            print(f'    [NOK] NOWA direct (Norges Bank SHORT_RATES) = {nowa}% '\n                  f'({nowa_dt})  Norges Bank rate={policy}%')\n            diff = nowa - policy\n            if abs(diff) > 0.50:\n                print(f'    [NOK] |diff|={abs(diff):.2f}% exceeds 50bp guard \u2014 '\n                      f'stale or post-move lag, falling through to TIER 2')\n            else:\n                _source_override['NOK'] = 'ois'\n                _nok_bias, _nok_cp, _nok_hp = classify(nowa, policy, threshold=THRESHOLD_OECD)\n\
        \n                if _nok_bias in ('cut', 'hike'):\n                    # Trajectory guard (v8.17.1): NOWA is administratively\n                    # pegged to policy absent sufficient transaction data\n                    # (the large majority of days per Norges Bank's own\n                    # 2018 consultation report) and documented as diverging\n                    # by 1-7pp on the rare days it is real \u2014 a single print\n                    # is corroborated against actual recent policy moves\n                    # before being trusted, same convention as SEK v8.4.1.\n                    TRAJECTORY_LOOKBACK = 6  # meetings (~1 year at 6-8/yr cadence)\n                    _nok_obs = load_rate_obs('NOK')\n                    _recent_move = False\n                    if _nok_obs and len(_nok_obs) >= 2:\n                        try:\n                            _r0 = float(_nok_obs[0]['value'])\n                            for _o in _nok_obs[1:TRAJECTORY_LOOKBACK + 1]:\n  \
        \                              _rp = float(_o['value'])\n                                if (_nok_bias == 'cut' and _rp > _r0) or \\\n                                   (_nok_bias == 'hike' and _rp < _r0):\n                                    _recent_move = True\n                                    break\n                        except Exception:\n                            pass\n                    if not _recent_move:\n                        _prob = _nok_cp if _nok_bias == 'cut' else _nok_hp\n                        _prob_demoted = min(15, _prob or 0)\n                        print(f'    [NOK] NOWA implies {_nok_bias} '\n                              f'(cutProb={_nok_cp}% hikeProb={_nok_hp}%) but '\n                              f'rates/NOK.json shows no {_nok_bias} in last '\n                              f'{TRAJECTORY_LOOKBACK} meetings (held at {policy}%) \u2014 '\n                              f'demoting to hold, prob capped at {_prob_demoted}% '\n                       \
        \       f'(v8.17.1 trajectory guard)')\n                        return 'hold', (_prob_demoted if _nok_bias == 'cut' else 0), \\\n                               (_prob_demoted if _nok_bias == 'hike' else 0)\n                    else:\n                        print(f'    [NOK] NOWA {_nok_bias} signal corroborated by '\n                              f'recent policy-rate trajectory \u2014 keeping {_nok_bias}, '\n                              f'cutProb={_nok_cp}% hikeProb={_nok_hp}%')\n                        return _nok_bias, _nok_cp, _nok_hp\n                else:\n                    return _nok_bias, _nok_cp, _nok_hp\n        elif nowa is not None:\n            print(f'    [NOK] NOWA={nowa}% but policy rate unavailable \u2014 '\n                  f'falling through to TIER 2')\n    except Exception as e:\n        print(f'    [NOK] Norges Bank SHORT_RATES failed: {e} \u2014 falling through to TIER 2')\n\n    # TIER 2 \u2014 FRED IRSTCI01NOM156N (OECD monthly) vs policy rate\n    nok_overnight\
        \ = fred_latest('IRSTCI01NOM156N')\n    print(f'    [NOK] IRSTCI01NOM156N={nok_overnight}%  Norges Bank rate={policy}%')\n\n    if nok_overnight is not None and policy is not None:\n        diff = nok_overnight - policy\n        # Staleness guard: OECD monthly series can lag 4-6 weeks. A spread\n        # beyond 50bp signals either a stale observation or a genuine post-move\n        # lag artifact (same convention as CHF/AUD OECD fallbacks).\n        if abs(diff) > 0.50:\n            print(f'    [NOK] |diff|={abs(diff):.2f}% exceeds 50bp guard \u2014 '\n                  f'stale or post-move lag, falling through to heuristic')\n        else:\n            return classify(nok_overnight, policy, threshold=THRESHOLD_OECD)\n    else:\n        print(f'    [NOK] FRED IRSTCI01NOM156N unavailable \u2014 falling through to heuristic')\n\n    return None, None, None\n\ndef fetch_bias_sek():\n    \"\"\"\n    SEK CB rate expectations \u2014 two-tier chain (v8.19.0).\n\n    TIER 0 \u2014 cbonds.com\
        \ OIS SEK (SWESTR) curve, meeting-bracketed\n      (v8.19.0; ID/regex corrected v8.121.1):\n      NEW. Full daily SWESTR OIS curve (1M out to 30Y) via cbonds.com,\n      same mechanism as JPY/EUR/GBP/NZD/CAD/CHF/NOK's cbonds curves.\n      Forward rate between the next two Riksbank meetings via\n      fwd(T1,T2), classified at the standard 10bp daily-OIS\n      threshold. LIMITATION: like NZD, the shortest published tenor\n      is 1M (~30d) \u2014 no sub-monthly point. The next Riksbank meeting\n      as of 2026-06-21 (25 Aug, ~65d out) falls between the 2M and\n      3M points, so this run brackets cleanly without clamping \u2014\n      but a meeting inside the first 30 days would clamp to the 1M\n      print the same way NZD's does (flagged in the log if it\n      triggers). This is a genuine market-traded OIS forward curve\n      against the SWESTR benchmark, not the SWESTR spot print used\n      in TIER 1 below, so the TIER 1 'cut' trajectory guard\n      (documented false-positive\
        \ history, see TIER 1 docstring)\n      does not apply here. biasMethod: 'ois' via _source_override.\n\n      BUG FOUND AND FIXED v8.121.1: the v8.19.0 implementation\n      shipped against id 218013 with regex text \"OIS SEK (Annual\n      Money vs STINA)\" \u2014 the live cbonds page is titled \"OIS SEK\n      (Annual Money vs SWESTR)\" starting at id 218059 (1M). Neither\n      the id nor the benchmark name ever matched, so this tier fell\n      through to TIER 1 (SWESTR spot) on every run since it shipped\n      \u2014 meaning SEK has effectively always been running on the\n      spot-print tier, not the curve. Confirmed via manually saved\n      HTML from the live subgroup (2026-08-10): 218059=1M, 218061=2M,\n      218063=3M, 218065=6M, stepping consistently with the other\n      cbonds OIS families. \"STINA\" does not appear anywhere on the\n      live page and was a naming error carried through the\n      docstring, code comments, and BIAS_SOURCE_LABELS.\n\n    TIER 1 \u2014\
        \ SWESTR spot via the Riksbank's dedicated SWESTR REST API:\n      Demoted from sole source in v8.19.0 \u2014 the cbonds curve above\n      is forward-looking and meeting-bracketed; this is a same-day\n      spot print with no curve shape, and previously needed a\n      trajectory-corroboration guard (below) to suppress a\n      documented false 'cut' signal that the curve now avoids by\n      construction.\n      CORRECTION (v8.4.0): earlier versions of this fetcher assumed\n      SWESTR required API-portal registration. Verified false \u2014 the\n      Riksbank publishes a separate, key-less SWESTR API (distinct\n      from the SWEA interest/exchange-rate API used by STIBOR/FX\n      series). Confirmed live:\n        GET https://api.riksbank.se/swestr/v1/all/SWESTR?fromDate=YYYY-MM-DD\n      Public access is rate-limited to 5 requests/minute per the\n      Riksbank's own API portal documentation\n      (developer.api.riksbank.se, tora-api / \"SWESTR API v1\") \u2014 well\n    \
        \  within this workflow's single-call-per-run usage.\n\n      SWESTR is a transaction-based overnight reference rate (like\n      SARON for CHF), published with a one-business-day lag and\n      three decimal places. Response rows: {rate, date, pctl12_5,\n      pctl87_5, volume, alternativeCalculation,\n      alternativeCalculationReason, publicationTime, republication,\n      numberOfTransactions, numberOfAgents}.\n\n      Threshold: THRESHOLD (10bp), same tier as SARON/CORRA/SOFR \u2014\n      SWESTR is a true daily overnight rate, not an OECD monthly\n      average, so THRESHOLD_OECD (25bp) would be the wrong\n      instrument class.\n\n      Guards:\n      - alternativeCalculation=true rows are skipped (Riksbank's own\n        flag for insufficient reporters/volume/technical error \u2014 see\n        alternativeCalculationReason 1-4).\n      - Sanity range check (\xB12.00% from the current policy rate)\n        before trusting a value \u2014 protects against transient bad\n \
        \       ticks (an isolated -5.413% misprint was observed in\n        historical data on 2023-12-29 with alternativeCalculation\n        still false, so the flag alone is not a sufficient guard).\n      - Staleness guard: only use values dated within the last 5\n        calendar days (SWESTR publishes every banking day; a longer\n        gap signals an API or pipeline issue, not real economic\n        staleness).\n\n      Falls through to heuristic_bias('SEK') if the API is\n      unreachable, all recent values fail the sanity/staleness\n      guards, or the policy rate is unavailable from rates/SEK.json.\n\n      GUARD (v8.4.1): SWESTR is a single overnight print, not a\n      forward-looking OIS curve. It can drift a few bp below the\n      policy rate purely on day-to-day collateral/liquidity flow,\n      with no link to the Riksbank's actual rate path. A naive spot\n      spread comparison previously returned a 'cut' bias (-11bp, 45%\n      cutProb) on a day when the Riksbank's\
        \ own communication,\n      market OIS pricing, and sell-side consensus (SEB, ING, Nordea,\n      Handelsbanken) were unanimously describing a hawkish hold with\n      hike risk skewed into H2 2026 \u2014 the opposite signal. Mirrors\n      the NZD fetcher's use of load_rate_obs() to sanity-check a\n      spot-derived signal against the CB's actual recent trajectory\n      (see _track_hike_bp above), applied here to suppress rather\n      than reinforce: a 'cut' from SWESTR alone is only trusted if\n      the policy rate has itself been cut at least once in the last\n      TRAJECTORY_LOOKBACK meetings. Sweden has held at 1.75% every\n      meeting since the last cut \u2014 under that condition a\n      SWESTR-implied cut is demoted to 'hold' with reduced cutProb\n      (capped at 15) rather than suppressed to 0, since a real (if\n      currently sub-threshold) softening signal in the overnight\n      market shouldn't be discarded outright, just kept from\n      outranking the Riksbank's\
        \ own stated path. A 'hike'\n      classification is never suppressed by this guard \u2014 only 'cut'\n      is symmetric-risk here, because the documented failure mode\n      was a false cut signal, not a false hike signal.\n    \"\"\"\n    from datetime import date as _sek_date, datetime as _sek_dt, timedelta as _sek_td\n\n    policy = current_rate('SEK')\n\n    # \u2500\u2500 TIER 0: cbonds.com OIS SEK (SWESTR) curve \u2014 meeting-bracketed \u2500\u2500\n    # (id/regex corrected v8.121.1 \u2014 see docstring BUG FOUND note above)\n    # cbonds renders the full subgroup tenor curve (1M out to 30Y) server-\n    # side, unauthenticated, on every index subpage in the \"OIS SEK\n    # (Annual Money vs SWESTR)\" family \u2014 same mechanism confirmed working\n    # for JPY/EUR/GBP/NZD/CAD/CHF/NOK's cbonds curves. One GET to index\n    # id 218059 (the \"1M\" page; any page in the subgroup returns the\n    # identical full ladder) returns all tenors in one response.\n    # Confirmed\
        \ fresh (same-day) on 2026-08-10.\n    #\n    # LIMITATION: like NZD, shortest published tenor is 1M (~30d) \u2014 no\n    # sub-monthly point. See docstring above for this run's bracket.\n    #\n    # Forward-rate extraction: same fwd(T1,T2) formula as the other\n    # cbonds curves. T1/T2 = days to the next two Riksbank meetings\n    # (CALENDAR_2026['SEK']), curve-interpolated (or clamped to the 1M\n    # print if a meeting falls inside 30 days, same as NZD).\n    _sek_today = _sek_date.today()\n    _sek_cb_curve = {}\n    try:\n        _sek_cb_r = requests.get(\n            'https://cbonds.com/indexes/218059/',\n            headers=HEADERS, timeout=15,\n        )\n        _sek_cb_r.raise_for_status()\n        _sek_cb_text = re.sub(r'<[^>]+>', ' ', _sek_cb_r.text)\n        _sek_cb_text = ' '.join(_sek_cb_text.split())\n        _sek_cb_unit = {'M': 30, 'Y': 360}\n        for _stnr, _srate in re.findall(\n            r'OIS SEK \\(Annual Money vs SWESTR\\) (\\d{1,2}[MY])\\s+([\\\
        d.]+)\\s*%',\n            _sek_cb_text,\n        ):\n            try:\n                _sdays = int(_stnr[:-1]) * _sek_cb_unit[_stnr[-1]]\n                _sek_cb_curve[_sdays] = float(_srate)\n            except ValueError:\n                continue\n    except Exception as _esek:\n        print(f'    [SEK] cbonds OIS curve fetch failed: {_esek}')\n\n    if len(_sek_cb_curve) < 4:\n        print(f'    [SEK] cbonds OIS curve: only {len(_sek_cb_curve)} tenor(s) parsed \u2014 skipping')\n    elif policy is not None:\n        _sek_days_sorted = sorted(_sek_cb_curve)\n        print(\n            f'    [SEK] cbonds OIS curve: {len(_sek_cb_curve)} tenors parsed '\n            f'({_sek_days_sorted[0]}d={_sek_cb_curve[_sek_days_sorted[0]]}% \u2026 '\n            f'{_sek_days_sorted[-1]}d={_sek_cb_curve[_sek_days_sorted[-1]]}%)'\n        )\n\n        def _sek_cb_interp(_target):\n            # Returns (rate, d0, d1) \u2014 d0==d1 signals a clamp at the\n            # curve edge (no interpolation),\
        \ d0<d1 signals genuine\n            # linear interpolation between those two tenor points.\n            if _target <= _sek_days_sorted[0]:\n                return _sek_cb_curve[_sek_days_sorted[0]], _sek_days_sorted[0], _sek_days_sorted[0]\n            if _target >= _sek_days_sorted[-1]:\n                return _sek_cb_curve[_sek_days_sorted[-1]], _sek_days_sorted[-1], _sek_days_sorted[-1]\n            for _i in range(len(_sek_days_sorted) - 1):\n                _d0, _d1 = _sek_days_sorted[_i], _sek_days_sorted[_i + 1]\n                if _d0 <= _target <= _d1:\n                    _r0, _r1 = _sek_cb_curve[_d0], _sek_cb_curve[_d1]\n                    _w = (_target - _d0) / (_d1 - _d0)\n                    return _r0 + _w * (_r1 - _r0), _d0, _d1\n            return _sek_cb_curve[_sek_days_sorted[-1]], _sek_days_sorted[-1], _sek_days_sorted[-1]\n\n        _mtg_list_sek = sorted(\n            _sek_dt.strptime(_ds, '%Y-%m-%d').date()\n            for _ds in CALENDAR_2026.get('SEK',\
        \ [])\n        )\n        _future_mtgs_sek = _next_unresolved_meetings('SEK', _mtg_list_sek, _sek_today)\n\n        if len(_future_mtgs_sek) >= 1:\n            _st1_date = _future_mtgs_sek[0]\n            _st2_date = (\n                _future_mtgs_sek[1] if len(_future_mtgs_sek) >= 2\n                else (_st1_date + _sek_td(days=42))\n            )\n            _st1_days = (_st1_date - _sek_today).days\n            _st2_days = (_st2_date - _sek_today).days\n\n            if _st1_days >= 0 and _st2_days > _st1_days:\n                if _st1_days < _sek_days_sorted[0]:\n                    print(\n                        f'    [SEK] note: next meeting ({_st1_days}d) is closer than the '\n                        f'shortest curve tenor ({_sek_days_sorted[0]}d) \u2014 clamping to the '\n                        f'1M print rather than interpolating (see TIER 0 limitation above)'\n                    )\n                _sek_ois_t1, _sek_t1_d0, _sek_t1_d1 = _sek_cb_interp(_st1_days)\n\
        \                _sek_ois_t2, _sek_t2_d0, _sek_t2_d1 = _sek_cb_interp(_st2_days)\n                _sek_fwd = (_st2_days * _sek_ois_t2 - _st1_days * _sek_ois_t1) / (_st2_days - _st1_days)\n                print(\n                    f'    [SEK] cbonds curve: OIS({_st1_days}d\u2192{_st1_date})={_sek_ois_t1:.4f}%  '\n                    f'[{_sek_t1_d0}d-{_sek_t1_d1}d]  '\n                    f'OIS({_st2_days}d\u2192{_st2_date})={_sek_ois_t2:.4f}%  '\n                    f'[{_sek_t2_d0}d-{_sek_t2_d1}d]'\n                )\n                print(\n                    f'    [SEK] cbonds implied post-meeting forward={_sek_fwd:.4f}%  Riksbank={policy}%'\n                )\n                _sb0, _scp0, _shp0 = classify(_sek_fwd, policy)\n                if _sb0 is not None:\n                    print(f'    [SEK] cbonds OIS curve \u2192 {_sb0}  cutProb={_scp0}  hikeProb={_shp0}  [ois]')\n                    _source_override['SEK'] = 'ois'\n                    return _sb0, _scp0, _shp0\n\n\
        \    # \u2500\u2500 TIER 1: SWESTR spot via the Riksbank's dedicated SWESTR REST API \u2500\u2500\n    swestr = None\n    swestr_date = None\n    try:\n        from datetime import date as _date, timedelta\n        today_sek = _date.today()\n        from_date_sek = (today_sek - timedelta(days=10)).strftime('%Y-%m-%d')\n        swestr_url = (\n            'https://api.riksbank.se/swestr/v1/all/SWESTR'\n            f'?fromDate={from_date_sek}'\n        )\n        r = requests.get(swestr_url, headers=HEADERS, timeout=15)\n        r.raise_for_status()\n        rows = r.json()\n        policy_for_guard = current_rate('SEK')\n        for row in reversed(rows):  # most recent last in response \u2192 iterate backwards\n            if row.get('alternativeCalculation'):\n                continue\n            try:\n                candidate = float(row['rate'])\n            except (TypeError, ValueError, KeyError):\n                continue\n            if policy_for_guard is not None and abs(candidate\
        \ - policy_for_guard) > 2.00:\n                print(f'    [SEK] SWESTR candidate {candidate}% on {row.get(\"date\")} '\n                      f'fails \xB1200bp sanity check vs policy {policy_for_guard}% \u2014 skipping')\n                continue\n            swestr = candidate\n            swestr_date = row.get('date')\n            break\n    except Exception as e:\n        print(f'    [SEK] Riksbank SWESTR API failed: {e}')\n\n    if swestr is not None and swestr_date is not None:\n        try:\n            from datetime import date as _cd2\n            _swestr_d = date.fromisoformat(swestr_date)\n            _days_old = (_cd2.today() - _swestr_d).days\n        except Exception:\n            _days_old = 99\n        if _days_old > 5:\n            print(f'    [SEK] SWESTR={swestr}% dated {swestr_date} is {_days_old}d old '\n                  f'\u2014 exceeds 5-day staleness guard, falling through to heuristic')\n        else:\n            print(f'    [SEK] SWESTR={swestr}% (Riksbank\
        \ swestr/v1 \xB7 {swestr_date})')\n            print(f'    [SEK] SWESTR={swestr}%  Riksbank rate={policy}%')\n            _bias, _cp, _hp = classify(swestr, policy, threshold=THRESHOLD)\n\n            if _bias == 'cut':\n                # Trajectory guard: does rates/SEK.json show an actual recent\n                # cut, or has the Riksbank just been holding?\n                # NOTE: assumes rates/SEK.json observations are one-per-meeting\n                # (same assumption months_since_last_change() below already\n                # makes \u2014 not a new convention introduced here).\n                TRAJECTORY_LOOKBACK = 6  # meetings (~1 year at 6/yr cadence)\n                _sek_obs = load_rate_obs('SEK')\n                _recent_cut = False\n                if _sek_obs and len(_sek_obs) >= 2:\n                    try:\n                        _r0 = float(_sek_obs[0]['value'])\n                        for _o in _sek_obs[1:TRAJECTORY_LOOKBACK + 1]:\n                          \
        \  if float(_o['value']) > _r0:\n                                _recent_cut = True\n                                break\n                    except Exception:\n                        pass\n                if not _recent_cut:\n                    _cp_demoted = min(15, _cp or 0)\n                    print(f'    [SEK] SWESTR spread implies cut (cutProb={_cp}%) but '\n                          f'rates/SEK.json shows no cut in last {TRAJECTORY_LOOKBACK} '\n                          f'meetings (held at {policy}%) \u2014 demoting to hold, '\n                          f'cutProb capped at {_cp_demoted}% (v8.4.1 trajectory guard)')\n                    return 'hold', _cp_demoted, 0\n                else:\n                    print(f'    [SEK] SWESTR cut signal corroborated by recent '\n                          f'policy-rate trajectory \u2014 keeping cut, cutProb={_cp}%')\n                    return _bias, _cp, _hp\n            else:\n                return _bias, _cp, _hp\n    else:\n\
        \        print('    [SEK] No valid SWESTR observation in the last 10 days')\n\n    print('    [SEK] Falling through to rate-trajectory heuristic')\n    return None, None, None\n\n# \u2500\u2500 Heuristic fallback: rate trajectory from rates/*.json \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Replicates GUIDELINES.md pause_detection rule (3-month threshold).\n\nPAUSE_MONTHS = 3\nHAWKISH_OVERRIDE = {'JPY': 'hike', 'AUD': 'hike'}\n\ndef months_since_last_change(obs):\n    if len(obs) < 2:\n        return 99\n    r0 = float(obs[0]['value'])\n    for i, o in enumerate(obs[1:], 1):\n        try:\n            if float(o['value']) != r0:\n                return i\n        except Exception:\n            break\n    return 99\n\ndef heuristic_bias(ccy):\n    obs = load_rate_obs(ccy)\n    if not obs:\n        return HAWKISH_OVERRIDE.get(ccy, 'hold')\n    t = date.today()\n    r0 = float(obs[0]['value'])\n    r1 = float(obs[1]['value']) if len(obs) > 1 else\
        \ r0\n    try:\n        age = date.fromisoformat(obs[0]['date'][:10])\n        months_old = (t.year - age.year) * 12 + (t.month - age.month)\n    except Exception:\n        months_old = 99\n    if months_old <= PAUSE_MONTHS:\n        if r0 > r1:\n            return 'hike'\n        if r0 < r1:\n            return 'cut'\n    if months_since_last_change(obs) >= PAUSE_MONTHS:\n        return HAWKISH_OVERRIDE.get(ccy, 'hold')\n    vals = [float(o['value']) for o in obs[:6] if o.get('value')]\n    if len(vals) >= 3:\n        if vals[0] > vals[-1]:\n            return 'hike'\n        if vals[0] < vals[-1]:\n            return 'cut'\n    return HAWKISH_OVERRIDE.get(ccy, 'hold')\n\n# \u2500\u2500 Dispatch \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nFETCHERS = {\n    'USD': fetch_bias_usd,\n    'EUR': fetch_bias_eur,\n    'GBP': fetch_bias_gbp,\n    'JPY': fetch_bias_jpy,\n    'AUD': fetch_bias_aud,\n    'CAD': fetch_bias_cad,\n    'CHF': fetch_bias_chf,\n    'NZD': fetch_bias_nzd,\n    'NOK': fetch_bias_nok,\n    'SEK': fetch_bias_sek,\n}\n\n# \u2500\u2500 Load existing data for change detection and OIS preservation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexisting = {}\ntry:\n    with open('meetings-data/meetings.json') as f:\n        for ccy, cd in json.load(f).get('meetings', {}).items():\n            existing[ccy] = cd\nexcept Exception:\n    pass\n\n# \u2500\u2500 Build output \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ntoday     = date.today()\ntoday_str = str(today)\noutput    = {}\n\nprint('=' * 70)\nprint('CB MEETINGS \u2014 STATIC CALENDAR + OIS-IMPLIED BIAS (v8.46.0)')\nprint('=' * 70)\n\nfor ccy in ['USD','EUR','GBP','JPY','AUD','CAD','CHF','NZD','NOK','SEK']:\n    all_dates = CALENDAR_2026.get(ccy, [])\n    # v8.46.0: skip a meeting dated today/earlier once its decision has\n    # actually been released (per ff_calendar.json) \u2014 otherwise\n    # `nextMeeting` keeps showing an already-decided date instead of\n    # advancing to the real next meeting.\n    future    = sorted(\n        d for d in all_dates\n        if date.fromisoformat(d) >= today\n        and not _meeting_resolved(ccy, date.fromisoformat(d))\n    )\n    nxt       = future[0] if future else None\n\n    entry = {\n        'nextMeeting':          fmt(nxt) if nxt else 'TBD',\n        'nextMeetingISO':       nxt,\n        'allMeetings':          all_dates,\n        'allMeetingsFormatted':\
        \ [fmt(d) for d in all_dates],\n        'source':               SOURCE_MAP[ccy],\n    }\n\n    # Currencies whose fetchers can only produce trajectory-based signals.\n    # v7.45.0: AUD uses FRED IRSTCI01AUM156N (OECD overnight monthly \u2192 'spread').\n    #          NZD uses FRED IRSTCI01NZM156N (OECD overnight monthly \u2192 'spread').\n    #          Both have staleness guards (50bp vs current_rate) + trajectory fallback.\n    TRAJECTORY_ONLY = set()   # Empty \u2014 all CCYs have market-rate primary sources\n\n    print(f'  [{ccy}] fetching OIS-implied bias...')\n    try:\n        ois_bias, cut_prob, hike_prob = FETCHERS[ccy]()\n    except Exception as e:\n        print(f'    [{ccy}] fetcher exception: {e}')\n        ois_bias, cut_prob, hike_prob = None, None, None\n\n    prev_entry  = existing.get(ccy, {})\n    prev_bias   = prev_entry.get('bias', 'hold')\n    prev_method = prev_entry.get('biasMethod', 'heuristic')\n\n    # Detect trajectory fallback: fetcher returned a bias\
        \ but no probability\n    # data (cut_prob=None, hike_prob=None). This signals the heuristic path\n    # was taken because the primary OIS source was unavailable.\n    is_trajectory_fallback = (\n        ois_bias is not None\n        and cut_prob is None\n        and hike_prob is None\n    )\n\n    # CCYs whose primary source is a monthly rate spread (OECD), not a\n    # true daily OIS forward. These get biasMethod='spread' to distinguish\n    # from daily OIS sources (USD/EUR/GBP/JPY/CAD/CHF).\n    # Exception: if the fetcher registered a true OIS source in _source_override\n    # (e.g. NZD via NZFBF), the override takes precedence -> biasMethod='ois'.\n    # v8.118.0: USD added. fetch_bias_usd() compares FRED SOFR (secured\n    # overnight repo rate) against DFF (Fed Funds Effective) \u2014 a same-day\n    # level spread, not a forward-looking instrument. Unlike the cbonds\n    # OIS curves used for EUR/GBP/CAD/etc. (genuine meeting-bracketed\n    # forward rates priced by the\
        \ swap market), SOFR is not a term rate\n    # and carries no forward information about the next FOMC decision \u2014\n    # it trades within a few bp of the current target as a matter of\n    # money-market mechanics, so a SOFR-DFF gap reflects repo-market\n    # technicals, not market-implied hike/cut odds. classify()'s 25bp-\n    # step probability formula was previously applied to this spread and\n    # labeled as if it were CME Fed Funds futures (which the code never\n    # actually reads \u2014 no free API tier exists for CME FedWatch data).\n    # Corrected here to 'spread' so the UI's OIS/spread distinction stays\n    # accurate; see BIAS_SOURCE_LABELS['USD'] for the corrected label.\n    SPREAD_PROXY_CCYS = {'AUD', 'NZD', 'NOK', 'USD'}\n\n    if ois_bias is not None and not is_trajectory_fallback:\n        # OIS/overnight-rate signal with probability data.\n        # Daily sources -> 'ois'. Monthly OECD spread -> 'spread'.\n        # _source_override lets individual fetchers\
        \ upgrade to 'ois' (e.g. NZFBF).\n        _is_spread = (ccy in SPREAD_PROXY_CCYS and _source_override.get(ccy) != 'ois')\n        # v8.498.0: a fetcher can internally degrade from its own true-OIS\n        # tier down to a directionless spread tier WITHOUT raising (still\n        # returns valid bias/probs) \u2014 is_trajectory_fallback and the None\n        # check above never see this, so it would otherwise be published\n        # as if 'spread' were this CCY's normal primary signal. When that\n        # happened this run (_degraded_to_spread) and a genuine prior OIS\n        # directional read exists, preserve it instead of overwriting with\n        # the spread's non-directional reading \u2014 same 'ois-preserved'\n        # convention already used below for an outright-unavailable source.\n        if (_is_spread and _degraded_to_spread.get(ccy)\n                and prev_method in ('ois', 'ois-preserved')\n                and prev_bias in ('cut', 'hike')):\n            entry['bias']\
        \       = prev_bias\n            entry['biasSource'] = prev_entry.get('biasSource', 'preserved')\n            entry['biasMethod'] = 'ois-preserved'\n            entry['cutProb']    = prev_entry.get('cutProb')\n            entry['hikeProb']   = prev_entry.get('hikeProb')\n            cut_prob = entry['cutProb']\n            hike_prob = entry['hikeProb']\n            method_tag = 'OIS-preserved (degraded source)'\n        else:\n            entry['bias']       = ois_bias\n            entry['biasSource'] = BIAS_SOURCE_LABELS[ccy]\n            entry['biasMethod'] = 'spread' if _is_spread else 'ois'\n            method_tag = 'spread' if _is_spread else 'OIS'\n    elif is_trajectory_fallback:\n        # Trajectory-derived signal \u2014 always heuristic, no probability data.\n        entry['bias']       = ois_bias\n        entry['biasSource'] = BIAS_SOURCE_LABELS[ccy]\n        entry['biasMethod'] = 'heuristic'\n        cut_prob = hike_prob = None\n        method_tag = 'heuristic'\n    else:\n\
        \        fallback = heuristic_bias(ccy)\n        # Preserve a prior OIS directional signal rather than silently\n        # flipping to 'hold' when the source is temporarily unavailable.\n        if (fallback == 'hold'\n                and prev_method in ('ois', 'ois-preserved')\n                and prev_bias in ('cut', 'hike')):\n            entry['bias']       = prev_bias\n            entry['biasSource'] = prev_entry.get('biasSource', 'preserved')\n            entry['biasMethod'] = 'ois-preserved'\n            method_tag = 'OIS-preserved'\n        else:\n            entry['bias']       = fallback\n            entry['biasSource'] = BIAS_SOURCE_LABELS[ccy]\n            entry['biasMethod'] = 'heuristic'\n            method_tag = 'heuristic'\n        # Heuristic path has no probability data\n        cut_prob = hike_prob = None\n\n    entry['biasUpdated'] = today_str\n    entry['cutProb']     = cut_prob\n    entry['hikeProb']    = hike_prob\n\n    # \u2500\u2500 Compute fwdRate: probability-weighted\
        \ expected rate at next meeting \u2500\n    # Bloomberg WIRP standard: E[rate] = current + P(hike)*step - P(cut)*step\n    # Per-CB step size: 25bp for all G8 CBs (BoJ aligned since Jul 2024).\n    # Written to meetings.json so the modal uses it as Priority 1 (no ~ prefix\n    # and correct source label \"prob. weighted \xB7 OIS-derived probs\").\n    # Only computed when biasMethod is 'ois' or 'spread' (not heuristic).\n    # BoJ step: 10bp was only the Mar 2024 NIRP exit (-0.10\u2192+0.00).\n    # Every BoJ move since (Jul 2024, Jan 2025, Jun 2026) has been 25bp.\n    # 10bp here produced a systematic ~12bp downward bias in fwdRate for JPY.\n    _cb_step = 0.25\n    _fwd_rate = None\n    if entry.get('biasMethod') in ('ois', 'ois-preserved', 'spread'):\n        # v8.117.24: use the fetcher's own resolved policy anchor when it\n        # registered one (_policy_anchor) \u2014 this is the exact value the\n        # bias/probabilities above were classified against. Falls back to\n\
        \        # current_rate(ccy) for CCYs whose display rate IS the policy\n        # anchor (i.e. every CCY except EUR, where rates/EUR.json is\n        # MRO-basis but classify() runs on DFR-basis \u2014 see comment at\n        # _policy_anchor's definition). Without this, fwdRate mixed a\n        # MRO-basis base with DFR-basis probabilities for EUR, producing\n        # an internally inconsistent \"Impl.\" figure.\n        _cur_rate = _policy_anchor.get(ccy, current_rate(ccy))\n        if _cur_rate is not None:\n            _pc = cut_prob  if cut_prob  is not None else 0\n            _ph = hike_prob if hike_prob is not None else 0\n            _pc = min(_pc, 100);  _ph = min(_ph, 100 - _pc)\n            _fwd_rate = round(_cur_rate + (_ph / 100) * _cb_step - (_pc / 100) * _cb_step, 4)\n    entry['fwdRate'] = _fwd_rate\n\n    p_str = ''\n    if cut_prob  is not None: p_str += f'  cutProb={cut_prob}%'\n    if hike_prob is not None: p_str += f'  hikeProb={hike_prob}%'\n    chg = ' \u2190\
        \ CHANGED' if entry['bias'] != prev_bias else ''\n    print(f\"    result: {entry['bias']:5s}  [{method_tag}]{p_str}  (prev:{prev_bias}){chg}\")\n\n    output[ccy] = entry\n\nwith open('meetings-data/meetings.json', 'w') as f:\n    json.dump({'lastUpdate': today_str, 'meetings': output}, f, indent=2, ensure_ascii=False)\n\nprint()\nprint('=' * 70)\nprint('SUMMARY')\nprint('=' * 70)\nfor ccy, d in output.items():\n    p_str = ''\n    if d.get('cutProb')  is not None: p_str += f\"  cutProb={d['cutProb']}%\"\n    if d.get('hikeProb') is not None: p_str += f\"  hikeProb={d['hikeProb']}%\"\n    fwd_str = f\"  fwdRate={d['fwdRate']}\" if d.get('fwdRate') is not None else ''\n    print(f\"  {ccy}: {d['nextMeeting']:10s}  bias={d['bias']:5s}  method={d['biasMethod']:15s}  updated={d['biasUpdated']}{p_str}{fwd_str}\")\n\nEOFPYTHON\n"
    - name: Display meetings summary
      working-directory: site
      run: |
        python3 -c "
        import json
        with open('meetings-data/meetings.json') as f:
            data = json.load(f)
        print(f'Last Update: {data[\"lastUpdate\"]}')
        print()
        for curr, info in data['meetings'].items():
            parts = []
            if info.get('cutProb')  is not None: parts.append('cutProb={}%'.format(info['cutProb']))
            if info.get('hikeProb') is not None: parts.append('hikeProb={}%'.format(info['hikeProb']))
            p = ('  ' + '  '.join(parts)) if parts else ''
            print('  {}: {:10s}  bias={:5s}  method={:15s}  [{}]{}'.format(curr, info['nextMeeting'], info['bias'], info.get('biasMethod','?'), info.get('source','?'), p))
        "
    - name: Commit and push
      working-directory: site
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\ncp -r meetings-data/ /tmp/meetings_fresh/\nTIMESTAMP=$(date -u '+%Y-%m-%d')\n\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  cp -r /tmp/meetings_fresh/. meetings-data/\n  git add meetings-data/\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes vs remote HEAD \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"CB meetings OIS bias update ${TIMESTAMP}\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  echo \"Push rejected (attempt $i) \u2014 retrying in $((i * 2))s...\"\n  sleep $((i * 2))\ndone\necho \"\u26A0\uFE0F  All push attempts exhausted \u2014 data will refresh on next weekly run.\"\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-meetings
      cancel-in-progress: false
  update-extended-data:
    name: Update Extended Data v14.1
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-extended-data')) || (github.event_name == 'schedule' && contains(fromJSON('["0 6 * * *"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout PUBLIC site repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.PAT_TOKEN }}
        path: site
    - name: Checkout THIS private repo (scripts)
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-engine
        token: ${{ secrets.PAT_TOKEN }}
        path: engine
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests beautifulsoup4 lxml python-dateutil openpyxl --break-system-packages
    - name: Create directory
      run: mkdir -p site/extended-data
    - name: Update extended data
      working-directory: site
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python3 -u ../engine/scripts/update_extended_data.py
    - name: Commit and push
      working-directory: site
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\ngit add extended-data/\nif git diff --quiet && git diff --staged --quiet; then\n  echo \"No changes to commit\"\n  exit 0\nfi\ngit commit -m \"\U0001F4CA Extended data $(date +'%Y-%m-%d') \u2014 v14.1 (bonds/VIX/credit-spreads; inflation-exp preserved)\"\nfor i in 1 2 3; do\n  git push && echo \"\u2705 Push succeeded\" && exit 0\n  echo \"Push rejected (attempt $i) \u2014 rebasing...\"\n  git pull --rebase origin main\ndone\necho \"\u274C All push attempts failed \u2014 data not published.\"\nexit 1\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-extended-data
      cancel-in-progress: false
