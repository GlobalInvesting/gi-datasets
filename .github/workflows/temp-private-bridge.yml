name: TEMP Private Workflows Bridge
on:
  schedule:
  - cron: 0 8 * * *
  - cron: 0 4 * * 2
  - cron: 0 4 * * 4
  - cron: 0 4 * * 5
  - cron: 30 5 * * 2
  - cron: 30 3 * * 3
  - cron: 30 3 * * 4
  - cron: 0 10 * * 4
  - cron: 0 14 * * 4
  - cron: 0 14 * * 5
  - cron: 0 21 * * 3
  - cron: 0 21 * * 4
  - cron: 0 23 * * *
  - cron: 15 23 * * *
  - cron: 0 14 * * 1-5
  - cron: 17 */4 * * 1-5
  - cron: 17 8 * * 6,0
  - cron: 0 7 * * 3
  - cron: 15 */4 * * *
  - cron: 25 23 * * 1-5
  - cron: 20 23 * * 1-5
  - cron: 15 23 * * 1-5
  - cron: 30 12 * * 2-6
  - cron: 0 13 * * 1-5
  - cron: 0 10 * * *
  - cron: 0 6 * * *
  workflow_dispatch:
    inputs:
      only:
        description: Job id or all
        required: true
        default: all
        type: string
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
    - name: Check bridge window
      id: window
      run: if [ "$(date -u +%s)" -lt 1790812800 ]; then echo "active=true" >> "$GITHUB_OUTPUT"; else echo "active=false" >> "$GITHUB_OUTPUT"; fi
  update-rates:
    name: Update Interest Rates (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-rates')) || (github.event_name == 'schedule' && contains(fromJSON('["0 8 * * *", "0 4 * * 2", "0 4 * * 4", "0 4 * * 5", "30 5 * * 2", "30 3 * * 3", "30 3 * * 4", "0 10 * * 4", "0 14 * * 4", "0 14 * * 5", "0 21 * * 3", "0 21 * * 4"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests beautifulsoup4 lxml --break-system-packages
    - name: Create rates directory
      run: mkdir -p rates
    - name: Fetch and validate rates
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python private-scripts/fetch_rates.py
    - name: Display summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "         INTEREST RATES SUMMARY"
        echo "========================================"
        for currency in USD EUR GBP JPY CAD AUD CHF NZD NOK SEK; do
          if [ -f "rates/$currency.json" ]; then
            echo "[$currency]"
            python3 -c "
        import json
        with open('rates/$currency.json') as f:
            data = json.load(f)
        obs = data['observations']
        print(f'  Rate:     {obs[0][\"value\"]}%')
        print(f'  Date:     {obs[0][\"date\"]}')
        print(f'  History:  {len(obs)} observations')"
            echo ""
          fi
        done
        echo "[Health Status]"
        if [ -f "rates/health.json" ]; then
          python3 -c "
        import json
        with open('rates/health.json') as f:
            h = json.load(f)
        print(f'  Overall: {h[\"overallStatus\"]}')
        print(f'  Run:     {h[\"runTimestamp\"]}')
        for ccy, info in h['currencies'].items():
            print(f'  {ccy}: {info[\"rate\"]}%  [{info[\"status\"]}]  source={info[\"source\"] or \"N/A\"}')"
        fi
    - name: Commit and push
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\nmkdir -p /tmp/rates_fresh\ncp -r rates/. /tmp/rates_fresh/\nTIMESTAMP=$(date -u '+%Y-%m-%d')\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  cp -r /tmp/rates_fresh/. rates/\n  git add rates/\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"Rates ${TIMESTAMP} \u2014 scraping + validation\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  sleep $((i * 2))\ndone\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-rates
      cancel-in-progress: false
    permissions:
      contents: write
  update-bond-yields:
    name: Update Bond Yields (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-bond-yields')) || (github.event_name == 'schedule' && contains(fromJSON('["0 23 * * *"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: "Idempotency guard \u2014 skip if a sibling trigger already ran this cycle"
      id: guard
      run: "SKIP=false\nif [ \"${{ github.event_name }}\" != \"workflow_dispatch\" ] && [ -f \"private-scripts/ops-state/last-bond-yields.json\" ]; then\n  COMPLETED_AT=$(python3 -c \"import json; d=json.load(open('private-scripts/ops-state/last-bond-yields.json')); print(d.get('completed_at',''))\" 2>/dev/null || echo \"\")\n  if [ -n \"$COMPLETED_AT\" ]; then\n    AGE_MIN=$(python3 -c \"\nfrom datetime import datetime, timezone\nts = '$COMPLETED_AT'.replace('Z', '+00:00')\nage = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 60\nprint(int(age))\n\" 2>/dev/null || echo 9999)\n    if [ \"$AGE_MIN\" -lt 15 ] 2>/dev/null; then\n      echo \"Last run completed ${AGE_MIN} min ago (< 15 min) \u2014 a sibling trigger already ran this cycle. Skipping.\"\n      SKIP=true\n    fi\n  fi\nfi\necho \"skip=$SKIP\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Set up Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: pip install requests openpyxl --break-system-packages
    - name: Create output directory
      if: steps.guard.outputs.skip != 'true'
      run: mkdir -p extended-data
    - name: Fetch bond yields
      if: steps.guard.outputs.skip != 'true'
      env:
        SITE_DIR: .
        GI_RIKSBANK_API_KEY: ${{ secrets.GI_RIKSBANK_API_KEY }}
      run: python3 private-scripts/fetch_bond_yields.py
    - name: Record completion marker
      if: steps.guard.outputs.skip != 'true'
      working-directory: private-scripts
      run: "mkdir -p ops-state\nCOMPLETED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')\necho \"{\\\"completed_at\\\": \\\"$COMPLETED_AT\\\"}\" > ops-state/last-bond-yields.json\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\ngit add ops-state/last-bond-yields.json\nif git diff --staged --quiet; then\n  exit 0\nfi\ngit commit -m \"ops: bond-yields completion marker [${COMPLETED_AT}]\"\ngit push origin main || echo \"Push failed \u2014 next trigger will just re-run, no data loss.\"\n"
    - name: Display summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "       BOND YIELDS SUMMARY"
        echo "========================================"
        for ccy in USD EUR GBP JPY AUD CAD CHF NZD NOK SEK; do
          if [ -f "extended-data/${ccy}.json" ]; then
            python3 -c "
        import json
        with open('extended-data/${ccy}.json') as f:
            d = json.load(f)
        data  = d.get('data',  {})
        dates = d.get('dates', {})
        print(f'  ${ccy}:')
        for k, v in data.items():
            dt = dates.get(k, '?')
            print(f'    {k:18s} = {v}  ({dt})')
        "
          fi
        done
    - name: Commit and push
      if: steps.guard.outputs.skip != 'true'
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\ncp -r extended-data/ /tmp/bond_yields_fresh/\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')\n\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  cp -r /tmp/bond_yields_fresh/. extended-data/\n  git add extended-data/USD.json extended-data/EUR.json \\\n          extended-data/GBP.json extended-data/JPY.json \\\n          extended-data/AUD.json extended-data/CAD.json \\\n          extended-data/NZD.json extended-data/NOK.json \\\n          extended-data/SEK.json extended-data/CHF.json\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes vs remote HEAD \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"Bond yields ${TIMESTAMP} (US10Y/2Y/5Y, DE10Y, UK10Y, JP10Y, NO10Y, SE10Y, CH10Y/2Y)\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt\
        \ $i.\"\n    exit 0\n  fi\n  echo \"Push rejected (attempt $i) \u2014 retrying in $((i * 2))s...\"\n  sleep $((i * 2))\ndone\necho \"\u26A0\uFE0F  All push attempts exhausted \u2014 data will refresh on next scheduled run.\"\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-bond-yields
      cancel-in-progress: false
    permissions:
      contents: write
  update-ois-rates:
    name: Update OIS / Overnight Rates (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-ois-rates')) || (github.event_name == 'schedule' && contains(fromJSON('["15 23 * * *"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: "Idempotency guard \u2014 skip if a sibling trigger already ran this cycle"
      id: guard
      run: "SKIP=false\nif [ \"${{ github.event_name }}\" != \"workflow_dispatch\" ] && [ -f \"ois-rates/rates.json\" ]; then\n  UPDATED=$(python3 -c \"import json; d=json.load(open('ois-rates/rates.json')); print(d.get('updated',''))\" 2>/dev/null || echo \"\")\n  if [ -n \"$UPDATED\" ]; then\n    AGE_MIN=$(python3 -c \"\nfrom datetime import datetime, timezone\nts = '$UPDATED'.replace('Z', '+00:00')\nage = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 60\nprint(int(age))\n\" 2>/dev/null || echo 9999)\n    if [ \"$AGE_MIN\" -lt 15 ] 2>/dev/null; then\n      echo \"ois-rates/rates.json was updated ${AGE_MIN} min ago (< 15 min) \u2014 a sibling trigger already completed this cycle. Skipping the rest of this run.\"\n      SKIP=true\n    fi\n  fi\nfi\necho \"skip=$SKIP\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: pip install requests --break-system-packages
    - name: Create output directory
      if: steps.guard.outputs.skip != 'true'
      run: mkdir -p ois-rates
    - name: Fetch OIS rates
      if: steps.guard.outputs.skip != 'true'
      env:
        SITE_DIR: .
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python3 private-scripts/fetch_ois_rates.py
    - name: Display summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "         OIS / OVERNIGHT RATES"
        echo "========================================"
        if [ -f "ois-rates/rates.json" ]; then
          python3 -c "
        import json
        with open('ois-rates/rates.json') as f:
            d = json.load(f)
        print(f'  Updated: {d[\"updated\"]}')
        print()
        for ccy in ['USD','EUR','GBP','JPY','AUD','CAD','CHF','NZD','NOK','SEK']:
            rate = d['rates'].get(ccy, 'N/A')
            src  = d['sources'].get(ccy, '?')
            dt   = d['dates'].get(ccy, '?')
            print(f'  {ccy}: {str(rate):>8}%  [{src}]  ({dt})')
        "
        else
          echo "  ois-rates/rates.json not found"
        fi
    - name: Commit and push
      if: steps.guard.outputs.skip != 'true'
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\ncp ois-rates/rates.json /tmp/ois_rates_fresh.json\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')\n\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  mkdir -p ois-rates\n  cp /tmp/ois_rates_fresh.json ois-rates/rates.json\n  git add ois-rates/rates.json\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes vs remote HEAD \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"OIS rates ${TIMESTAMP} (SOFR/ESTR/SONIA/TONA/AONIA/CORRA/SARON/OCR/NOWA/SWESTR)\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  echo \"Push rejected (attempt $i) \u2014 retrying in $((i * 2))s...\"\n  sleep $((i * 2))\ndone\necho \"\u26A0\uFE0F  All push attempts exhausted \u2014 data will refresh on next run.\"\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-ois-rates
      cancel-in-progress: false
    permissions:
      contents: write
  update-dtcc-fx:
    name: Update DTCC FX OTC Volume (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-dtcc-fx')) || (github.event_name == 'schedule' && contains(fromJSON('["0 14 * * 1-5"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: "Idempotency guard \u2014 skip if a sibling trigger already ran today"
      id: guard
      run: "SKIP=false\nif [ \"${{ github.event_name }}\" != \"workflow_dispatch\" ] && [ -f \"dtcc-data/dtcc_fx.json\" ]; then\n  FETCHED=$(python3 -c \"import json; d=json.load(open('dtcc-data/dtcc_fx.json')); print(d.get('fetched',''))\" 2>/dev/null || echo \"\")\n  TODAY=$(date -u '+%Y-%m-%d')\n  if [ \"$FETCHED\" = \"$TODAY\" ]; then\n    echo \"dtcc-data/dtcc_fx.json was already fetched today (${TODAY}) \u2014 a sibling trigger already completed this cycle. Skipping the rest of this run.\"\n    SKIP=true\n  fi\nfi\necho \"skip=$SKIP\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: pip install requests --break-system-packages
    - name: Create output directory
      if: steps.guard.outputs.skip != 'true'
      run: mkdir -p dtcc-data
    - name: Fetch DTCC GTR FX data
      if: steps.guard.outputs.skip != 'true'
      run: python private-scripts/fetch_dtcc_fx.py
    - name: Display summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "        DTCC FX VOLUME SUMMARY"
        echo "========================================"
        if [ -f "dtcc-data/dtcc_fx.json" ]; then
          python3 -c "
        import json
        with open('dtcc-data/dtcc_fx.json') as f:
            d = json.load(f)
        print(f'Status:     {d.get(\"status\",\"?\")}')
        print(f'Trade date: {d.get(\"trade_date\",\"?\")}')
        t = d.get('totals', {})
        print(f'Total:      \${t.get(\"notional_usd_bn\",0):.1f}bn / {t.get(\"trade_count\",0):,} trades')"
        else
          echo "dtcc_fx.json not found"
        fi
    - name: Commit and push
      if: steps.guard.outputs.skip != 'true'
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\nmkdir -p /tmp/dtcc_fresh\ncp -r dtcc-data/. /tmp/dtcc_fresh/\nTIMESTAMP=$(date -u '+%Y-%m-%d')\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  cp -r /tmp/dtcc_fresh/. dtcc-data/\n  git add dtcc-data/\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"DTCC FX volume ${TIMESTAMP}\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  sleep $((i * 2))\ndone\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-dtcc-fx
      cancel-in-progress: false
    permissions:
      contents: write
  update-frankfurter-cache:
    name: Update Frankfurter FX Cache (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-frankfurter-cache')) || (github.event_name == 'schedule' && contains(fromJSON('["17 */4 * * 1-5", "17 8 * * 6,0"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install requests --break-system-packages
    - name: Create fx-data directory
      run: mkdir -p fx-data
    - name: Fetch Frankfurter data
      run: python private-scripts/fetch_frankfurter_cache.py
    - name: Display summary
      if: always()
      run: "echo \"\"\necho \"========================================\"\necho \"       FRANKFURTER CACHE SUMMARY\"\necho \"========================================\"\nif [ -f \"fx-data/frankfurter.json\" ]; then\n  python3 -c \"\nimport json\nwith open('fx-data/frankfurter.json') as f:\n    d = json.load(f)\nprint(f'  Updated:     {d[\\\"updated\\\"]}')\nprint(f'  Today date:  {d[\\\"today\\\"][\\\"date\\\"]}')\nprint(f'  Today rates: {list(d[\\\"today\\\"][\\\"rates\\\"].keys())}')\nprint(f'  Prev date:   {d[\\\"prev\\\"][\\\"date\\\"]}')\nseries_len = len(d.get(\\\"series\\\", {}).get(\\\"rates\\\", {}))\nprint(f'  Series days: {series_len}')\n\"\nelse\n  echo \"  \u274C fx-data/frankfurter.json NOT created\"\nfi\n"
    - name: Commit and push
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\nmkdir -p /tmp/frankfurter_fresh\ncp -r fx-data/. /tmp/frankfurter_fresh/\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')\n\nfor i in 1 2 3 4 5; do\n  echo \"--- Attempt $i ---\"\n  git fetch origin main\n  git reset --hard origin/main\n  cp -r /tmp/frankfurter_fresh/. fx-data/\n  git add fx-data/\n  if git diff --quiet && git diff --staged --quiet; then\n    echo \"No changes vs remote HEAD \u2014 skipping commit.\"\n    exit 0\n  fi\n  git commit -m \"ECB reference rate cache ${TIMESTAMP}\"\n  if git push origin main; then\n    echo \"\u2705 Push succeeded on attempt $i.\"\n    exit 0\n  fi\n  echo \"Push rejected (attempt $i) \u2014 retrying in $((i * 2))s...\"\n  sleep $((i * 2))\ndone\necho \"::warning::fx-data/frankfurter.json not committed - all push attempts exhausted\"\necho \"\u26A0\uFE0F  All push attempts exhausted \u2014 data will refresh on next scheduled\
        \ run.\"\nexit 0\n"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-frankfurter-cache
      cancel-in-progress: false
    permissions:
      contents: write
  update-inflation-expectations:
    name: Update Inflation Expectations (private)
    needs: gate
    if: needs.gate.outputs.active == 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'update-inflation-expectations')) || (github.event_name == 'schedule' && contains(fromJSON('["0 7 * * 3"]'), github.event.schedule)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout public repo
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/gi-datasets
        token: ${{ secrets.SCRIPTS_PAT }}
    - name: Checkout private scripts
      uses: actions/checkout@v6
      with:
        repository: GlobalInvesting/globalinvesting-scripts
        token: ${{ secrets.SCRIPTS_PAT }}
        path: private-scripts
    - name: "Idempotency guard \u2014 skip if a sibling trigger already ran this cycle"
      id: guard
      run: "SKIP=false\nif [ \"${{ github.event_name }}\" != \"workflow_dispatch\" ] && [ -f \"private-scripts/ops-state/last-inflation-expectations.json\" ]; then\n  COMPLETED_AT=$(python3 -c \"import json; d=json.load(open('private-scripts/ops-state/last-inflation-expectations.json')); print(d.get('completed_at',''))\" 2>/dev/null || echo \"\")\n  if [ -n \"$COMPLETED_AT\" ]; then\n    AGE_MIN=$(python3 -c \"\nfrom datetime import datetime, timezone\nts = '$COMPLETED_AT'.replace('Z', '+00:00')\nage = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 60\nprint(int(age))\n\" 2>/dev/null || echo 9999)\n    if [ \"$AGE_MIN\" -lt 15 ] 2>/dev/null; then\n      echo \"Last run completed ${AGE_MIN} min ago (< 15 min) \u2014 a sibling trigger already ran this cycle. Skipping.\"\n      SKIP=true\n    fi\n  fi\nfi\necho \"skip=$SKIP\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Setup Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: pip install requests openpyxl pypdf beautifulsoup4 lxml --break-system-packages
    - name: Create extended-data directory
      if: steps.guard.outputs.skip != 'true'
      run: mkdir -p extended-data
    - name: Fetch inflation expectations
      if: steps.guard.outputs.skip != 'true'
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python private-scripts/fetch_inflation_expectations.py .
    - name: Record completion marker
      if: steps.guard.outputs.skip != 'true'
      working-directory: private-scripts
      run: "mkdir -p ops-state\nCOMPLETED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')\necho \"{\\\"completed_at\\\": \\\"$COMPLETED_AT\\\"}\" > ops-state/last-inflation-expectations.json\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\ngit add ops-state/last-inflation-expectations.json\nif git diff --staged --quiet; then\n  exit 0\nfi\ngit commit -m \"ops: inflation-expectations completion marker [${COMPLETED_AT}]\"\ngit push origin main || echo \"Push failed \u2014 next trigger will just re-run, no data loss.\"\n"
    - name: Display summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "   INFLATION EXPECTATIONS SUMMARY"
        echo "========================================"
        for ccy in USD EUR GBP JPY AUD CAD CHF NZD NOK SEK; do
          file="extended-data/${ccy}.json"
          if [ -f "$file" ]; then
            val=$(jq -r '.data.inflationExpectations // "n/a"' "$file")
            dt=$(jq -r '.dates.inflationExpectations // "?"' "$file")
            echo "  ${ccy}  ${val}%  (${dt})"
          else
            echo "  ${ccy}  (file not found)"
          fi
        done
    - name: Commit and push
      if: steps.guard.outputs.skip != 'true'
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add extended-data/
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Inflation expectations $(date +'%Y-%m-%d') -- FRED breakevens / BOE survey / RBNZ survey / IMF (G10)"
        for i in 1 2 3; do
          git push && echo "Push succeeded" && exit 0
          echo "Push rejected (attempt $i) -- rebasing..."
          git pull --rebase origin main
        done
        echo "All push attempts failed."
        exit 1
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    concurrency:
      group: update-inflation-expectations
      cancel-in-progress: false
